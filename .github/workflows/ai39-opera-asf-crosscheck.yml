name: AI39 OPERA ASF historical metadata cross-check

on:
  push:
    branches: [ai39-opera-historical-discovery-20260825]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - run: python -m pip install --disable-pip-version-check asf_search==12.0.3
      - name: Search ASF OPERA-S1 RTC metadata
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import asf_search as asf

          WKT='POLYGON((37.65 48.25,38.25 48.25,38.25 48.90,37.65 48.90,37.65 48.25))'
          WINDOWS=[
            ('2023','2023-07-20T00:00:00Z','2023-08-20T23:59:59Z'),
            ('2024','2024-08-01T00:00:00Z','2024-08-30T23:59:59Z'),
            ('2025','2025-07-25T00:00:00Z','2025-08-25T23:59:59Z'),
          ]
          result={'status':'ASF_OPERA_HISTORICAL_METADATA_CROSSCHECK','generated_utc':datetime.now(timezone.utc).isoformat(),
                  'scope':'Historical OPERA-S1 RTC archive availability only; no downloads, geometries, current-condition or actor inference.',
                  'windows':[]}
          for label,start,end in WINDOWS:
              products=asf.geo_search(intersectsWith=WKT,dataset=asf.DATASET.OPERA_S1,
                                      processingLevel=asf.PRODUCT_TYPE.RTC,start=start,end=end,maxResults=5000)
              bursts={}; sensors={}; keys=set()
              sample_keys=set()
              for p in products:
                  pr=p.properties or {}; sample_keys.update(pr.keys())
                  burst=pr.get('operaBurstID') or pr.get('absoluteBurstID') or pr.get('burstID')
                  when=pr.get('startTime') or pr.get('sceneDate') or pr.get('validityStartDate')
                  platform=pr.get('platform') or pr.get('sensor')
                  if burst:
                      bursts.setdefault(str(burst),set()).add(str(when))
                  if platform: sensors[str(platform)]=sensors.get(str(platform),0)+1
                  if burst and when: keys.add((str(burst),str(when)))
              repeated={b:sorted(v) for b,v in bursts.items() if len(v)>=2}
              result['windows'].append({'label':label,'start':start,'end':end,'product_count':len(products),
                                        'unique_burst_time_count':len(keys),'unique_burst_count':len(bursts),
                                        'repeated_burst_count':len(repeated),'platform_counts':sensors,
                                        'property_keys':sorted(sample_keys),'repeated_bursts':dict(list(sorted(repeated.items()))[:200])})
          result['truth_rules']=['Archive availability is not surface-change evidence.','No raster data or geometry is exported.']
          Path('out/result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          qa={'status':'PASS','checks':{'three_windows':len(result['windows'])==3,'historical_only':True,'no_raster_download':True,
                                       'queries_returned':all(w['product_count']>0 for w in result['windows'])}}
          if not all(qa['checks'].values()): qa['status']='FAIL'
          Path('out/qa.json').write_text(json.dumps(qa,indent=2),encoding='utf-8')
          print(json.dumps({'qa':qa,'windows':[{k:w[k] for k in ('label','product_count','unique_burst_count','repeated_burst_count','platform_counts')} for w in result['windows']]},indent=2))
          if qa['status']!='PASS': raise RuntimeError(json.dumps(qa))
          PY
      - name: Hash outputs
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-opera-asf-crosscheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14
