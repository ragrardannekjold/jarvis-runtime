name: Command Center Truth Guard CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-truth-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-core:
    name: Verify exact AI-49 truth-guard core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public sanitized verification bundle
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private-source blob identities
        run: |
          test "$(git hash-object ci/ai49_core/jarvis/truth_guard.py)" = "76dcc503495bce5ab393012ca6f495a562c396aa"
          test "$(git hash-object ci/ai49_core/tests/test_truth_guard.py)" = "ad290e4587687629292fcff6890054fad22c6226"

      - name: Run exact core unit suite
        env:
          PYTHONPATH: ci/ai49_core
        run: python -m unittest discover -s ci/ai49_core/tests -v

      - name: Run ten fail-closed core canaries
        env:
          PYTHONPATH: ci/ai49_core
        run: |
          rm -rf /tmp/ai49-truth-guard-core
          python ci/ai49_core/run_canary.py \
            --repeat 10 \
            --output /tmp/ai49-truth-guard-core/terminal-readback.json

      - name: Upload terminal readback
        uses: actions/upload-artifact@v4
        with:
          name: ai49-truth-guard-core-terminal-readback
          path: /tmp/ai49-truth-guard-core/terminal-readback.json
          if-no-files-found: error
          retention-days: 7
