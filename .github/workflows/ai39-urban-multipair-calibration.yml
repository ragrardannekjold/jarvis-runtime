name: AI39 archival urban four-pair calibration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-urban-multipair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multipair-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install pinned geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.3 numpy==2.2.6 rasterio==1.4.3
          pystac-client==0.8.6 planetary-computer==1.0.0

      - name: Measure cross-pair envelope stability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/provenance
          python - <<'PY'
          import json, math
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np
          import rasterio, requests
          from pystac_client import Client
          import planetary_computer
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject, transform_bounds

          AOI=[37.65,48.25,38.25,48.90]
          CRS='EPSG:32637'; RES=30; BUILT=7
          STAC='https://earth-search.aws.element84.com/v1/search'
          COLL='sentinel-2-c1-l2a'
          CLEAR=np.array([4,5,6],np.uint8)
          FEATURES=['ndvi','nbr','bsi','ndbi']
          PAIRS=[
              ('S2B','2023-07-27','2023-08-06'),
              ('S2A','2025-08-02','2025-08-12'),
              ('S2B','2024-08-10','2024-08-20'),
              ('S2B','2023-08-06','2023-08-16'),
          ]
          COMMON_MIN=0.50

          def wj(path,value):
              Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')

          left,bottom,right,top=transform_bounds('EPSG:4326',CRS,*AOI,densify_pts=41)
          left=math.floor(left/RES)*RES; bottom=math.floor(bottom/RES)*RES
          right=math.ceil(right/RES)*RES; top=math.ceil(top/RES)*RES
          W=int(round((right-left)/RES)); H=int(round((top-bottom)/RES))
          TR=from_bounds(left,bottom,right,top,W,H)

          def rp(href,dtype='float32',resampling=Resampling.bilinear,nodata=np.nan):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.Env(
                  AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',
                  CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif,.TIF',
                  GDAL_HTTP_MAX_RETRY='3',GDAL_HTTP_RETRY_DELAY='2'):
                  with rasterio.open(href) as src:
                      reproject(
                          source=rasterio.band(src,1),destination=out,
                          src_transform=src.transform,src_crs=src.crs,src_nodata=src.nodata,
                          dst_transform=TR,dst_crs=CRS,dst_nodata=nodata,
                          resampling=resampling)
              return out

          pc=Client.open(
              'https://planetarycomputer.microsoft.com/api/stac/v1',
              modifier=planetary_computer.sign_inplace)

          def landcover(year):
              candidates=list(pc.search(
                  collections=['io-lulc-9-class'],bbox=AOI,
                  datetime=f'{year}-01-01/{year}-12-31').items())
              selected=[it for it in candidates if str(it.id).endswith(f'-{year}')]
              if not selected:
                  raise RuntimeError(f'no exact land-cover item {year}')
              arr=np.zeros((H,W),np.uint8); ids=[]
              for item in selected:
                  asset=(item.assets.get('data') or item.assets.get('map') or
                         next((a for a in item.assets.values()
                               if a.href.lower().endswith(('.tif','.tiff'))),None))
                  if asset is None: continue
                  tile=rp(asset.href,'uint8',Resampling.nearest,0)
                  m=tile>0; arr[m]=tile[m]; ids.append(str(item.id))
              coverage=float((arr>0).mean())
              if coverage<0.95 or any(not x.endswith(f'-{year}') for x in ids):
                  raise RuntimeError(f'land-cover provenance failed {year}')
              return arr,sorted(ids),coverage

          lc21,ids21,cov21=landcover(2021)
          lc22,ids22,cov22=landcover(2022)
          stable=(lc21==BUILT)&(lc22==BUILT)
          core=stable.copy(); padded=np.pad(stable,1,constant_values=False)
          for dy in range(3):
              for dx in range(3):
                  core &= padded[dy:dy+H,dx:dx+W]
          core_n=int(core.sum())
          if core_n<5000: raise RuntimeError('urban core too small')

          unique_keys=sorted({(platform,day) for platform,a,b in PAIRS for day in (a,b)})
          scenes={}; provenance={}

          def load_scene(platform,day):
              body={'collections':[COLL],'bbox':AOI,
                    'datetime':f'{day}T00:00:00Z/{day}T23:59:59Z','limit':100}
              response=requests.post(STAC,json=body,timeout=120)
              response.raise_for_status()
              all_items=response.json().get('features',[])
              items=[item for item in all_items
                     if str(item.get('id') or '').split('_',1)[0]==platform]
              required=['red','blue','nir08','swir16','swir22','scl']
              red=np.full((H,W),np.nan,np.float32); blue=red.copy(); nir=red.copy()
              s16=red.copy(); s22=red.copy(); scl=np.zeros((H,W),np.uint8); used=[]
              for item in items:
                  assets=item.get('assets',{})
                  if not all((assets.get(k) or {}).get('href') for k in required): continue
                  try:
                      rr=rp(assets['red']['href']); bb=rp(assets['blue']['href'])
                      nn=rp(assets['nir08']['href']); x16=rp(assets['swir16']['href'])
                      x22=rp(assets['swir22']['href'])
                      cc=rp(assets['scl']['href'],'uint8',Resampling.nearest,0)
                  except Exception:
                      continue
                  valid=(np.isfinite(rr)&np.isfinite(bb)&np.isfinite(nn)&
                         np.isfinite(x16)&np.isfinite(x22)&
                         (rr>0)&(bb>0)&(nn>0)&(x16>0)&(x22>0)&(cc>0))
                  red[valid]=rr[valid]; blue[valid]=bb[valid]; nir[valid]=nn[valid]
                  s16[valid]=x16[valid]; s22[valid]=x22[valid]; scl[valid]=cc[valid]
                  used.append(str(item.get('id')))
              clear=core&np.isin(scl,CLEAR)&np.isfinite(red)&np.isfinite(blue)&np.isfinite(nir)&np.isfinite(s16)&np.isfinite(s22)
              def idx(num,den):
                  out=np.full((H,W),np.nan,np.float32)
                  out[clear]=num[clear]/(den[clear]+1e-6)
                  return out
              scene={
                  'platform':platform,'day':day,'clear':clear,
                  'clear_fraction':float(clear.sum()/core_n),
                  'scene_ids':sorted(set(used)),
                  'features':{
                      'ndvi':idx(nir-red,nir+red),
                      'nbr':idx(nir-s22,nir+s22),
                      'bsi':idx((s16+red)-(nir+blue),(s16+red)+(nir+blue)),
                      'ndbi':idx(s16-nir,s16+nir)}}
              provenance[f'{platform}|{day}']={
                  'request':body,'selected_scene_ids':scene['scene_ids'],
                  'clear_fraction':round(scene['clear_fraction'],8)}
              return scene

          for key in unique_keys:
              scenes[key]=load_scene(*key)
          wj('out/provenance/scenes.json',provenance)

          pair_results=[]
          pooled={name:[] for name in FEATURES}
          p995={name:[] for name in FEATURES}
          p99={name:[] for name in FEATURES}
          joint_fracs=[]

          for platform,day_a,day_b in PAIRS:
              a=scenes[(platform,day_a)]; b=scenes[(platform,day_b)]
              common=a['clear']&b['clear']
              common_px=int(common.sum()); common_frac=float(common_px/core_n)
              if a['clear_fraction']<0.50 or b['clear_fraction']<0.50 or common_frac<COMMON_MIN:
                  raise RuntimeError(
                      f'pair fell below preserved discovery floor {platform} {day_a} {day_b}: '
                      f'{a["clear_fraction"]:.6f} {b["clear_fraction"]:.6f} {common_frac:.6f}')
              feature_stats={}; thresholds={}; diff_arrays={}
              for name in FEATURES:
                  diff=np.abs(b['features'][name]-a['features'][name])
                  values=diff[common]
                  stats={
                      'median':float(np.nanmedian(values)),
                      'p90':float(np.nanpercentile(values,90)),
                      'p95':float(np.nanpercentile(values,95)),
                      'p99':float(np.nanpercentile(values,99)),
                      'p99_5':float(np.nanpercentile(values,99.5)),
                      'p99_9':float(np.nanpercentile(values,99.9))}
                  feature_stats[name]={k:round(v,8) for k,v in stats.items()}
                  thresholds[name]=stats['p99_5']; p995[name].append(stats['p99_5']); p99[name].append(stats['p99'])
                  pooled[name].append(values.astype(np.float32,copy=False)); diff_arrays[name]=diff
              exceed=np.zeros((H,W),np.uint8)
              for name in FEATURES:
                  exceed += (common&(diff_arrays[name]>=thresholds[name])).astype(np.uint8)
              joint=common&(exceed>=2)
              joint_frac=float(joint.sum()/common_px); joint_fracs.append(joint_frac)
              pair_results.append({
                  'platform':platform,'day_a':day_a,'day_b':day_b,
                  'separation_days':(datetime.fromisoformat(day_b)-datetime.fromisoformat(day_a)).days,
                  'day_a_clear_fraction':round(a['clear_fraction'],8),
                  'day_b_clear_fraction':round(b['clear_fraction'],8),
                  'common_clear_px':common_px,'common_clear_fraction':round(common_frac,8),
                  'feature_abs_difference':feature_stats,
                  'joint_tail_px':int(joint.sum()),
                  'joint_tail_fraction':round(joint_frac,8)})

          stability={}; pooled_stats={}
          for name in FEATURES:
              vals=np.array(p995[name],float)
              median=float(np.median(vals)); lo=float(vals.min()); hi=float(vals.max())
              relative_range=(hi-lo)/max(median,1e-9)
              ratio=hi/max(lo,1e-9)
              pooled_values=np.concatenate(pooled[name])
              stability[name]={
                  'pair_p99_5':[round(float(v),8) for v in vals],
                  'median_p99_5':round(median,8),
                  'min_p99_5':round(lo,8),
                  'max_p99_5':round(hi,8),
                  'max_min_ratio':round(ratio,4),
                  'relative_range_over_median':round(relative_range,4),
                  'within_25pct_relative_range':bool(relative_range<=0.25)}
              pooled_stats[name]={
                  'p99':round(float(np.nanpercentile(pooled_values,99)),8),
                  'p99_5':round(float(np.nanpercentile(pooled_values,99.5)),8),
                  'p99_9':round(float(np.nanpercentile(pooled_values,99.9)),8)}

          joint_arr=np.array(joint_fracs,float)
          all_stable=all(v['within_25pct_relative_range'] for v in stability.values())
          result={
              'status':'MEASURED_ARCHIVAL_MULTIPAIR_VARIABILITY_CALIBRATION',
              'generated_utc':datetime.now(timezone.utc).isoformat(),
              'purpose':'Test whether the single-pair 10-day optical variability envelope is stable across all four qualifying archived same-platform pairs.',
              'scope':'Historical detector QA only; no current-condition, route, actor, threat, or presence inference.',
              'urban_mask':{
                  'exact_year_ids':{'2021':ids21,'2022':ids22},
                  'coverage':{'2021':cov21,'2022':cov22},'eroded_core_px':core_n},
              'pair_count':len(pair_results),'pairs':pair_results,
              'p99_5_cross_pair_stability':stability,
              'pooled_abs_difference_tail':pooled_stats,
              'joint_tail_fraction_across_pairs':{
                  'values':[round(float(v),8) for v in joint_arr],
                  'median':round(float(np.median(joint_arr)),8),
                  'min':round(float(joint_arr.min()),8),
                  'max':round(float(joint_arr.max()),8)},
              'descriptive_25pct_stability_gate_all_features':all_stable,
              'truth_rules':[
                  'The 25% relative-range flag is a descriptive QA heuristic, not a universal physical law.',
                  'Each pair is a 10-day archival envelope containing acquisition variability plus possible real surface changes.',
                  'Cross-pair instability argues against one fixed AOI-wide raw-difference threshold.',
                  'Pooled tails are skepticism floors for method QA, not causal/activity thresholds.',
                  'No geometry or object-level outputs are exported.'],
              'next_gate':(
                  'If cross-pair tails are stable, retain pooled p99/p99.5 only as a conservative optical skepticism floor and still require contextual scoring. '
                  'If unstable, reject fixed raw thresholds and keep adaptive sector/local-context normalization as mandatory.')}
          wj('out/result.json',result)
          qa={'status':'PASS','checks':{
              'exact_year_landcover':(
                  all(x.endswith('-2021') for x in ids21) and
                  all(x.endswith('-2022') for x in ids22)),
              'four_preserved_pairs':len(pair_results)==4,
              'all_pair_common_clear_ge_0_50':all(row['common_clear_fraction']>=0.50 for row in pair_results),
              'historical_only':True,'no_geometry_export':True,'no_generated_pixels':True}}
          if not all(qa['checks'].values()): qa['status']='FAIL'
          wj('out/qa.json',qa)
          if qa['status']!='PASS': raise RuntimeError(json.dumps(qa))
          print(json.dumps({
              'qa':qa,
              'pair_summaries':[(r['platform'],r['day_a'],r['day_b'],r['common_clear_fraction'],r['joint_tail_fraction']) for r in pair_results],
              'stability':stability,
              'pooled':pooled_stats,
              'all_stable_25pct':all_stable
          },indent=2))
          PY

      - name: Verify bounded output and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = MEASURED_ARCHIVAL_MULTIPAIR_VARIABILITY_CALIBRATION
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          test "$(du -sb out | cut -f1)" -le 5242880
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)

      - name: Upload multi-pair calibration
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-urban-multipair-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Record digest
        if: success()
        run: echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
