name: Search Dispatcher CI

on:
  push:
    paths:
      - 'runtime/search_dispatcher/**'
      - 'plugin/utility-search/**'
      - 'ci/ai49_core/jarvis/truth_guard.py'
      - '.github/workflows/search-dispatcher-ci.yml'
  pull_request:
    paths:
      - 'runtime/search_dispatcher/**'
      - 'plugin/utility-search/**'
      - 'ci/ai49_core/jarvis/truth_guard.py'
      - '.github/workflows/search-dispatcher-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-dispatcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify dispatcher, executor, and restart recovery
        run: >-
          python runtime/search_dispatcher/verify_all.py
          --receipt "$RUNNER_TEMP/search-dispatcher-verification.json"
