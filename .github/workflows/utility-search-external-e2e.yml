name: Utility Search External E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Utility Search base URL, for example https://utility.example.com"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: utility-search-external-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal MCP dependencies
        working-directory: plugin/utility-search
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify external health + MCP initialize + functional tools
        working-directory: plugin/utility-search
        env:
          UTILITY_SEARCH_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/verify-external-e2e.mjs "$UTILITY_SEARCH_BASE_URL" | tee external-e2e-readback.json
      - name: Upload E2E readback
        uses: actions/upload-artifact@v4
        with:
          name: utility-search-external-e2e-readback
          path: plugin/utility-search/external-e2e-readback.json
          if-no-files-found: error
          retention-days: 14
