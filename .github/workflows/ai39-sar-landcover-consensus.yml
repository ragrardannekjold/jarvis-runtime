name: AI39 SAR landcover repeat consensus

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy rasterio pystac-client planetary-computer
      - name: Broad SAR repeat consensus by landcover class
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, math, warnings
          from collections import defaultdict
          from datetime import datetime, timezone
          import numpy as np, rasterio
          from scipy import ndimage as ndi
          from rasterio.vrt import WarpedVRT
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject
          from pystac_client import Client
          import planetary_computer

          warnings.filterwarnings('ignore')
          BBOX=[37.65,48.45,38.25,48.90]
          START='2026-07-24'; END='2026-08-23'; W,H=1000,750
          TR=from_bounds(*BBOX,W,H)
          cat=Client.open('https://planetarycomputer.microsoft.com/api/stac/v1',modifier=planetary_computer.sign_inplace)

          def rp(href,dtype='float32',resampling=Resampling.bilinear,nodata=0):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.open(href) as ds:
                  reproject(source=rasterio.band(ds,1),destination=out,src_transform=ds.transform,src_crs=ds.crs,
                    src_nodata=ds.nodata,dst_transform=TR,dst_crs='EPSG:4326',dst_nodata=nodata,resampling=resampling)
              return out

          # 2023 landcover is used strictly as a historical prior.
          lc=np.zeros((H,W),np.uint8); lc_ids=[]
          for it in cat.search(collections=['io-lulc-9-class'],bbox=BBOX,datetime='2023-01-01/2023-12-31').items():
              a=it.assets.get('data') or it.assets.get('map') or next((x for x in it.assets.values() if x.href.lower().endswith(('.tif','.tiff'))),None)
              if not a: continue
              try:
                  tmp=rp(a.href,'uint8',Resampling.nearest,0); m=tmp>0; lc[m]=tmp[m]; lc_ids.append(it.id)
              except Exception: pass
          if (lc>0).mean()<0.5: raise SystemExit('insufficient landcover coverage')
          crop=(lc==5); built=(lc==7); bare=(lc==8); rangeland=(lc==11); noncrop=(built|bare|rangeland)

          items=list(cat.search(collections=['sentinel-1-rtc'],bbox=BBOX,datetime=START+'/'+END,max_items=400).items())
          groups=defaultdict(lambda:defaultdict(list))
          for it in items:
              p=it.properties; dt=it.datetime; date=dt.date().isoformat() if dt else (p.get('datetime') or '')[:10]
              platform=str(p.get('platform') or '').lower(); rel=p.get('sat:relative_orbit'); state=p.get('sat:orbit_state')
              if date and platform and rel is not None and 'vv' in it.assets and 'vh' in it.assets:
                  groups[(platform,int(rel),state)][date].append(it)
          cand=[]
          for geom,dates in groups.items():
              ds=sorted(dates)
              for i,a in enumerate(ds):
                  for b in ds[i+1:]:
                      sep=(datetime.fromisoformat(b)-datetime.fromisoformat(a)).days
                      if 10<=sep<=14: cand.append((b,a,geom,dates[a],dates[b]))
          cand.sort(reverse=True,key=lambda x:(x[0],x[1]))
          chosen=[]; seen=set()
          for rec in cand:
              key=(rec[2],rec[1],rec[0])
              if key in seen: continue
              seen.add(key); chosen.append(rec)
              if len(chosen)>=10: break

          def mosaic(its,key):
              dst=np.full((H,W),np.nan,np.float32)
              for it in its:
                  try:
                      with rasterio.open(it.assets[key].href) as ds:
                          with WarpedVRT(ds,crs='EPSG:4326',transform=TR,width=W,height=H,resampling=Resampling.bilinear,nodata=np.nan) as vrt:
                              a=vrt.read(1).astype(np.float32)
                      m=np.isfinite(a)&(a!=0); both=m&np.isfinite(dst); dst[both]=(dst[both]+a[both])/2; dst[m&~np.isfinite(dst)]=a[m&~np.isfinite(dst)]
                  except Exception: pass
              return dst
          def db(x,v):
              med=float(np.nanmedian(x[v])); return x.copy() if med<0 else 10*np.log10(np.maximum(x,1e-12))

          active=np.zeros((H,W),np.uint8); support=np.zeros((H,W),np.uint8); pairs=[]
          for b,a,geom,ia,ib in chosen:
              va=mosaic(ia,'vv'); ha=mosaic(ia,'vh'); vb=mosaic(ib,'vv'); hb=mosaic(ib,'vh')
              v=np.isfinite(va)&np.isfinite(ha)&np.isfinite(vb)&np.isfinite(hb)&(va!=0)&(ha!=0)&(vb!=0)&(hb!=0)
              if v.mean()<0.35:
                  pairs.append({'pair':[a,b],'geometry':[geom[0],geom[1],geom[2]],'status':'INSUFFICIENT_OVERLAP'}); continue
              av=db(va,v); ah=db(ha,v); bv=db(vb,v); bh=db(hb,v)
              mag=np.sqrt(((bv-av)**2+(bh-ah)**2)/2)
              hit=v&(mag>=3.0)
              support+=v.astype(np.uint8); active+=hit.astype(np.uint8)
              pairs.append({'pair':[a,b],'geometry':[geom[0],geom[1],geom[2]],'status':'MEASURED','valid_percent':round(float(v.mean()*100),2),'hit_percent':round(float(hit.sum()/v.sum()*100),3)})

          enough=support>=3
          rep2=enough&(active>=2); rep3=enough&(active>=3)

          def pct(mask,den):
              n=int(den.sum()); return round(float((mask&den).sum()/n*100),3) if n>100 else 0.0
          def morph(mask):
              lab,n=ndi.label(mask,structure=np.ones((3,3),int)); objs=ndi.find_objects(lab); rows=[]
              for i,sl in enumerate(objs,1):
                  if sl is None: continue
                  c=(lab[sl]==i); area=int(c.sum())
                  if area<4: continue
                  yy,xx=np.where(c); h=sl[0].stop-sl[0].start; w=sl[1].stop-sl[1].start
                  elong=1.0
                  if area>=3:
                      cv=np.cov(np.vstack([xx,yy])); vals=np.linalg.eigvalsh(cv); elong=float(math.sqrt((vals.max()+1e-9)/(vals.min()+1e-9)))
                  rows.append((area,max(w/h,h/w),elong,area/(w*h)))
              rows.sort(reverse=True)
              big=[x for x in rows if x[0]>=8]
              return {'components_ge4':len(rows),'components_ge8':len(big),'largest_component_px':rows[0][0] if rows else 0,'max_elongation_ge8':round(max((x[2] for x in big),default=0),2),'median_fill_ge8':round(float(np.median([x[3] for x in big])),3) if big else None}

          sectors=[]
          for rr in range(4):
              for cc in range(4):
                  sec=f"{'ABCD'[cc]}{rr+1}"; ys=slice(rr*H//4,(rr+1)*H//4); xs=slice(cc*W//4,(cc+1)*W//4)
                  sup=enough[ys,xs]; c=crop[ys,xs]&sup; n=noncrop[ys,xs]&sup; b=built[ys,xs]&sup
                  r2=rep2[ys,xs]; r3=rep3[ys,xs]
                  total_hits=int(r2.sum()); crop_hits=int((r2&c).sum()); noncrop_hits=int((r2&n).sum())
                  crop_share=round(crop_hits/max(total_hits,1)*100,1)
                  p2=pct(r2,sup); p3=pct(r3,sup); pc=pct(r2,c); pn=pct(r2,n); pb=pct(r2,b)
                  mm=morph(r2&n)
                  score=min(10,1.8*pn+0.8*p3+0.25*min(mm['max_elongation_ge8'],8))
                  status='LOW'
                  if crop_share>=75 and pn<0.5: status='CROP_DOMINATED'
                  elif pn>=1.0 and mm['components_ge8']>=1: status='NONCROP_REPEAT_CANDIDATE'
                  elif pn>=0.5: status='WEAK_NONCROP_REPEAT'
                  sectors.append({'sector':sec,'repeat2_percent':p2,'repeat3_percent':p3,'repeat2_crop_percent':pc,'repeat2_noncrop_percent':pn,'repeat2_built_percent':pb,'repeat2_crop_share_percent':crop_share,'noncrop_morphology':mm,'priority_score_0_10':round(score,2),'status':status})
          sectors.sort(key=lambda x:x['priority_score_0_10'],reverse=True)
          out={'status':'MEASURED','generated_utc':datetime.now(timezone.utc).isoformat(),'scope':'Broad 4x4 SAR repeat-consensus by historical landcover class; no coordinates, maps, routes or target-level output','window':[START,END],'measured_pairs':sum(1 for p in pairs if p['status']=='MEASURED'),'pair_summary':pairs,'landcover_items':lc_ids,'sector_summary':sectors,'method_limit':['2023 landcover is a historical prior, not 2026 ground truth.','SAR repeat can reflect moisture, vegetation, roughness or structure; this test only asks whether repeat signal is crop-dominated or survives on non-crop surfaces.','Linearity at this broad resolution is a lead, not proof of trenching or fortification.']}
          with open('out/analysis.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps({'measured_pairs':out['measured_pairs'],'top':sectors[:10]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-sar-landcover-consensus
          path: out/analysis.json
          if-no-files-found: error
          retention-days: 2
