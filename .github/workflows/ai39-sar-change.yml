name: AI39 SAR change

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests numpy rasterio
      - name: Same-orbit Sentinel-1 VV/VH broad change triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, math
          from collections import defaultdict
          from datetime import datetime, timezone
          import requests, numpy as np, rasterio
          from rasterio.warp import reproject
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds

          STAC='https://earth-search.aws.element84.com/v1/search'
          BBOX=[37.65,48.45,38.25,48.90]
          W,H=720,540
          PAIRS=[
            ('2026-08-10','2026-08-22',167,'descending'),
            ('2026-08-08','2026-08-20',145,'ascending'),
            ('2026-08-07','2026-08-19',43,'ascending'),
            ('2026-08-06','2026-08-18',21,'descending'),
            ('2026-08-05','2026-08-17',94,'descending'),
          ]
          r=requests.post(STAC,json={'collections':['sentinel-1-grd'],'bbox':BBOX,'datetime':'2026-08-04T00:00:00Z/2026-08-23T00:00:00Z','limit':200,
                                    'sortby':[{'field':'properties.datetime','direction':'desc'}]},timeout=90)
          r.raise_for_status(); items=r.json().get('features',[])
          by=defaultdict(list)
          for it in items:
              p=it.get('properties',{}); date=(p.get('datetime') or '')[:10]; orb=p.get('sat:relative_orbit'); state=p.get('sat:orbit_state')
              if orb is None: continue
              if not ((it.get('assets',{}).get('vv') or {}).get('href')): continue
              by[(date,int(orb),state)].append(it)

          dst_transform=from_bounds(*BBOX,W,H)
          def mosaic(date,orb,state,band):
              dst=np.zeros((H,W),dtype=np.float32); valid=np.zeros((H,W),dtype=bool); ids=[]
              for it in by.get((date,orb,state),[]):
                  href=(it.get('assets',{}).get(band) or {}).get('href')
                  if not href: continue
                  tmp=np.zeros((H,W),dtype=np.float32)
                  try:
                      with rasterio.Env(AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR'):
                          with rasterio.open(href) as ds:
                              reproject(source=rasterio.band(ds,1),destination=tmp,src_transform=ds.transform,src_crs=ds.crs,
                                        src_nodata=ds.nodata,dst_transform=dst_transform,dst_crs='EPSG:4326',dst_nodata=0,
                                        resampling=Resampling.average)
                  except Exception:
                      continue
                  m=np.isfinite(tmp)&(tmp>0)
                  fill=m&~valid
                  dst[fill]=tmp[fill]; valid[fill]=True; ids.append(it.get('id'))
              return dst,valid,sorted(set(ids))

          outpairs=[]
          for a,b,orb,state in PAIRS:
              avv,avm,aids=mosaic(a,orb,state,'vv'); bvv,bvm,bids=mosaic(b,orb,state,'vv')
              avh,ahm,_=mosaic(a,orb,state,'vh'); bvh,bhm,_=mosaic(b,orb,state,'vh')
              valid=avm&bvm&ahm&bhm
              if valid.mean()<0.05: continue
              eps=1e-6
              avv_db=10*np.log10(np.maximum(avv,eps)); bvv_db=10*np.log10(np.maximum(bvv,eps))
              avh_db=10*np.log10(np.maximum(avh,eps)); bvh_db=10*np.log10(np.maximum(bvh,eps))
              dvv=bvv_db-avv_db; dvh=bvh_db-avh_db
              cells=[]
              for rr in range(4):
                  for cc in range(4):
                      ys=slice(rr*H//4,(rr+1)*H//4); xs=slice(cc*W//4,(cc+1)*W//4)
                      v=valid[ys,xs]; x1=dvv[ys,xs]; x2=dvh[ys,xs]
                      if not v.any():
                          cells.append({'row':rr,'col':cc,'valid_percent':0.0}); continue
                      med_abs_vv=float(np.median(np.abs(x1[v]))); med_abs_vh=float(np.median(np.abs(x2[v])))
                      med_signed_vv=float(np.median(x1[v])); med_signed_vh=float(np.median(x2[v]))
                      pct3=float(((np.abs(x1[v])>=3)|(np.abs(x2[v])>=3)).mean()*100)
                      score=0.5*(med_abs_vv+med_abs_vh)
                      cells.append({'row':rr,'col':cc,'valid_percent':round(float(v.mean()*100),1),
                                    'median_abs_vv_db':round(med_abs_vv,3),'median_abs_vh_db':round(med_abs_vh,3),
                                    'median_signed_vv_db':round(med_signed_vv,3),'median_signed_vh_db':round(med_signed_vh,3),
                                    'pct_any_abs_change_ge_3db':round(pct3,2),'score':round(score,3)})
              vals=sorted([c['score'] for c in cells if 'score' in c],reverse=True)
              for c in cells:
                  if 'score' in c: c['relative_rank']=1+vals.index(c['score'])
              outpairs.append({'pair':[a,b],'relative_orbit':orb,'orbit_state':state,'pre_product_ids':aids,'post_product_ids':bids,
                               'common_valid_percent':round(float(valid.mean()*100),2),'cells_4x4':cells,
                               'limit':'Broad same-orbit backscatter-change triage only; moisture, vegetation, geometry, rain, roughness, damage and processing remain competing explanations.'})

          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'scope':'Broad Chasiv Yar–Bakhmut–Soledar corridor same-orbit SAR triage',
               'pairs':outpairs,'safety':'Broad 4x4 sectors only; no coordinates or target-level interpretation.'}
          json.dump(out,open('out/analysis.json','w'),indent=2); print(json.dumps(out,indent=2))
          if not outpairs: raise SystemExit('No usable same-orbit pairs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-sar-change
          path: out/analysis.json
          if-no-files-found: error
          retention-days: 2
