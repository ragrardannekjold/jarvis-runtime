name: AI39 EO multispectral

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  multispectral:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests numpy pillow rasterio
      - name: Cloud-mask and compare 17 to 20 August
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import requests, numpy as np, rasterio
          from PIL import Image
          from rasterio.warp import reproject
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds

          STAC='https://earth-search.aws.element84.com/v1/search'
          BBOX=[37.65,48.45,38.25,48.90]
          W,H=1200,900
          TARGETS={
            '2026-08-17':'20260817T082749',
            '2026-08-20':'20260820T083320',
          }
          r=requests.post(STAC,json={'collections':['sentinel-2-c1-l2a'],'bbox':BBOX,'datetime':'2026-08-17T00:00:00Z/2026-08-20T23:59:59Z','limit':100},timeout=90)
          r.raise_for_status(); items=r.json().get('features',[])
          dst_transform=from_bounds(*BBOX,W,H)

          def reproject_asset(href,resampling,dtype='float32'):
              dst=np.zeros((H,W),dtype=dtype)
              with rasterio.Env(AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR'):
                  with rasterio.open(href) as ds:
                      reproject(source=rasterio.band(ds,1),destination=dst,src_transform=ds.transform,src_crs=ds.crs,
                                src_nodata=ds.nodata,dst_transform=dst_transform,dst_crs='EPSG:4326',dst_nodata=0,resampling=resampling)
              return dst

          scenes={}; metadata=[]
          for date,token in TARGETS.items():
              its=[it for it in items if token in (it.get('id') or '')]
              if not its: raise RuntimeError(f'No items for {date} {token}')
              red=np.zeros((H,W),np.float32); nir=np.zeros((H,W),np.float32); swir=np.zeros((H,W),np.float32); scl=np.zeros((H,W),np.uint8)
              pids=[]
              for it in its:
                  a=it.get('assets',{}); pids.append(it.get('id'))
                  required=['red','nir08','swir22','scl']
                  if not all((a.get(k) or {}).get('href') for k in required): continue
                  rr=reproject_asset(a['red']['href'],Resampling.bilinear)
                  nn=reproject_asset(a['nir08']['href'],Resampling.bilinear)
                  ss=reproject_asset(a['swir22']['href'],Resampling.bilinear)
                  cc=reproject_asset(a['scl']['href'],Resampling.nearest,dtype='uint8')
                  m=(rr>0)&(nn>0)&(ss>0)
                  red[m]=rr[m]; nir[m]=nn[m]; swir[m]=ss[m]; scl[m]=cc[m]
              valid=(red>0)&(nir>0)&(swir>0)
              clear=valid & np.isin(scl,[2,4,5,6,7])
              ndvi=np.full((H,W),np.nan,np.float32); nbr=np.full((H,W),np.nan,np.float32)
              ndvi[clear]=(nir[clear]-red[clear])/(nir[clear]+red[clear]+1e-6)
              nbr[clear]=(nir[clear]-swir[clear])/(nir[clear]+swir[clear]+1e-6)
              scenes[date]={'ndvi':ndvi,'nbr':nbr,'clear':clear}
              metadata.append({'date':date,'product_ids':sorted(pids),'coverage_percent':round(float(valid.mean()*100),2),'clear_percent':round(float(clear.mean()*100),2)})

          a=scenes['2026-08-17']; b=scenes['2026-08-20']; overlap=a['clear']&b['clear']
          dndvi=b['ndvi']-a['ndvi']; dnbr=b['nbr']-a['nbr']
          cells=[]
          for rr in range(4):
              for cc in range(4):
                  ys=slice(rr*H//4,(rr+1)*H//4); xs=slice(cc*W//4,(cc+1)*W//4)
                  m=overlap[ys,xs]; nb=dnbr[ys,xs]; nv=dndvi[ys,xs]
                  rec={'row':rr,'col':cc,'clear_overlap_percent':round(float(m.mean()*100),2)}
                  if m.sum()>=100:
                      vals=nb[m]; vvals=nv[m]
                      rec.update({
                        'median_abs_dnbr':round(float(np.median(np.abs(vals))),4),
                        'median_abs_dndvi':round(float(np.median(np.abs(vvals))),4),
                        'pct_dnbr_le_minus_0_20':round(float((vals<=-0.20).mean()*100),3),
                        'pct_abs_dnbr_ge_0_15':round(float((np.abs(vals)>=0.15).mean()*100),3),
                        'pct_abs_dndvi_ge_0_15':round(float((np.abs(vvals)>=0.15).mean()*100),3),
                      })
                  cells.append(rec)
          scored=[c for c in cells if 'median_abs_dnbr' in c]
          scored.sort(key=lambda c:(c['pct_dnbr_le_minus_0_20'],c['pct_abs_dnbr_ge_0_15'],c['median_abs_dnbr']),reverse=True)
          for i,c in enumerate(scored,1): c['relative_rank']=i

          # Internal broad heatmap; transparent/black where either date is cloud-masked.
          heat=np.zeros((H,W,3),np.uint8)
          neg=np.clip((-dnbr-0.05)/0.35,0,1); pos=np.clip((dnbr-0.05)/0.35,0,1)
          heat[:,:,0]=(np.nan_to_num(neg)*255).astype(np.uint8)
          heat[:,:,2]=(np.nan_to_num(pos)*255).astype(np.uint8)
          heat[~overlap]=0
          Image.fromarray(heat).save('out/dnbr_heat.png',optimize=True)

          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'pair':['2026-08-17','2026-08-20'],'scenes':metadata,
               'clear_overlap_percent':round(float(overlap.mean()*100),2),'cells_4x4':cells,
               'interpretation':'dNBR/NDVI anomaly triage only. Negative dNBR can reflect fire/burn, vegetation loss, soil/harvest/moisture change, shadow residuals or other surface change; attribution requires independent evidence.',
               'safety':'Broad 4x4 sectors only; no coordinates or target-level interpretation.'}
          json.dump(out,open('out/analysis.json','w'),indent=2); print(json.dumps(out,indent=2))
          if overlap.mean()<0.20: raise SystemExit('Insufficient clear overlap')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-eo-multispectral
          path: out/
          if-no-files-found: error
          retention-days: 2
