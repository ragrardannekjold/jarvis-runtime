name: Continuous External Queue

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: continuous-external-queue
  cancel-in-progress: false

jobs:
  drain-queue:
    if: >-
      github.event_name != 'issues' ||
      (github.actor == github.repository_owner &&
      (startsWith(github.event.issue.title, '[QUEUE-JOB]') ||
       startsWith(github.event.issue.title, '[QUEUE-PLAN]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Drain and refill bounded public queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node runtime/continuous-queue/worker.mjs
