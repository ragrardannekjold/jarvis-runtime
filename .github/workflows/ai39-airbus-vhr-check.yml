name: AI39 Airbus VHR archive check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Query Airbus public VHR archive metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, requests, datetime

          BASE='https://portal.intelligence-airbusds.com/arcgis/rest/services/OneAtlas/OADConstellationArchive/MapServer'
          # Broad AI-39 corridor only; no footprint geometry retained.
          BBOX=[37.65,48.45,38.25,48.90]
          NOW=datetime.datetime(2026,8,22,23,59,59,tzinfo=datetime.timezone.utc)
          START=NOW-datetime.timedelta(days=30)
          EVENT=datetime.datetime(2026,8,18,tzinfo=datetime.timezone.utc)
          layers={4:'Pleiades Neo 30cm',9:'Pleiades 50cm',14:'SPOT 1.5m'}
          S=requests.Session(); S.headers.update({'User-Agent':'AI39-airbus-archive-check/2.0'})

          def parse_ms(v):
              if v is None: return None
              try: return datetime.datetime.fromtimestamp(float(v)/1000,tz=datetime.timezone.utc)
              except: return None

          results={}
          all_rows=[]
          for lid,label in layers.items():
              url=f'{BASE}/{lid}/query'
              params={
                  'f':'json','where':'1=1','geometry':','.join(map(str,BBOX)),
                  'geometryType':'esriGeometryEnvelope','inSR':'4326','spatialRel':'esriSpatialRelIntersects',
                  'outFields':'parentidentifier,cloudcover,incidenceangle,processinglevel,publicationdate,acquisitiondate,snowcover',
                  'returnGeometry':'false','resultRecordCount':2000,'orderByFields':'acquisitiondate DESC'
              }
              r=S.get(url,params=params,timeout=60); r.raise_for_status(); data=r.json()
              rows=[]
              for feat in data.get('features',[]):
                  a=feat.get('attributes') or {}
                  dt=parse_ms(a.get('acquisitiondate'))
                  if not dt or not (START <= dt <= NOW): continue
                  row={
                      'sensor_class':label,
                      'acquisition_utc':dt.isoformat(),
                      'days_from_event':round((dt-EVENT).total_seconds()/86400,2),
                      'parentidentifier':a.get('parentidentifier'),
                      'cloudcover':a.get('cloudcover'),
                      'incidenceangle':a.get('incidenceangle'),
                      'processinglevel':a.get('processinglevel'),
                      'snowcover':a.get('snowcover')
                  }
                  rows.append(row); all_rows.append(row)
              rows.sort(key=lambda x:x['acquisition_utc'],reverse=True)
              post=[x for x in rows if x['days_from_event']>=0]
              pre=[x for x in rows if x['days_from_event']<0]
              results[str(lid)]={
                  'sensor_class':label,
                  'count_30d':len(rows),
                  'count_post_event_to_aug22':len(post),
                  'nearest_post_event':min(post,key=lambda x:x['days_from_event']) if post else None,
                  'nearest_pre_event':max(pre,key=lambda x:x['days_from_event']) if pre else None,
                  'rows':rows[:100]
              }

          all_rows.sort(key=lambda x:abs(x['days_from_event']))
          out={
              'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'window_utc':[START.isoformat(),NOW.isoformat()],
              'event_anchor_utc':EVENT.isoformat(),
              'scope':'Broad AI-39 corridor; Airbus archive metadata only',
              'by_sensor':results,
              'nearest_any':all_rows[:20],
              'strict_post_event_vhr':[x for x in all_rows if x['days_from_event']>=0 and x['sensor_class'] in ('Pleiades Neo 30cm','Pleiades 50cm')][:20],
              'safety':'No exact footprint geometries or tactical coordinates retained.'
          }
          with open('out/airbus_vhr_30d.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2)[:60000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-airbus-vhr-30d
          path: out/airbus_vhr_30d.json
          if-no-files-found: error
          retention-days: 2
