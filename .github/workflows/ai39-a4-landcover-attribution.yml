name: AI39 A4 landcover attribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pystac-client planetary-computer rasterio numpy
      - name: Attribute 15 to 20 Aug A4 optical change to historical land-cover classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          import numpy as np,rasterio
          from rasterio.vrt import WarpedVRT
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          import planetary_computer
          from pystac_client import Client

          FULL=[37.65,48.45,38.25,48.90]
          dx=(FULL[2]-FULL[0])/4; dy=(FULL[3]-FULL[1])/4
          BBOX=[FULL[0]+3*dx,FULL[3]-dy,FULL[2],FULL[3]]
          W=H=400; TR=from_bounds(*BBOX,W,H)
          cat=Client.open('https://planetarycomputer.microsoft.com/api/stac/v1',modifier=planetary_computer.sign_inplace)

          def read(it,key,resamp=Resampling.bilinear,nodata=np.nan):
              with rasterio.open(it.assets[key].href) as ds:
                  with WarpedVRT(ds,crs='EPSG:4326',transform=TR,width=W,height=H,resampling=resamp,nodata=nodata) as vrt:
                      return vrt.read(1).astype(np.float32)

          def pick(date):
              its=list(cat.search(collections=['sentinel-2-l2a'],bbox=BBOX,datetime=date,max_items=30).items())
              if not its: raise RuntimeError('s2_missing_'+date)
              its.sort(key=lambda it: float(it.properties.get('eo:cloud_cover') or 999))
              return its[0]
          a=pick('2026-08-15/2026-08-15'); b=pick('2026-08-20/2026-08-20')

          def idx(it):
              r=read(it,'B04'); n=read(it,'B08'); s1=read(it,'B11'); s2=read(it,'B12'); scl=read(it,'SCL',Resampling.nearest,0)
              good=np.isfinite(r)&np.isfinite(n)&np.isfinite(s1)&np.isfinite(s2)&~np.isin(scl,[0,1,3,8,9,10,11])
              eps=1e-6
              return good,(n-r)/(n+r+eps),(n-s2)/(n+s2+eps),(s1-n)/(s1+n+eps)
          ga,ndvia,nbra,ndbia=idx(a); gb,ndvib,nbrb,ndbib=idx(b)
          good=ga&gb; dndvi=ndvib-ndvia; dnbr=nbrb-nbra; dndbi=ndbib-ndbia

          lc=np.zeros((H,W),np.uint8); lc_ids=[]
          lcs=list(cat.search(collections=['io-lulc-9-class'],bbox=BBOX,datetime='2023-01-01/2023-12-31',max_items=20).items())
          for it in lcs:
              asset=it.assets.get('data') or it.assets.get('map') or next((x for x in it.assets.values() if x.href.lower().endswith(('.tif','.tiff'))),None)
              if not asset: continue
              with rasterio.open(asset.href) as ds:
                  with WarpedVRT(ds,crs='EPSG:4326',transform=TR,width=W,height=H,resampling=Resampling.nearest,nodata=0) as vrt:
                      z=vrt.read(1).astype(np.uint8)
              m=z>0; lc[m]=z[m]; lc_ids.append(it.id)

          labels={1:'water',2:'trees',4:'flooded_vegetation',5:'crops',7:'built',8:'bare_ground',9:'snow_ice',10:'clouds',11:'rangeland'}
          base=good&(lc>0)&(lc!=10)
          masks={
            'abs_dnbr_ge_0_10':base&(np.abs(dnbr)>=0.10),
            'abs_dndbi_ge_0_10':base&(np.abs(dndbi)>=0.10),
            'burn_or_surface_loss_like':base&(dnbr<=-0.10),
            'surface_exposure_like':base&(dnbr<=-0.10)&(dndbi>=0.08),
            'vegetation_loss_like':base&(dndvi<=-0.08)&(dnbr<=-0.08)
          }
          def dist(mask):
              total=int(mask.sum()); out={}
              for code,name in labels.items():
                  n=int((mask&(lc==code)).sum())
                  if n: out[name]={'pixels':n,'share_pct':round(n/max(total,1)*100,2)}
              return {'pixels':total,'share_of_valid_sector_pct':round(total/max(int(base.sum()),1)*100,3),'class_distribution':out}
          base_dist=dist(base)
          change={k:dist(v) for k,v in masks.items()}
          out={
            'generated_utc':datetime.now(timezone.utc).isoformat(),
            'sector':'A4',
            'before_utc':a.datetime.isoformat() if a.datetime else None,
            'after_utc':b.datetime.isoformat() if b.datetime else None,
            'joint_valid_pct':round(float(base.mean()*100),2),
            'historic_landcover_base':base_dist,
            'change_masks':change,
            'landcover_items':lc_ids,
            'interpretation_limit':'2023 land cover is a historical prior, not current truth. Crop concentration supports agricultural/phenological alternatives; built/bare/rangeland concentration can justify deeper review but does not prove human or military activity.',
            'safety':'Broad sector attribution only; no coordinates or target-level locations.'
          }
          json.dump(out,open('out/attribution.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-a4-landcover-attribution
          path: out/attribution.json
          if-no-files-found: error
          retention-days: 2
