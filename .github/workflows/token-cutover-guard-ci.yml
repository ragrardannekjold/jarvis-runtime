name: Token Cutover Guard CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-cutover-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run fail-closed workflow regression tests
        run: >-
          node --test
          runtime/security/validate_token_cutover.test.mjs
          runtime/private-async/bridge-disabled.test.mjs
          runtime/async-jobs/contract.test.mjs
          runtime/continuous-queue/worker.test.mjs

      - name: Validate current token-cutover state
        run: node runtime/security/validate_token_cutover.mjs --root .

      - name: Validate CDSE read-only and scheduled-drain contracts
        run: python -m unittest discover -s runtime/kyiv-v3 -p 'test_cdse_*.py' -v
