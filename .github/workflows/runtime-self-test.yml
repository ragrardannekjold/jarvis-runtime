name: Public Runtime Self-Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime-self-test.yml'
      - 'PUBLIC_EXPORT_MANIFEST.json'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/**'
      - 'PUBLIC_EXPORT_MANIFEST.json'
      - 'README.md'

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile public runtime
        run: |
          set -euo pipefail
          python -m py_compile \
            runtime/secure_runner.py \
            runtime/persist_recovery_snapshot.py \
            runtime/generate_daily_main_report.py \
            runtime/resilient_daily_report_runner.py \
            runtime/select_daily_report_mode.py \
            runtime/validate_public_runtime_inventory.py
      - name: Run public runtime unit tests
        run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Verify fail-closed heartbeat semantics
        run: |
          python - <<'PY'
          from runtime import secure_runner
          heartbeat = secure_runner.build_heartbeat([], {'queue_total': 0, 'selected_total': 0})
          assert heartbeat['status'] == 'FAIL'
          assert heartbeat['local_project_executor_dispatch'] == 'NOT_YET_ENABLED'
          assert heartbeat['private_data_exposed_to_public_artifacts'] is False
          assert heartbeat['private_output_logged'] is False
          print('PUBLIC_RUNTIME_SELF_TEST_PASS')
          PY
