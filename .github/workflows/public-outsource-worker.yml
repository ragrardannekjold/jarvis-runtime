name: Public outsource worker

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: public-outsource-${{ github.event.issue.title }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      startsWith(github.event.issue.title, '[OUTSOURCE-TASK] ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Dispatch bounded public task chain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTSOURCE_BOT_LOGIN: github-actions[bot]
        run: node public_outsource_worker/integration/github_action_entry.mjs
