name: AI39 archival urban normalized-score stability

on:
  push:
    branches: [ai39-urban-normalized-stability-20260825]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-urban-normalized-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalized-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install pinned geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.3 numpy==2.2.6 rasterio==1.4.3
          pystac-client==0.8.6 planetary-computer==1.0.0

      - name: Measure local normalized-score stability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/provenance
          python - <<'PY'
          import json, math
          from datetime import datetime, timezone
          from itertools import combinations
          from pathlib import Path

          import numpy as np
          import rasterio, requests
          from pystac_client import Client
          import planetary_computer
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject, transform_bounds

          AOI=[37.65,48.25,38.25,48.90]
          CRS='EPSG:32637'; RES=30; BUILT=7
          STAC='https://earth-search.aws.element84.com/v1/search'
          COLL='sentinel-2-c1-l2a'
          CLEAR=np.array([4,5,6],np.uint8)
          FEATURES=['ndvi','nbr','bsi','ndbi']
          PAIRS=[
              ('S2B','2023-07-27','2023-08-06'),
              ('S2A','2025-08-02','2025-08-12'),
              ('S2B','2024-08-10','2024-08-20'),
              ('S2B','2023-08-06','2023-08-16'),
          ]
          COMMON_MIN=0.50
          MIN_SECTOR_PX=200
          PRIMARY_Z=4.0
          Z_DIAGNOSTICS=(3.0,4.0,5.0)

          def wj(path,value):
              Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')

          left,bottom,right,top=transform_bounds('EPSG:4326',CRS,*AOI,densify_pts=41)
          left=math.floor(left/RES)*RES; bottom=math.floor(bottom/RES)*RES
          right=math.ceil(right/RES)*RES; top=math.ceil(top/RES)*RES
          W=int(round((right-left)/RES)); H=int(round((top-bottom)/RES))
          TR=from_bounds(left,bottom,right,top,W,H)

          # Broad 4x4 sectors only. No geometry is exported.
          sector_masks={}
          row_edges=np.linspace(0,H,5,dtype=int)
          col_edges=np.linspace(0,W,5,dtype=int)
          for r,label in enumerate('ABCD'):
              for c in range(4):
                  mask=np.zeros((H,W),bool)
                  mask[row_edges[r]:row_edges[r+1],col_edges[c]:col_edges[c+1]]=True
                  sector_masks[f'{label}{c+1}']=mask

          def rp(href,dtype='float32',resampling=Resampling.bilinear,nodata=np.nan):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.Env(
                  AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',
                  CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif,.TIF',
                  GDAL_HTTP_MAX_RETRY='3',GDAL_HTTP_RETRY_DELAY='2'):
                  with rasterio.open(href) as src:
                      reproject(
                          source=rasterio.band(src,1),destination=out,
                          src_transform=src.transform,src_crs=src.crs,src_nodata=src.nodata,
                          dst_transform=TR,dst_crs=CRS,dst_nodata=nodata,
                          resampling=resampling)
              return out

          pc=Client.open(
              'https://planetarycomputer.microsoft.com/api/stac/v1',
              modifier=planetary_computer.sign_inplace)

          def landcover(year):
              candidates=list(pc.search(
                  collections=['io-lulc-9-class'],bbox=AOI,
                  datetime=f'{year}-01-01/{year}-12-31').items())
              selected=[it for it in candidates if str(it.id).endswith(f'-{year}')]
              if not selected:
                  raise RuntimeError(f'no exact land-cover item {year}')
              arr=np.zeros((H,W),np.uint8); ids=[]
              for item in selected:
                  asset=(item.assets.get('data') or item.assets.get('map') or
                         next((a for a in item.assets.values()
                               if a.href.lower().endswith(('.tif','.tiff'))),None))
                  if asset is None: continue
                  tile=rp(asset.href,'uint8',Resampling.nearest,0)
                  m=tile>0; arr[m]=tile[m]; ids.append(str(item.id))
              coverage=float((arr>0).mean())
              if coverage<0.95 or any(not x.endswith(f'-{year}') for x in ids):
                  raise RuntimeError(f'land-cover provenance failed {year}')
              return arr,sorted(ids),coverage

          lc21,ids21,cov21=landcover(2021)
          lc22,ids22,cov22=landcover(2022)
          stable=(lc21==BUILT)&(lc22==BUILT)
          core=stable.copy(); padded=np.pad(stable,1,constant_values=False)
          for dy in range(3):
              for dx in range(3):
                  core &= padded[dy:dy+H,dx:dx+W]
          core_n=int(core.sum())
          if core_n<5000: raise RuntimeError('urban core too small')

          unique_keys=sorted({(platform,day) for platform,a,b in PAIRS for day in (a,b)})
          scenes={}; provenance={}

          def load_scene(platform,day):
              body={'collections':[COLL],'bbox':AOI,
                    'datetime':f'{day}T00:00:00Z/{day}T23:59:59Z','limit':100}
              response=requests.post(STAC,json=body,timeout=120)
              response.raise_for_status()
              all_items=response.json().get('features',[])
              items=[item for item in all_items
                     if str(item.get('id') or '').split('_',1)[0]==platform]
              required=['red','blue','nir08','swir16','swir22','scl']
              red=np.full((H,W),np.nan,np.float32); blue=red.copy(); nir=red.copy()
              s16=red.copy(); s22=red.copy(); scl=np.zeros((H,W),np.uint8); used=[]
              for item in items:
                  assets=item.get('assets',{})
                  if not all((assets.get(k) or {}).get('href') for k in required): continue
                  try:
                      rr=rp(assets['red']['href']); bb=rp(assets['blue']['href'])
                      nn=rp(assets['nir08']['href']); x16=rp(assets['swir16']['href'])
                      x22=rp(assets['swir22']['href'])
                      cc=rp(assets['scl']['href'],'uint8',Resampling.nearest,0)
                  except Exception:
                      continue
                  valid=(np.isfinite(rr)&np.isfinite(bb)&np.isfinite(nn)&
                         np.isfinite(x16)&np.isfinite(x22)&
                         (rr>0)&(bb>0)&(nn>0)&(x16>0)&(x22>0)&(cc>0))
                  red[valid]=rr[valid]; blue[valid]=bb[valid]; nir[valid]=nn[valid]
                  s16[valid]=x16[valid]; s22[valid]=x22[valid]; scl[valid]=cc[valid]
                  used.append(str(item.get('id')))
              clear=core&np.isin(scl,CLEAR)&np.isfinite(red)&np.isfinite(blue)&np.isfinite(nir)&np.isfinite(s16)&np.isfinite(s22)
              def idx(num,den):
                  out=np.full((H,W),np.nan,np.float32)
                  out[clear]=num[clear]/(den[clear]+1e-6)
                  return out
              scene={
                  'platform':platform,'day':day,'clear':clear,
                  'clear_fraction':float(clear.sum()/core_n),
                  'scene_ids':sorted(set(used)),
                  'features':{
                      'ndvi':idx(nir-red,nir+red),
                      'nbr':idx(nir-s22,nir+s22),
                      'bsi':idx((s16+red)-(nir+blue),(s16+red)+(nir+blue)),
                      'ndbi':idx(s16-nir,s16+nir)}}
              provenance[f'{platform}|{day}']={
                  'request':body,'selected_scene_ids':scene['scene_ids'],
                  'clear_fraction':round(scene['clear_fraction'],8)}
              return scene

          for key in unique_keys:
              scenes[key]=load_scene(*key)
          wj('out/provenance/scenes.json',provenance)

          def robust_scale(values):
              med=float(np.nanmedian(values))
              absdev=np.abs(values-med)
              mad=float(np.nanmedian(absdev))
              q25,q75=np.nanpercentile(values,[25,75])
              iqr_scale=float((q75-q25)/1.349) if q75>q25 else 0.0
              scale=max(1.4826*mad,iqr_scale,1e-6)
              return med,scale,mad

          def rankdata(values):
              values=np.asarray(values,float)
              order=np.argsort(values,kind='mergesort')
              ranks=np.empty(len(values),float)
              i=0
              while i<len(values):
                  j=i+1
                  while j<len(values) and values[order[j]]==values[order[i]]:
                      j+=1
                  rank=(i+j-1)/2.0+1.0
                  ranks[order[i:j]]=rank
                  i=j
              return ranks

          def spearman(a,b):
              if len(a)<4: return None
              ra=rankdata(a); rb=rankdata(b)
              if float(np.std(ra))<1e-12 or float(np.std(rb))<1e-12: return None
              return float(np.corrcoef(ra,rb)[0,1])

          pair_results=[]
          pair_sector_rates={}
          raw_pair_sector_rates={}
          normalized_global=[]; raw_global=[]

          for platform,day_a,day_b in PAIRS:
              a=scenes[(platform,day_a)]; b=scenes[(platform,day_b)]
              common=a['clear']&b['clear']
              common_px=int(common.sum()); common_frac=float(common_px/core_n)
              if a['clear_fraction']<0.50 or b['clear_fraction']<0.50 or common_frac<COMMON_MIN:
                  raise RuntimeError(
                      f'pair fell below preserved discovery floor {platform} {day_a} {day_b}: '
                      f'{a["clear_fraction"]:.6f} {b["clear_fraction"]:.6f} {common_frac:.6f}')

              diffs={name:np.abs(b['features'][name]-a['features'][name]) for name in FEATURES}
              raw_thresholds={name:float(np.nanpercentile(diffs[name][common],99.5)) for name in FEATURES}
              raw_exceed=np.zeros((H,W),np.uint8)
              for name in FEATURES:
                  raw_exceed += (common&(diffs[name]>=raw_thresholds[name])).astype(np.uint8)
              raw_joint=common&(raw_exceed>=2)

              sector_rows=[]; normalized_tail=np.zeros((H,W),bool)
              sufficient_total=0
              pkey=f'{platform}|{day_a}|{day_b}'
              pair_sector_rates[pkey]={}; raw_pair_sector_rates[pkey]={}

              for sector_id,sector_mask in sector_masks.items():
                  smask=common&sector_mask
                  n=int(smask.sum())
                  if n<MIN_SECTOR_PX:
                      sector_rows.append({
                          'sector':sector_id,'state':'INSUFFICIENT_DATA',
                          'common_clear_px':n,'minimum_required_px':MIN_SECTOR_PX})
                      pair_sector_rates[pkey][sector_id]=None
                      raw_pair_sector_rates[pkey][sector_id]=None
                      continue

                  z_stack=[]; feature_norm={}
                  for name in FEATURES:
                      vals=diffs[name][smask]
                      med,scale,mad=robust_scale(vals)
                      z=np.zeros((H,W),np.float32)
                      z[smask]=np.maximum(0.0,(diffs[name][smask]-med)/scale)
                      z_stack.append(z)
                      feature_norm[name]={
                          'median_abs_diff':round(med,8),
                          'mad_abs_diff':round(mad,8),
                          'robust_scale':round(scale,8)}
                  zarr=np.stack(z_stack,axis=0)
                  second_highest=np.sort(zarr,axis=0)[-2]
                  primary=smask&(second_highest>=PRIMARY_Z)
                  normalized_tail |= primary
                  rate=float(primary.sum()/n)
                  raw_rate=float(raw_joint[smask].sum()/n)
                  diagnostics={
                      str(int(z)):round(float((smask&(second_highest>=z)).sum()/n),8)
                      for z in Z_DIAGNOSTICS}
                  pair_sector_rates[pkey][sector_id]=rate
                  raw_pair_sector_rates[pkey][sector_id]=raw_rate
                  sufficient_total+=n
                  sector_rows.append({
                      'sector':sector_id,'state':'MEASURED',
                      'common_clear_px':n,
                      'normalized_joint_tail_px':int(primary.sum()),
                      'normalized_joint_tail_fraction':round(rate,8),
                      'raw_pairwide_p99_5_joint_tail_fraction':round(raw_rate,8),
                      'normalized_tail_fraction_by_second_highest_z':diagnostics,
                      'feature_local_normalization':feature_norm})

              if sufficient_total<=0:
                  raise RuntimeError('no sufficient sectors in pair')
              norm_px=int(normalized_tail.sum())
              norm_frac=float(norm_px/sufficient_total)
              raw_valid=raw_joint.copy()
              sufficient_union=np.zeros((H,W),bool)
              for row in sector_rows:
                  if row['state']=='MEASURED': sufficient_union |= sector_masks[row['sector']]&common
              raw_px=int((raw_valid&sufficient_union).sum())
              raw_frac=float(raw_px/sufficient_total)
              normalized_global.append(norm_frac); raw_global.append(raw_frac)

              measured=[r for r in sector_rows if r['state']=='MEASURED']
              norm_rank=[r['sector'] for r in sorted(measured,key=lambda r:(r['normalized_joint_tail_fraction'],r['sector']),reverse=True)]
              raw_rank=[r['sector'] for r in sorted(measured,key=lambda r:(r['raw_pairwide_p99_5_joint_tail_fraction'],r['sector']),reverse=True)]
              pair_results.append({
                  'platform':platform,'day_a':day_a,'day_b':day_b,
                  'separation_days':(datetime.fromisoformat(day_b)-datetime.fromisoformat(day_a)).days,
                  'day_a_clear_fraction':round(a['clear_fraction'],8),
                  'day_b_clear_fraction':round(b['clear_fraction'],8),
                  'common_clear_px':common_px,'common_clear_fraction':round(common_frac,8),
                  'sufficient_sector_clear_px':sufficient_total,
                  'normalized_joint_tail_px':norm_px,
                  'normalized_joint_tail_fraction':round(norm_frac,8),
                  'raw_pairwide_p99_5_joint_tail_px':raw_px,
                  'raw_pairwide_p99_5_joint_tail_fraction':round(raw_frac,8),
                  'normalized_sector_rank':norm_rank,
                  'raw_sector_rank':raw_rank,
                  'sectors':sector_rows})

          def spread(values):
              arr=np.asarray(values,float)
              med=float(np.median(arr)); lo=float(arr.min()); hi=float(arr.max())
              rr=float((hi-lo)/max(med,1e-12))
              return {
                  'values':[round(float(v),8) for v in arr],
                  'median':round(med,8),'min':round(lo,8),'max':round(hi,8),
                  'relative_range_over_median':round(rr,4),
                  'within_25pct_relative_range':bool(rr<=0.25)}

          normalized_spread=spread(normalized_global)
          raw_spread=spread(raw_global)

          sector_stability={}
          for sector_id in sector_masks:
              vals=[]; raw_vals=[]; labels=[]
              for row in pair_results:
                  key=f"{row['platform']}|{row['day_a']}|{row['day_b']}"
                  v=pair_sector_rates[key][sector_id]
                  rv=raw_pair_sector_rates[key][sector_id]
                  if v is not None and rv is not None:
                      vals.append(v); raw_vals.append(rv); labels.append(key)
              if len(vals)<3:
                  sector_stability[sector_id]={
                      'state':'INSUFFICIENT_DATA','measured_pairs':len(vals),
                      'minimum_required_pairs':3}
              else:
                  sector_stability[sector_id]={
                      'state':'MEASURED','measured_pairs':len(vals),
                      'pair_keys':labels,
                      'normalized':spread(vals),
                      'raw_pairwide_p99_5':spread(raw_vals)}

          norm_rank_corr=[]; raw_rank_corr=[]; rank_pairs=[]
          for i,j in combinations(range(len(pair_results)),2):
              ri=pair_results[i]; rj=pair_results[j]
              ki=f"{ri['platform']}|{ri['day_a']}|{ri['day_b']}"
              kj=f"{rj['platform']}|{rj['day_a']}|{rj['day_b']}"
              common_sectors=[s for s in sector_masks
                              if pair_sector_rates[ki][s] is not None and pair_sector_rates[kj][s] is not None]
              nv1=[pair_sector_rates[ki][s] for s in common_sectors]
              nv2=[pair_sector_rates[kj][s] for s in common_sectors]
              rv1=[raw_pair_sector_rates[ki][s] for s in common_sectors]
              rv2=[raw_pair_sector_rates[kj][s] for s in common_sectors]
              nc=spearman(nv1,nv2); rc=spearman(rv1,rv2)
              if nc is not None: norm_rank_corr.append(nc)
              if rc is not None: raw_rank_corr.append(rc)
              rank_pairs.append({
                  'pair_a':ki,'pair_b':kj,'common_measured_sectors':len(common_sectors),
                  'normalized_spearman':None if nc is None else round(nc,4),
                  'raw_spearman':None if rc is None else round(rc,4)})

          norm_rank_median=None if not norm_rank_corr else float(np.median(norm_rank_corr))
          raw_rank_median=None if not raw_rank_corr else float(np.median(raw_rank_corr))
          rank_improved=(norm_rank_median is not None and raw_rank_median is not None and
                         norm_rank_median>raw_rank_median)

          rate_stable=bool(normalized_spread['within_25pct_relative_range'])
          raw_rate_stable=bool(raw_spread['within_25pct_relative_range'])
          if rate_stable:
              method_state='NORMALIZED_RATE_STABLE_CANARY'
              next_gate='Compare the calibrated normalized optical surface-change method with an independent broad-area sensor/source on historical controls before any current-scene promotion.'
          else:
              method_state='NORMALIZED_RATE_NOT_STABLE_ENOUGH'
              next_gate='Refine local/contextual normalization with sector-specific empirical quantiles or stronger temporal controls, then repeat archival calibration before independent-sensor comparison.'

          result={
              'status':'MEASURED_ARCHIVAL_NORMALIZED_SCORE_STABILITY',
              'generated_utc':datetime.now(timezone.utc).isoformat(),
              'purpose':'Test whether pair/sector robust local normalization stabilizes archival urban optical tail behavior better than raw pair-wide p99.5 feature thresholds.',
              'scope':'Historical method QA only; no current-condition, route, actor, threat, organized-presence, or safe-passage inference.',
              'normalization':{
                  'per_feature_per_pair_per_sector':'median plus max(1.4826*MAD, IQR/1.349, 1e-6)',
                  'combined_score':'second-highest of four one-sided robust z scores',
                  'primary_tail_gate':f'second-highest z >= {PRIMARY_Z}',
                  'minimum_sector_common_clear_px':MIN_SECTOR_PX,
                  'features':FEATURES},
              'urban_mask':{
                  'exact_year_ids':{'2021':ids21,'2022':ids22},
                  'coverage':{'2021':cov21,'2022':cov22},'eroded_core_px':core_n},
              'pair_count':len(pair_results),'pairs':pair_results,
              'global_tail_stability':{
                  'normalized':normalized_spread,
                  'raw_pairwide_p99_5_joint':raw_spread,
                  'normalized_25pct_rate_stability_pass':rate_stable,
                  'raw_25pct_rate_stability_pass':raw_rate_stable},
              'sector_rate_stability':sector_stability,
              'sector_rank_stability':{
                  'pairwise':rank_pairs,
                  'normalized_median_spearman':None if norm_rank_median is None else round(norm_rank_median,4),
                  'raw_median_spearman':None if raw_rank_median is None else round(raw_rank_median,4),
                  'normalized_rank_more_stable_than_raw':bool(rank_improved),
                  'interpretation':'Rank stability is descriptive only because real historical surface changes may differ between periods.'},
              'canonical_method_state':method_state,
              'truth_rules':[
                  'Local normalization is method calibration, not evidence of cause or actor.',
                  'The 25% relative-range flag is a descriptive QA heuristic, not a physical law.',
                  'Sector ranks may legitimately vary when real historical surface changes differ.',
                  'INSUFFICIENT_DATA is preserved where local sample coverage is inadequate.',
                  'No geometry, object positions, routes, or current-force inference are exported.'],
              'next_gate':next_gate}
          wj('out/result.json',result)

          qa={'status':'PASS','checks':{
              'exact_year_landcover':(
                  all(x.endswith('-2021') for x in ids21) and
                  all(x.endswith('-2022') for x in ids22)),
              'four_preserved_pairs':len(pair_results)==4,
              'all_pair_common_clear_ge_0_50':all(row['common_clear_fraction']>=0.50 for row in pair_results),
              'sixteen_broad_sectors':len(sector_masks)==16,
              'historical_only':True,'no_geometry_export':True,'no_generated_pixels':True}}
          if not all(qa['checks'].values()): qa['status']='FAIL'
          wj('out/qa.json',qa)
          if qa['status']!='PASS': raise RuntimeError(json.dumps(qa))
          print(json.dumps({
              'qa':qa,
              'normalized_global':normalized_spread,
              'raw_global':raw_spread,
              'normalized_rank_median':norm_rank_median,
              'raw_rank_median':raw_rank_median,
              'method_state':method_state,
              'next_gate':next_gate
          },indent=2))
          PY

      - name: Verify bounded output and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = MEASURED_ARCHIVAL_NORMALIZED_SCORE_STABILITY
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          test "$(du -sb out | cut -f1)" -le 5242880
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)

      - name: Upload normalized-score calibration
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-urban-normalized-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Record digest
        if: success()
        run: echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
