name: Scheduler Liveness Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record scheduler trigger
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
