name: AI39 EO mosaic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mosaic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests numpy pillow rasterio
      - name: Mosaic adjacent Sentinel-2 tiles and coarse change triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          import requests, numpy as np, rasterio
          from PIL import Image
          from rasterio.warp import reproject
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds

          STAC='https://earth-search.aws.element84.com/v1/search'
          BBOX=[37.65,48.45,38.25,48.90]
          W,H=1400,1050
          TARGET=['2026-08-10','2026-08-17','2026-08-18','2026-08-20']
          r=requests.post(STAC,json={'collections':['sentinel-2-c1-l2a'],'bbox':BBOX,'datetime':'2026-08-09T00:00:00Z/2026-08-21T23:59:59Z','limit':100,
                                    'sortby':[{'field':'properties.datetime','direction':'desc'}]},timeout=90)
          r.raise_for_status(); items=r.json().get('features',[])

          groups=defaultdict(list)
          for it in items:
              p=it.get('properties',{}); date=(p.get('datetime') or '')[:10]
              if date not in TARGET: continue
              href=(it.get('assets',{}).get('visual') or {}).get('href')
              if not href: continue
              groups[(date,p.get('platform'))].append(it)

          selected={}
          for date in TARGET:
              opts=[]
              for (d,platform), its in groups.items():
                  if d!=date: continue
                  # Favor coverage count first, then lower average scene cloud.
                  clouds=[float(x.get('properties',{}).get('eo:cloud_cover') or 100) for x in its]
                  opts.append((-len(its),sum(clouds)/len(clouds),platform,its))
              if opts:
                  opts.sort(key=lambda x:(x[0],x[1])); selected[date]=opts[0][3]

          dst_transform=from_bounds(*BBOX,W,H)
          arrays={}; recs=[]
          for date in sorted(selected):
              dst=np.zeros((3,H,W),dtype=np.uint8); coverage=np.zeros((H,W),dtype=np.uint8)
              product_ids=[]; clouds=[]; platform=None
              for it in selected[date]:
                  p=it.get('properties',{}); platform=p.get('platform'); clouds.append(float(p.get('eo:cloud_cover') or 100)); product_ids.append(it.get('id'))
                  href=it['assets']['visual']['href']; tmp=np.zeros((3,H,W),dtype=np.uint8)
                  with rasterio.Env(AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR'):
                      with rasterio.open(href) as ds:
                          for i in range(1,4):
                              reproject(source=rasterio.band(ds,i),destination=tmp[i-1],src_transform=ds.transform,src_crs=ds.crs,
                                        src_nodata=ds.nodata,dst_transform=dst_transform,dst_crs='EPSG:4326',dst_nodata=0,resampling=Resampling.bilinear)
                  m=tmp.sum(axis=0)>0
                  dst[:,m]=tmp[:,m]; coverage[m]=1
              arrays[date]=dst
              Image.fromarray(np.moveaxis(dst,0,-1)).save(f'out/{date}_mosaic.png',optimize=True)
              recs.append({'date':date,'platform':platform,'product_ids':sorted(product_ids),'mean_scene_cloud_cover':round(sum(clouds)/len(clouds),4),
                           'coverage_percent':round(float(coverage.mean()*100),2)})

          pairs=[]
          for a,b in [('2026-08-10','2026-08-18'),('2026-08-18','2026-08-20')]:
              if a not in arrays or b not in arrays: continue
              x=arrays[a].astype(np.float32); y=arrays[b].astype(np.float32)
              valid=(x.sum(axis=0)>0)&(y.sum(axis=0)>0)
              # Robust per-band global normalization.
              mx=np.array([np.median(x[i][valid]) for i in range(3)],dtype=np.float32)
              my=np.array([np.median(y[i][valid]) for i in range(3)],dtype=np.float32)
              xn=x/(mx[:,None,None]+1e-3); yn=y/(my[:,None,None]+1e-3)
              diff=np.mean(np.abs(xn-yn),axis=0)
              # Coarse 4x4 cells only; labels intentionally non-precise.
              cells=[]
              for rr in range(4):
                  for cc in range(4):
                      ys=slice(rr*H//4,(rr+1)*H//4); xs=slice(cc*W//4,(cc+1)*W//4)
                      v=valid[ys,xs]; d=diff[ys,xs]
                      score=float(np.median(d[v])) if v.any() else None
                      cells.append({'row':rr,'col':cc,'score':round(score,4) if score is not None else None,'valid_percent':round(float(v.mean()*100),1)})
              vals=sorted([c['score'] for c in cells if c['score'] is not None],reverse=True)
              for c in cells:
                  if c['score'] is not None: c['relative_rank']=1+vals.index(c['score'])
              pairs.append({'pair':[a,b],'cells_4x4':cells,'limit':'Coarse relative visual change only; agriculture, seasonal harvest, smoke, illumination, damage and processing remain competing explanations.'})

          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'scope':'Broad Chasiv Yar–Bakhmut–Soledar corridor mosaic',
               'scenes':recs,'coarse_change':pairs,'safety':'No precise coordinates or target-level findings.'}
          json.dump(out,open('out/analysis.json','w'),indent=2); print(json.dumps(out,indent=2))
          if len(recs)<2: raise SystemExit('Insufficient mosaics')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-eo-mosaic
          path: out/
          if-no-files-found: error
          retention-days: 2
