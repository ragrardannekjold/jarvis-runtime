name: Repair command-center checkpoint parser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/repair-checkpoint-parser-trigger.txt'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      - name: Require command-center token
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: test -n "$COMMAND_CENTER_TOKEN"

      - name: Checkout command center
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          ref: main
          path: command-center
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch parser and verify current checkpoint
        working-directory: command-center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/jarvis/oversight.py')
          text = path.read_text(encoding='utf-8')
          candidates = [
              'r"^## Primary WIP\\s*$.*?^\\*\\*(?P<task_id>[A-Z0-9_-]+)\\s+[—-]"',
              'r"^## (?:Current )?Primary WIP\\s*$.*?^\\*\\*(?P<task_id>[A-Z0-9_-]+)\\s+[—-]"',
          ]
          new = 'r"^## (?:Current )?[Pp]rimary WIP\\s*$.*?^\\*\\*(?P<task_id>[A-Z0-9_-]+)\\s+[—-]"'
          if new not in text:
              for old in candidates:
                  if old in text:
                      text = text.replace(old, new, 1)
                      path.write_text(text, encoding='utf-8')
                      break
              else:
                  raise SystemExit('checkpoint primary regex not in expected state')
          PY
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from jarvis.oversight import parse_checkpoint_primary_wip
          checkpoint = Path('checkpoints/CURRENT_CHECKPOINT.md').read_text(encoding='utf-8')
          actual = parse_checkpoint_primary_wip(checkpoint)
          if actual != 'JCC-004':
              raise SystemExit(f'expected JCC-004, got {actual!r}')
          PY
          PYTHONPATH=src python -m unittest tests.test_oversight -v

      - name: Commit verified parser repair
        working-directory: command-center
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Parser already correct'
            exit 0
          fi
          git config user.name 'jarvis-runtime-repair'
          git config user.email 'jarvis-runtime-repair@users.noreply.github.com'
          git add src/jarvis/oversight.py
          git commit -m 'Fix current primary WIP checkpoint parsing'
          git remote set-url origin "https://x-access-token:${COMMAND_CENTER_TOKEN}@github.com/ragrardannekjold/jarvis-command-center.git"
          git push origin HEAD:main
