name: Kyiv V3 public collector

on:
  push:
    branches:
      - main
    paths:
      - "runtime/kyiv-v3/**"
      - ".github/workflows/kyiv-v3-public-collector.yml"
  pull_request:
    paths:
      - "runtime/kyiv-v3/**"
      - ".github/workflows/kyiv-v3-public-collector.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: kyiv-v3-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind immutable run identity
        run: echo "KYIV_RUN_ID=KYIV-RUNTIME-${GITHUB_RUN_ID}-A${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Install raster preview parser
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Syntax gate
        run: python -m py_compile runtime/kyiv-v3/receipt_contract.py runtime/kyiv-v3/collector.py runtime/kyiv-v3/augment.py runtime/kyiv-v3/validate.py runtime/kyiv-v3/suppression_contract.py runtime/kyiv-v3/suppression_watch.py runtime/kyiv-v3/test_receipt_contract.py runtime/kyiv-v3/test_suppression_contract.py runtime/kyiv-v3/test_suppression_watch.py
      - name: Receipt contract regression tests
        run: python -m unittest discover -s runtime/kyiv-v3 -p "test_*.py" -v
      - name: Execute fresh V3 collection
        run: python runtime/kyiv-v3/collector.py
      - name: Apply routing fallback and documentary pivots
        run: python runtime/kyiv-v3/augment.py
      - name: Apply V3 semantic validator
        run: python runtime/kyiv-v3/validate.py
      - name: Readback contract gate (coverage gaps warn only)
        run: |
          python - <<'PY'
          import json
          import os
          p=json.load(open('runtime/kyiv-v3/out/latest.json',encoding='utf-8'))
          valid={'POSITIVE','NEGATIVE_WITH_COVERAGE','UNKNOWN','NOT_APPLICABLE'}
          print(json.dumps({'run_id':p['run_id'],'generated_utc':p['generated_utc'],'gate_summary':p['gate_summary'],'process_qf_v3':p['process_qf_v3'],'observability':p['observability'],'learning_status':p['learning_status'],'temporal_integrity':p['temporal_integrity'],'receipt_readback':p['receipt_readback'],'receipt_contract':p['receipt_contract'],'receipt_count':p['receipt_count'],'ballistic_suppression':p['ballistic_suppression']},ensure_ascii=False,indent=2))
          assert p['run_id']==f"KYIV-RUNTIME-{os.environ['GITHUB_RUN_ID']}-A{os.environ['GITHUB_RUN_ATTEMPT']}"
          assert p['quality_floor']=='QUALITY_FLOOR_V3'
          assert p['geoint']['tiles_attempted']==16
          assert p['geoint']['gate'] in {'PASS','INCOMPLETE'}
          assert len(p['preconfiguration']['families'])==5
          assert all(x['status'] in valid for x in p['preconfiguration']['families'].values())
          assert p['preconfiguration']['evaluation_gate']=='PASS'
          assert p['preconfiguration']['coverage_gate'] in {'PASS','INCOMPLETE'}
          assert p['cybint']['regional_coverage_gate'] in {'PASS','INCOMPLETE'}
          assert 0 <= int(p['cybint']['regions_two_class_covered']) <= 4
          assert p['process_qf_v3'] in {'PASS','FAIL'}
          assert p['observability'] in {'GREEN','DEGRADED'}
          assert p['learning_status'] in {'CORRECTED_UNVERIFIED','REGRESSED'}
          assert p['receipt_readback']['lines']==p['receipt_count']
          assert p['receipt_readback']['digest_matches_declared'] is True
          assert p['receipt_readback']['schema_verified'] is True
          assert p['receipt_readback']['run_linkage_verified'] is True
          assert p['receipt_readback']['semantic_enum_verified'] is True
          assert p['receipt_readback']['unique_receipt_ids_verified'] is True
          assert p['receipt_contract']['error_count']==0
          assert p['receipt_derived_cybint']['gate'] in {'PASS','INCOMPLETE'}
          assert all(isinstance(v,bool) for v in p['regression_tests'].values())
          hard_regressions=(
              'relationship_pivot_semantics',
              'geoint_16_tiles',
              'preconfig_five_valid_statuses',
              'no_future_timestamp_admitted',
              'receipt_digest_verified',
              'receipt_schema_verified',
              'receipt_run_linkage_verified',
              'receipt_semantics_verified',
              'unique_receipt_ids_verified',
              'candidate_lineage_deduplicated',
              'ballistic_suppression_contract',
              'ballistic_suppression_untested_zero_effect',
          )
          assert all(p['regression_tests'].get(key) is True for key in hard_regressions)
          suppression=p['ballistic_suppression']
          assert suppression['feature_id']=='BAL_VERIFIED_LAUNCH_CAPABILITY_DISRUPTION'
          assert suppression['registry_status']=='UNTESTED'
          assert suppression['evidence_state']=='UNKNOWN'
          assert suppression['effect']['applied_delta_points']==0
          assert suppression['effect']['civilian_action_override_allowed'] is False
          watch=suppression['collection_watch']
          assert watch['collection_status'] in {'VERIFIED_DONE','PARTIAL','UNKNOWN'}
          assert watch['action'] in {'ROUTINE_PUBLIC_SCAN','OPEN_SUPPRESSION_WATCH'}
          assert watch['applied_delta_points']==0
          assert watch['evidence_effect']=='NONE'
          assert watch['current_threat_state_updated'] is False
          assert (watch['candidate_count_6h']>0)==(watch['action']=='OPEN_SUPPRESSION_WATCH')
          if p['process_qf_v3']!='PASS' or p['observability']!='GREEN' or p['learning_status']!='CORRECTED_UNVERIFIED':
              detail=(
                  f"process={p['process_qf_v3']}; "
                  f"geoint={p['geoint']['gate']}; "
                  f"preconfig={p['preconfiguration']['coverage_gate']}; "
                  f"cybint={p['cybint']['regional_coverage_gate']}; "
                  f"observability={p['observability']}; "
                  f"learning={p['learning_status']}"
              )
              print(f"::warning title=Kyiv V3 evidence incomplete::{detail}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyiv-v3-readback-${{ github.run_id }}
          path: runtime/kyiv-v3/out/
          if-no-files-found: error
          retention-days: 14
