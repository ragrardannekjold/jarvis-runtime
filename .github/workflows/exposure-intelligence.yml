name: Private Exposure Intelligence

on:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: private-exposure-intelligence
  cancel-in-progress: false

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout owner-controlled public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Regression-test passive exposure boundary
        run: node --test runtime/exposure-intelligence/test/*.test.mjs runtime/test_exposure_queue_worker.mjs runtime/test_investigation_passive_index.mjs runtime/test_investigation_passive_index_worker.mjs

  passive-read:
    needs: boundary-tests
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.boundary-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact owner-controlled public runtime
        id: runtime_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: runtime_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Execute one authorized private task
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_PLATFORM_TOKEN: ${{ secrets.CENSYS_PLATFORM_TOKEN }}
          CENSYS_ORGANIZATION_ID: ${{ secrets.CENSYS_ORGANIZATION_ID }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$COMMAND_CENTER_TOKEN" || { echo '{"capability":"exposure.lookup","status":"WORKER_FAILED","error_code":"COMMAND_CENTER_TOKEN_MISSING"}'; exit 2; }
          echo "::add-mask::$COMMAND_CENTER_TOKEN"
          if [[ -n "$SHODAN_API_KEY" ]]; then echo "::add-mask::$SHODAN_API_KEY"; fi
          if [[ -n "$CENSYS_PLATFORM_TOKEN" ]]; then echo "::add-mask::$CENSYS_PLATFORM_TOKEN"; fi
          if [[ -n "$CENSYS_ORGANIZATION_ID" ]]; then echo "::add-mask::$CENSYS_ORGANIZATION_ID"; fi
          if [[ -n "$NETLAS_API_KEY" ]]; then echo "::add-mask::$NETLAS_API_KEY"; fi
          node runtime/exposure_queue_worker.mjs

      - name: Execute one risk-gated passive Investigation enrichment task
        if: ${{ !cancelled() && needs.boundary-tests.result == 'success' && steps.runtime_checkout.outcome == 'success' && steps.runtime_node.outcome == 'success' }}
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$COMMAND_CENTER_TOKEN" || { echo '{"capability":"investigation.passive_index_search","status":"WORKER_FAILED","error_code":"COMMAND_CENTER_TOKEN_MISSING"}'; exit 2; }
          echo "::add-mask::$COMMAND_CENTER_TOKEN"
          if [[ -n "$SHODAN_API_KEY" ]]; then echo "::add-mask::$SHODAN_API_KEY"; fi
          node runtime/investigation_passive_index_worker.mjs
