name: Relay A7

# EMERGENCY CONTAINMENT 2026-08-18: branch-local relay background execution is paused.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-a7
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public shell
        uses: actions/checkout@v4

      - name: Require bridge key
        shell: bash
        env:
          BRIDGE_KEY: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_KEY" || { echo 'Bridge key is not configured'; exit 2; }

      - name: Checkout private source ephemerally
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          ref: main
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private state
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          ref: jarvis-runtime-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          if ! (cd source && PYTHONPATH=src python -m unittest tests.test_a7 -q) >/tmp/a7-gate.log 2>&1; then
            echo 'A7 gate failed; private details suppressed.'
            exit 3
          fi

      - name: Run bounded cycle
        shell: bash
        env:
          PYTHONPATH: source/src
        run: |
          set -euo pipefail
          mkdir -p state/runtime/a7/outbox
          if ! python source/scripts/a7_cycle.py \
            --queue source/runtime/a7/inbox.jsonl \
            --output-dir state/runtime/a7/outbox \
            --max-jobs 20 \
            --timeout 12 \
            >/tmp/a7-run.log 2>/tmp/a7-error.log; then
            echo 'A7 cycle failed; private details suppressed.'
            exit 4
          fi

      - name: Persist private state
        shell: bash
        run: |
          set -euo pipefail
          cd state
          if git status --porcelain -- runtime/a7/outbox | grep -q .; then
            git config user.name 'relay-a7'
            git config user.email 'relay-a7@users.noreply.github.com'
            git add runtime/a7/outbox
            git commit -m 'a7: persist snapshot' >/tmp/a7-git.log 2>&1
            git push origin HEAD:jarvis-runtime-state >>/tmp/a7-git.log 2>&1
            echo 'Private state updated.'
          else
            echo 'No state change.'
          fi

      - name: Public summary
        if: always()
        run: echo 'Relay A7 completed. Private inputs and outputs were not published.'
