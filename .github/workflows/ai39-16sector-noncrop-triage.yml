name: AI39 16-sector noncrop lead triage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pystac-client planetary-computer rasterio numpy requests pillow
      - name: Rank broad sectors by noncrop optical change plus thermal support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import io,json
          from datetime import datetime,timezone
          import requests,numpy as np,rasterio
          from PIL import Image
          from rasterio.vrt import WarpedVRT
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          import planetary_computer
          from pystac_client import Client

          BBOX=[37.65,48.45,38.25,48.90]; W,H=800,600; TR=from_bounds(*BBOX,W,H)
          cat=Client.open('https://planetarycomputer.microsoft.com/api/stac/v1',modifier=planetary_computer.sign_inplace)
          def read(it,key,resamp=Resampling.bilinear,nodata=np.nan):
              with rasterio.open(it.assets[key].href) as ds:
                  with WarpedVRT(ds,crs='EPSG:4326',transform=TR,width=W,height=H,resampling=resamp,nodata=nodata) as vrt: return vrt.read(1).astype(np.float32)
          def pick(date):
              its=list(cat.search(collections=['sentinel-2-l2a'],bbox=BBOX,datetime=date,max_items=50).items())
              if not its: raise RuntimeError('missing_s2_'+date)
              its.sort(key=lambda it: float(it.properties.get('eo:cloud_cover') or 999)); return its[0]
          a=pick('2026-08-15/2026-08-15'); b=pick('2026-08-20/2026-08-20')
          def idx(it):
              r=read(it,'B04'); n=read(it,'B08'); s1=read(it,'B11'); s2=read(it,'B12'); scl=read(it,'SCL',Resampling.nearest,0); eps=1e-6
              good=np.isfinite(r)&np.isfinite(n)&np.isfinite(s1)&np.isfinite(s2)&~np.isin(scl,[0,1,3,8,9,10,11])
              return good,(n-r)/(n+r+eps),(n-s2)/(n+s2+eps),(s1-n)/(s1+n+eps)
          ga,ndvia,nbra,ndbia=idx(a); gb,ndvib,nbrb,ndbib=idx(b); good=ga&gb; dndvi=ndvib-ndvia; dnbr=nbrb-nbra; dndbi=ndbib-ndbia

          lc=np.zeros((H,W),np.uint8); lcids=[]
          for it in cat.search(collections=['io-lulc-9-class'],bbox=BBOX,datetime='2023-01-01/2023-12-31',max_items=20).items():
              asset=it.assets.get('data') or it.assets.get('map') or next((z for z in it.assets.values() if z.href.lower().endswith(('.tif','.tiff'))),None)
              if not asset: continue
              with rasterio.open(asset.href) as ds:
                  with WarpedVRT(ds,crs='EPSG:4326',transform=TR,width=W,height=H,resampling=Resampling.nearest,nodata=0) as vrt: z=vrt.read(1).astype(np.uint8)
              m=z>0; lc[m]=z[m]; lcids.append(it.id)

          # current thermal union for four days, full 4x4 render
          WMS='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi'; layers=['VIIRS_SNPP_Thermal_Anomalies_375m_All','VIIRS_NOAA20_Thermal_Anomalies_375m_All','VIIRS_NOAA21_Thermal_Anomalies_375m_All']
          therm={f'{chr(65+r)}{c+1}':{'peak':0,'sum':0,'days':[]} for r in range(4) for c in range(4)}
          for day in (17,18,19,20):
              date=f'2026-08-{day:02d}'; union=np.zeros((H,W),bool)
              for layer in layers:
                  p={'SERVICE':'WMS','VERSION':'1.1.1','REQUEST':'GetMap','TIME':date+'T00:00:00Z','LAYERS':layer,'FORMAT':'image/png','STYLES':'','HEIGHT':H,'SRS':'epsg:4326','WIDTH':W,'BBOX':','.join(map(str,BBOX)),'TRANSPARENT':'TRUE'}
                  rr=requests.get(WMS,params=p,timeout=75); rr.raise_for_status(); arr=np.array(Image.open(io.BytesIO(rr.content)).convert('RGBA')); union|=(arr[:,:,3]>0)
              for r in range(4):
                  for c in range(4):
                      sec=f'{chr(65+r)}{c+1}'; cell=union[r*H//4:(r+1)*H//4,c*W//4:(c+1)*W//4]; n=int(cell.sum()); therm[sec]['peak']=max(therm[sec]['peak'],n); therm[sec]['sum']+=n; therm[sec]['days'].append(n)

          rows=[]
          for r in range(4):
              for c in range(4):
                  sec=f'{chr(65+r)}{c+1}'; ys=slice(r*H//4,(r+1)*H//4); xs=slice(c*W//4,(c+1)*W//4)
                  base=good[ys,xs]&(lc[ys,xs]>0)&(lc[ys,xs]!=10)
                  dn=dnbr[ys,xs]; di=dndbi[ys,xs]; dv=dndvi[ys,xs]; l=lc[ys,xs]
                  ch=base&(np.abs(dn)>=.10); exposure=base&(dn<=-.10)&(di>=.08)
                  def share(mask,code): return float((mask&(l==code)).sum()/max(int(mask.sum()),1)*100)
                  base_crop=share(base,5); base_built=share(base,7); base_non=100-base_crop
                  change_crop=share(ch,5); change_built=share(ch,7); change_range=share(ch,11); change_trees=share(ch,2); change_non=100-change_crop
                  exp_crop=share(exposure,5); exp_built=share(exposure,7); exp_non=100-exp_crop
                  change_pct=float(ch.sum()/max(int(base.sum()),1)*100); exp_pct=float(exposure.sum()/max(int(base.sum()),1)*100)
                  noncrop_excess=change_non-base_non; built_over=(change_built+0.1)/(base_built+0.1)
                  thermal=therm[sec]
                  # heuristic ranking for follow-up only; no presence claim.
                  score=max(0,noncrop_excess)*0.08 + min(built_over,5)*0.8 + min(change_pct,20)*0.08 + min(thermal['peak']/300,3)*0.5
                  if change_crop>=80: score*=0.55
                  rows.append({'sector':sec,'valid_px':int(base.sum()),'change_pct_abs_dnbr_ge_0_10':round(change_pct,3),'base_crop_pct':round(base_crop,2),'change_crop_pct':round(change_crop,2),'noncrop_excess_pct_points':round(noncrop_excess,2),'base_built_pct':round(base_built,2),'change_built_pct':round(change_built,2),'built_overrepresentation_ratio':round(built_over,2),'change_rangeland_pct':round(change_range,2),'change_trees_pct':round(change_trees,2),'surface_exposure_like_pct':round(exp_pct,3),'surface_exposure_noncrop_pct':round(exp_non,2),'thermal_peak_symbol_pixels':thermal['peak'],'thermal_sum_symbol_pixels':thermal['sum'],'thermal_days':thermal['days'],'lead_score':round(score,2)})
          rows.sort(key=lambda x:x['lead_score'],reverse=True)
          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'before_utc':a.datetime.isoformat() if a.datetime else None,'after_utc':b.datetime.isoformat() if b.datetime else None,'ranked_sectors':rows,
               'interpretation_limit':'Lead-ranking only. It prioritizes non-crop/built/rangeland optical change with thermal support so crop-dominated physical events do not monopolize follow-up. Historical land cover is a prior. High score is not proof of people, equipment or military activity.',
               'safety':'Broad 4x4 sectors only; no coordinates, routes, exact equipment, trench or sensor locations.'}
          json.dump(out,open('out/triage.json','w'),indent=2); print(json.dumps({'top8':rows[:8]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-16sector-noncrop-triage
          path: out/triage.json
          if-no-files-found: error
          retention-days: 2
