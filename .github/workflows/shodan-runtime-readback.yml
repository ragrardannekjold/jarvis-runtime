name: Shodan Runtime Readback

on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: shodan-runtime-readback
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Shodan credential without search spend
        shell: bash
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$SHODAN_API_KEY" ]]; then
            echo '{"provider":"shodan","credential_status":"FAILED","reason":"SHODAN_CREDENTIAL_MISSING"}'
            exit 1
          fi
          echo "::add-mask::$SHODAN_API_KEY"
          python -I -S runtime/shodan_readback.py
