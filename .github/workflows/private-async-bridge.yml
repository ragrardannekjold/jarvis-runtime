name: Private Async Reference Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: private-async-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  private-async:
    if: github.event.issue.user.login == 'ragrardannekjold' && startsWith(github.event.issue.title, '[ASYNC-PRIVATE]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require private bridge token
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COMMAND_CENTER_TOKEN" || { echo "private bridge token unavailable"; exit 2; }

      - name: Checkout private command center ephemerally
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          ref: main
          path: command-center
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute opaque-reference private job
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: node runtime/private-async/worker.mjs

      - name: Public-safe terminal summary
        if: always()
        run: echo "Private async bridge finished; private payload and private result are intentionally not printed."
