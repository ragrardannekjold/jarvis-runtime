name: Kyiv CDSE scene-event queue

on:
  schedule:
    - cron: "1-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: kyiv-cdse-event-queue
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Syntax and safety regression gate
        run: |
          python -m py_compile \
            runtime/kyiv-v3/cdse_event_queue.py \
            runtime/kyiv-v3/cdse_public_delta.py \
            runtime/kyiv-v3/test_cdse_event_queue.py \
            runtime/kyiv-v3/test_cdse_public_delta.py
          python -m unittest discover -s runtime/kyiv-v3 -p "test_cdse_*.py" -v

  drain:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' && github.event_name == 'schedule' }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Consume new Copernicus scene events
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CDSE_USERNAME:-}" && -n "${CDSE_PASSWORD:-}" ]]; then
            python runtime/kyiv-v3/cdse_event_queue.py
          else
            python runtime/kyiv-v3/cdse_public_delta.py
          fi
