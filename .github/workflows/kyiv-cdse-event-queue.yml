name: Kyiv CDSE scene-event queue

on:
  push:
    branches:
      - main
    paths:
      - "runtime/kyiv-v3/cdse_event_queue.py"
      - "runtime/kyiv-v3/cdse_public_delta.py"
      - "runtime/kyiv-v3/test_cdse_event_queue.py"
      - "runtime/kyiv-v3/test_cdse_public_delta.py"
      - ".github/workflows/kyiv-cdse-event-queue.yml"
  pull_request:
    paths:
      - "runtime/kyiv-v3/cdse_event_queue.py"
      - "runtime/kyiv-v3/cdse_public_delta.py"
      - "runtime/kyiv-v3/test_cdse_event_queue.py"
      - "runtime/kyiv-v3/test_cdse_public_delta.py"
      - ".github/workflows/kyiv-cdse-event-queue.yml"
  workflow_dispatch:
  schedule:
    - cron: "1-59/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: kyiv-cdse-event-queue
  cancel-in-progress: false

jobs:
  validate-and-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and safety regression gate
        run: |
          python -m py_compile \
            runtime/kyiv-v3/cdse_event_queue.py \
            runtime/kyiv-v3/cdse_public_delta.py \
            runtime/kyiv-v3/test_cdse_event_queue.py \
            runtime/kyiv-v3/test_cdse_public_delta.py
          python -m unittest discover -s runtime/kyiv-v3 -p "test_cdse_*.py" -v

      - name: Consume new Copernicus scene events
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CDSE_USERNAME:-}" && -n "${CDSE_PASSWORD:-}" ]]; then
            python runtime/kyiv-v3/cdse_event_queue.py
          else
            python runtime/kyiv-v3/cdse_public_delta.py
          fi
