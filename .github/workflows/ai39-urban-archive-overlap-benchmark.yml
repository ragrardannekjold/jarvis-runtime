name: AI39 archival urban acquisition overlap benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-urban-archive-overlap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install pinned geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.3 numpy==2.2.6 rasterio==1.4.3
          pystac-client==0.8.6 planetary-computer==1.0.0

      - name: Measure archived common-clear coverage only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/provenance
          python - <<'PY'
          import json, math
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np
          import rasterio, requests
          from pystac_client import Client
          import planetary_computer
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject, transform_bounds

          AOI=[37.65,48.25,38.25,48.90]
          CRS='EPSG:32637'; RES=30; BUILT=7
          YEARS=[2023,2024,2025]
          STAC='https://earth-search.aws.element84.com/v1/search'
          COLL='sentinel-2-c1-l2a'
          STRICT_CLEAR=np.array([4,5,6],np.uint8)

          def wj(path,value):
              Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')

          left,bottom,right,top=transform_bounds('EPSG:4326',CRS,*AOI,densify_pts=41)
          left=math.floor(left/RES)*RES; bottom=math.floor(bottom/RES)*RES
          right=math.ceil(right/RES)*RES; top=math.ceil(top/RES)*RES
          W=int(round((right-left)/RES)); H=int(round((top-bottom)/RES))
          TR=from_bounds(left,bottom,right,top,W,H)

          def rp(href,dtype='uint8',nodata=0):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.Env(
                  AWS_NO_SIGN_REQUEST='YES',
                  GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',
                  CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif,.TIF',
                  GDAL_HTTP_MAX_RETRY='3',GDAL_HTTP_RETRY_DELAY='2'):
                  with rasterio.open(href) as src:
                      reproject(
                          source=rasterio.band(src,1),destination=out,
                          src_transform=src.transform,src_crs=src.crs,src_nodata=src.nodata,
                          dst_transform=TR,dst_crs=CRS,dst_nodata=nodata,
                          resampling=Resampling.nearest)
              return out

          pc=Client.open(
              'https://planetarycomputer.microsoft.com/api/stac/v1',
              modifier=planetary_computer.sign_inplace)

          def landcover(year):
              candidates=list(pc.search(
                  collections=['io-lulc-9-class'],bbox=AOI,
                  datetime=f'{year}-01-01/{year}-12-31').items())
              selected=[item for item in candidates if str(item.id).endswith(f'-{year}')]
              if not selected:
                  raise RuntimeError(f'no exact annual land-cover item for {year}')
              arr=np.zeros((H,W),np.uint8); ids=[]
              for item in selected:
                  asset=(item.assets.get('data') or item.assets.get('map') or
                         next((a for a in item.assets.values()
                               if a.href.lower().endswith(('.tif','.tiff'))),None))
                  if asset is None:
                      continue
                  tile=rp(asset.href)
                  m=tile>0; arr[m]=tile[m]; ids.append(str(item.id))
              coverage=float((arr>0).mean())
              if coverage<0.95 or any(not x.endswith(f'-{year}') for x in ids):
                  raise RuntimeError(f'land-cover provenance failed {year}')
              return arr,sorted(ids),coverage

          lc21,ids21,cov21=landcover(2021)
          lc22,ids22,cov22=landcover(2022)
          stable=(lc21==BUILT)&(lc22==BUILT)
          core=stable.copy(); padded=np.pad(stable,1,constant_values=False)
          for dy in range(3):
              for dx in range(3):
                  core &= padded[dy:dy+H,dx:dx+W]
          core_n=int(core.sum())
          if core_n<5000:
              raise RuntimeError(f'urban core too small {core_n}')

          def search_window(year):
              body={
                  'collections':[COLL],'bbox':AOI,
                  'datetime':f'{year}-08-17T00:00:00Z/{year}-08-23T23:59:59Z',
                  'limit':100}
              response=requests.post(STAC,json=body,timeout=120)
              response.raise_for_status()
              features=response.json().get('features',[])
              return features,body

          def platform_clear(items):
              scl=np.zeros((H,W),np.uint8); ids=[]
              for item in items:
                  asset=(item.get('assets',{}).get('scl') or {}).get('href')
                  if not asset:
                      continue
                  try:
                      tile=rp(asset)
                  except Exception:
                      continue
                  m=tile>0; scl[m]=tile[m]; ids.append(str(item.get('id')))
              clear=core&np.isin(scl,STRICT_CLEAR)
              return clear,sorted(set(ids))

          rows=[]; provenance={}
          for year in YEARS:
              features,request=search_window(year)
              by_day=defaultdict(lambda:defaultdict(list))
              for item in features:
                  dt=(item.get('properties',{}).get('datetime') or '')
                  day=dt[:10]
                  sid=str(item.get('id') or '')
                  platform=sid.split('_',1)[0]
                  if day and platform in {'S2A','S2B'}:
                      by_day[day][platform].append(item)
              provenance[str(year)]={
                  'request':request,
                  'days':{
                      day:{platform:sorted(str(x.get('id')) for x in items)
                           for platform,items in groups.items()}
                      for day,groups in sorted(by_day.items())}}

              for day,groups in sorted(by_day.items()):
                  if 'S2A' not in groups or 'S2B' not in groups:
                      continue
                  clearA,idsA=platform_clear(groups['S2A'])
                  clearB,idsB=platform_clear(groups['S2B'])
                  common=clearA&clearB
                  a_px=int(clearA.sum()); b_px=int(clearB.sum()); c_px=int(common.sum())
                  rows.append({
                      'day':day,
                      's2a_clear_px':a_px,
                      's2a_clear_fraction':round(a_px/core_n,8),
                      's2b_clear_px':b_px,
                      's2b_clear_fraction':round(b_px/core_n,8),
                      'common_clear_px':c_px,
                      'common_clear_fraction':round(c_px/core_n,8),
                      'common_fraction_of_smaller_clear':round(
                          c_px/max(min(a_px,b_px),1),8),
                      's2a_scene_ids':idsA,
                      's2b_scene_ids':idsB})

          rows.sort(key=lambda row:(
              row['common_clear_fraction'],
              row['common_fraction_of_smaller_clear']),reverse=True)
          for rank,row in enumerate(rows,1):
              row['rank']=rank
              row['benchmark_candidate']=(
                  row['common_clear_px']>=10000 and
                  row['common_clear_fraction']>=0.03)

          result={
              'status':'MEASURED_ARCHIVAL_ACQUISITION_OVERLAP_BENCHMARK',
              'generated_utc':datetime.now(timezone.utc).isoformat(),
              'purpose':'Find archived dates suitable for detector QA where S2A and S2B have measurable common strict-clear coverage on the same validated urban-core pixels.',
              'scope':'Observability/coverage benchmark only. No surface-change detection, lead geometry, object positions, routes, actor attribution, current-presence inference, or threat inference.',
              'urban_mask':{
                  'exact_year_ids':{'2021':ids21,'2022':ids22},
                  'coverage':{'2021':cov21,'2022':cov22},
                  'eroded_core_px':core_n},
              'search_windows':[f'{year}-08-17/{year}-08-23' for year in YEARS],
              'candidate_floor':{
                  'common_clear_px_min':10000,
                  'common_clear_fraction_min':0.03},
              'same_day_two_platform_rows':rows,
              'candidate_count':sum(1 for row in rows if row['benchmark_candidate']),
              'truth_rules':[
                  'This output measures observation overlap only, not activity or change.',
                  'A benchmark candidate is useful only for method QA on identical observed pixels.',
                  'Insufficient overlap is not negative evidence about the ground.',
                  'No generated pixels or object-level outputs are used.'],
              'next_gate':'If a candidate exists, use the best archived overlap date for detector consistency QA only; otherwise abandon same-day two-platform replication as an unsuitable validation strategy for this AOI.'}
          wj('out/result.json',result)
          wj('out/provenance/stac_windows.json',provenance)

          qa={'status':'PASS','checks':{
              'exact_year_landcover':(
                  all(x.endswith('-2021') for x in ids21) and
                  all(x.endswith('-2022') for x in ids22)),
              'landcover_coverage_ge_0_95':cov21>=0.95 and cov22>=0.95,
              'urban_core_ge_5000':core_n>=5000,
              'historical_only':True,
              'coverage_metrics_only':True,
              'no_surface_change_detection':True,
              'no_geometry_export':True,
              'no_generated_pixels':True}}
          if not all(qa['checks'].values()):
              qa['status']='FAIL'
          wj('out/qa.json',qa)
          if qa['status']!='PASS':
              raise RuntimeError(json.dumps(qa))

          print(json.dumps({
              'qa':qa,
              'candidate_count':result['candidate_count'],
              'top_rows':[(row['day'],row['s2a_clear_fraction'],
                           row['s2b_clear_fraction'],row['common_clear_fraction'],
                           row['common_fraction_of_smaller_clear'],
                           row['benchmark_candidate']) for row in rows[:10]]
          },indent=2))
          PY

      - name: Verify bounded output and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = MEASURED_ARCHIVAL_ACQUISITION_OVERLAP_BENCHMARK
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          test "$(du -sb out | cut -f1)" -le 5242880
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)

      - name: Upload coverage benchmark
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-urban-archive-overlap-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Record digest
        if: success()
        run: echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
