name: AI39 urban acquisition-split consistency canary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-urban-acquisition-split-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install pinned runtime
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.3 numpy==2.2.6 scipy==1.15.3 rasterio==1.4.3
          pystac-client==0.8.6 planetary-computer==1.0.0
      - name: Run acquisition-split falsifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/provenance
          python - <<'PY'
          import json, math
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import numpy as np
          import rasterio, requests
          from scipy import ndimage
          from scipy.stats import rankdata
          from pystac_client import Client
          import planetary_computer
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject, transform_bounds

          AOI=[37.65,48.25,38.25,48.90]; CRS='EPSG:32637'; RES=30; BUILT=7
          DAY='2026-08-20'; HIST_DAYS=['2023-08-21','2024-08-20','2025-08-20']
          STAC='https://earth-search.aws.element84.com/v1/search'; COLL='sentinel-2-c1-l2a'
          CLEAR=np.array([4,5,6],np.uint8); FEATS=['ndvi','nbr','bsi','ndbi']; CTX=5.0; HIST=4.0; COMP=4
          def wj(p,v): Path(p).write_text(json.dumps(v,ensure_ascii=False,indent=2),encoding='utf-8')
          l,b,r,t=transform_bounds('EPSG:4326',CRS,*AOI,densify_pts=41)
          l=math.floor(l/RES)*RES; b=math.floor(b/RES)*RES; r=math.ceil(r/RES)*RES; t=math.ceil(t/RES)*RES
          W=int(round((r-l)/RES)); H=int(round((t-b)/RES)); TR=from_bounds(l,b,r,t,W,H)

          def rp(href,dtype='float32',resampling=Resampling.bilinear,nodata=np.nan):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.Env(AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif,.TIF',GDAL_HTTP_MAX_RETRY='3',GDAL_HTTP_RETRY_DELAY='2'):
                  with rasterio.open(href) as src:
                      reproject(source=rasterio.band(src,1),destination=out,src_transform=src.transform,src_crs=src.crs,src_nodata=src.nodata,dst_transform=TR,dst_crs=CRS,dst_nodata=nodata,resampling=resampling)
              return out

          pc=Client.open('https://planetarycomputer.microsoft.com/api/stac/v1',modifier=planetary_computer.sign_inplace)
          def lc(year):
              cand=list(pc.search(collections=['io-lulc-9-class'],bbox=AOI,datetime=f'{year}-01-01/{year}-12-31').items())
              sel=[x for x in cand if str(x.id).endswith(f'-{year}')]
              if not sel: raise RuntimeError(f'no exact landcover {year}')
              arr=np.zeros((H,W),np.uint8); ids=[]
              for it in sel:
                  a=it.assets.get('data') or it.assets.get('map') or next((x for x in it.assets.values() if x.href.lower().endswith(('.tif','.tiff'))),None)
                  if a is None: continue
                  z=rp(a.href,'uint8',Resampling.nearest,0); m=z>0; arr[m]=z[m]; ids.append(str(it.id))
              cov=float((arr>0).mean())
              wj(f'out/provenance/landcover_{year}.json',{'candidate_ids':sorted(str(x.id) for x in cand),'selected_ids':sorted(ids),'coverage':cov})
              if cov<0.95 or any(not x.endswith(f'-{year}') for x in ids): raise RuntimeError('landcover provenance gate')
              return arr,sorted(ids),cov
          a21,ids21,c21=lc(2021); a22,ids22,c22=lc(2022)
          stable=(a21==BUILT)&(a22==BUILT); core=stable.copy(); pad=np.pad(stable,1,constant_values=False)
          for dy in range(3):
              for dx in range(3): core &= pad[dy:dy+H,dx:dx+W]
          core_n=int(core.sum())

          def search_day(day):
              body={'collections':[COLL],'bbox':AOI,'datetime':f'{day}T00:00:00Z/{day}T23:59:59Z','limit':100}
              q=requests.post(STAC,json=body,timeout=120); q.raise_for_status(); feats=q.json().get('features',[])
              return feats,body

          def load_items(items,label):
              req=['red','blue','nir08','swir16','swir22','scl']
              red=np.full((H,W),np.nan,np.float32); blue=red.copy(); nir=red.copy(); s16=red.copy(); s22=red.copy(); scl=np.zeros((H,W),np.uint8); ids=[]
              for it in items:
                  aa=it.get('assets',{})
                  if not all((aa.get(k) or {}).get('href') for k in req): continue
                  try:
                      rr=rp(aa['red']['href']); bb=rp(aa['blue']['href']); nn=rp(aa['nir08']['href']); x16=rp(aa['swir16']['href']); x22=rp(aa['swir22']['href']); cc=rp(aa['scl']['href'],'uint8',Resampling.nearest,0)
                  except Exception: continue
                  m=np.isfinite(rr)&np.isfinite(bb)&np.isfinite(nn)&np.isfinite(x16)&np.isfinite(x22)&(rr>0)&(bb>0)&(nn>0)&(x16>0)&(x22>0)&(cc>0)
                  red[m]=rr[m]; blue[m]=bb[m]; nir[m]=nn[m]; s16[m]=x16[m]; s22[m]=x22[m]; scl[m]=cc[m]; ids.append(str(it.get('id')))
              valid=np.isfinite(red)&np.isfinite(blue)&np.isfinite(nir)&np.isfinite(s16)&np.isfinite(s22)&(scl>0); clear=core&valid&np.isin(scl,CLEAR)
              def idx(num,den):
                  o=np.full((H,W),np.nan,np.float32); o[clear]=num[clear]/(den[clear]+1e-6); return o
              result={'label':label,'ids':sorted(set(ids)),'clear':clear,'clear_fraction':float(clear.sum()/core_n),
                      'features':{'ndvi':idx(nir-red,nir+red),'nbr':idx(nir-s22,nir+s22),'bsi':idx((s16+red)-(nir+blue),(s16+red)+(nir+blue)),'ndbi':idx(s16-nir,s16+nir)}}
              return result

          cur_items,cur_req=search_day(DAY); groups=defaultdict(list)
          for it in cur_items:
              sid=str(it.get('id') or ''); platform=sid.split('_',1)[0]
              groups[platform].append(it)
          wj('out/provenance/current_groups.json',{'request':cur_req,'groups':{k:sorted(str(x.get('id')) for x in v) for k,v in groups.items()}})
          if 'S2A' not in groups or 'S2B' not in groups: raise RuntimeError(f'expected S2A and S2B groups, got {sorted(groups)}')
          curA=load_items(groups['S2A'],'S2A'); curB=load_items(groups['S2B'],'S2B')
          if curA['clear_fraction']<0.50 or curB['clear_fraction']<0.50: raise RuntimeError(f'split current coverage insufficient A={curA["clear_fraction"]:.3f} B={curB["clear_fraction"]:.3f}')
          overlap_clear=curA['clear']&curB['clear']; overlap_fraction=float(overlap_clear.sum()/core_n)
          if overlap_fraction<0.40: raise RuntimeError(f'current A/B overlap too low {overlap_fraction:.3f}')

          hist=[]; hist_meta=[]
          for day in HIST_DAYS:
              items,req=search_day(day); sc=load_items(items,day)
              if sc['clear_fraction']<0.50: raise RuntimeError(f'frozen historical baseline lost coverage {day}: {sc["clear_fraction"]:.3f}')
              hist.append(sc); hist_meta.append({'day':day,'urban_clear_fraction':round(sc['clear_fraction'],8),'scene_ids':sc['ids']})
          wj('out/provenance/frozen_history.json',hist_meta)

          hist_stacks={name:np.stack([x['features'][name] for x in hist]) for name in FEATS}
          def lead_for(cur):
              hzparts=[]
              for name in FEATS:
                  st=hist_stacks[name]; count=np.isfinite(st).sum(0); med=np.nanmedian(st,axis=0); mad=np.nanmedian(np.abs(st-med),axis=0); scale=np.maximum(1.4826*mad,0.03)
                  z=np.abs(cur['features'][name]-med)/scale; z[count<2]=np.nan; hzparts.append(z)
              hz=np.nanmax(np.stack(hzparts),axis=0); hz[~cur['clear']]=np.nan
              cz=np.full((H,W),np.nan,np.float32); re=np.linspace(0,H,5,dtype=int); ce=np.linspace(0,W,5,dtype=int)
              for rr in range(4):
                  for cc in range(4):
                      ys=slice(re[rr],re[rr+1]); xs=slice(ce[cc],ce[cc+1]); m=np.zeros((H,W),bool); m[ys,xs]=True; m &= cur['clear']
                      if int(m.sum())<300: continue
                      zmax=np.zeros((H,W),np.float32)
                      for name in FEATS:
                          x=cur['features'][name][m]; med=float(np.nanmedian(x)); mad=float(np.nanmedian(np.abs(x-med))); scale=max(1.4826*mad,0.02)
                          z=np.abs(cur['features'][name]-med)/scale; zmax=np.maximum(zmax,np.nan_to_num(z,nan=0,posinf=0,neginf=0))
                      cz[m]=zmax[m]
              lead=core&cur['clear']&np.isfinite(cz)&np.isfinite(hz)&(cz>=CTX)&(hz>=HIST)
              return lead,cz,hz
          leadA,czA,hzA=lead_for(curA); leadB,czB,hzB=lead_for(curB); consistent=leadA&leadB

          re=np.linspace(0,H,5,dtype=int); ce=np.linspace(0,W,5,dtype=int); sectors=[]
          for rr in range(4):
              for cc in range(4):
                  sec=f"{'ABCD'[cc]}{rr+1}"; ys=slice(re[rr],re[rr+1]); xs=slice(ce[cc],ce[cc+1])
                  cm=core[ys,xs]; ac=curA['clear'][ys,xs]; bc=curB['clear'][ys,xs]; oc=ac&bc; la=leadA[ys,xs]; lb=leadB[ys,xs]; co=consistent[ys,xs]
                  lab,n=ndimage.label(co,structure=np.ones((3,3),int)); sizes=np.bincount(lab.ravel())[1:] if n else np.array([],int); robust=sizes[sizes>=COMP]
                  a_px=int(la.sum()); b_px=int(lb.sum()); c_px=int(co.sum()); union=int((la|lb).sum()); overlap_px=int(oc.sum()); core_px=int(cm.sum())
                  sectors.append({'sector':sec,'urban_core_px':core_px,'s2a_clear_fraction':round(float(ac.sum()/max(core_px,1)),6),'s2b_clear_fraction':round(float(bc.sum()/max(core_px,1)),6),
                      'common_clear_fraction':round(float(overlap_px/max(core_px,1)),6),'s2a_lead_px':a_px,'s2b_lead_px':b_px,'consistent_lead_px':c_px,
                      'consistent_lead_pct_of_common_clear':round(100*c_px/max(overlap_px,1),6),'lead_jaccard':round(c_px/max(union,1),6),
                      'consistent_components_ge4px':int((sizes>=COMP).sum()) if sizes.size else 0,'largest_consistent_component_px':int(robust.max()) if robust.size else 0})
          for metric in ['consistent_lead_pct_of_common_clear','lead_jaccard','consistent_components_ge4px']:
              vals=np.array([x[metric] for x in sectors],float); rk=rankdata(vals,method='average')
              for x,v in zip(sectors,rk): x[metric+'_percentile']=round(float((v-1)/(len(vals)-1)*100),1)
          for x in sectors: x['rank_score']=round(0.5*x['consistent_lead_pct_of_common_clear_percentile']+0.3*x['lead_jaccard_percentile']+0.2*x['consistent_components_ge4px_percentile'],2)
          sectors.sort(key=lambda x:x['rank_score'],reverse=True)
          for i,x in enumerate(sectors,1): x['rank']=i

          result={'status':'MEASURED_ACQUISITION_SPLIT_CONSISTENCY_CANARY','generated_utc':datetime.now(timezone.utc).isoformat(),
              'scope':'S2A vs S2B same-day consistency at broad 4x4 sector aggregate only; no lead geometry, positions, routes, target coordinates, actor attribution, current-force inference, or safe-passage certification.',
              'urban_mask':{'exact_year_ids':{'2021':ids21,'2022':ids22},'coverage':{'2021':c21,'2022':c22},'eroded_core_px':core_n},
              'current':{'day':DAY,'s2a':{'clear_fraction':round(curA['clear_fraction'],8),'scene_ids':curA['ids']},'s2b':{'clear_fraction':round(curB['clear_fraction'],8),'scene_ids':curB['ids']},'common_clear_fraction':round(overlap_fraction,8)},
              'frozen_historical_baseline':hist_meta,'thresholds':{'context_z_min':CTX,'historical_z_min':HIST,'consistent_component_min_px':COMP},
              'totals':{'s2a_lead_px':int(leadA.sum()),'s2b_lead_px':int(leadB.sum()),'consistent_lead_px':int(consistent.sum()),'consistent_robust_components':sum(x['consistent_components_ge4px'] for x in sectors)},
              'sector_consistency_ranking':sectors,
              'truth_rules':['Consistency in both acquisitions strengthens only the proposition that a spectral surface change is real.','One-acquisition-only leads favor sensor/orbit/atmospheric/mosaic confounding.','Cross-acquisition consistency does not establish cause, actor, intent, organized/current presence, or threat.','No lead geometry or pixel coordinates are exported.','Independent non-optical or documentary corroboration is still required before any interpretation beyond surface change.'],
              'next_gate':'Use acquisition consistency to accept/reject A1/A4/B4/A3 as optical surface-change leads. Do not promote to latest-scene threat/presence inference.'}
          wj('out/result.json',result)
          qa={'status':'PASS','checks':{'exact_year_landcover':all(x.endswith('-2021') for x in ids21) and all(x.endswith('-2022') for x in ids22),'s2a_present':bool(curA['ids']),'s2b_present':bool(curB['ids']),
              's2a_clear_ge_0_50':curA['clear_fraction']>=0.50,'s2b_clear_ge_0_50':curB['clear_fraction']>=0.50,'common_clear_ge_0_40':overlap_fraction>=0.40,'frozen_history_three_years':len(hist)==3,
              'dual_context_per_acquisition':True,'no_geometry_export':True,'broad_sector_only':True,'no_generated_pixels':True}}
          if not all(qa['checks'].values()): qa['status']='FAIL'
          wj('out/qa.json',qa)
          if qa['status']!='PASS': raise RuntimeError(json.dumps(qa))
          print(json.dumps({'qa':qa,'current':result['current'],'totals':result['totals'],'top8':[(x['sector'],x['s2a_lead_px'],x['s2b_lead_px'],x['consistent_lead_px'],x['lead_jaccard'],x['consistent_components_ge4px']) for x in sectors[:8]]},indent=2))
          PY
      - name: Verify bounded output
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = MEASURED_ACQUISITION_SPLIT_CONSISTENCY_CANARY
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          test "$(du -sb out | cut -f1)" -le 10485760
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)
      - name: Upload consistency result
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-urban-acquisition-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Record digest
        if: success()
        run: echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
