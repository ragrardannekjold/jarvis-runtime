name: AI39 Shodan aggregate device-class probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Aggregate-only device, related-ASN and trend characterization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          import requests

          key=os.environ.get('SHODAN_API_KEY','').strip()
          primary_org="STATE UNITARY ENTERPRISE OF THE DONETSK PEOPLE'S REPUBLIC REPUBLICAN TELECOMMUNICATIONS OPERATOR"
          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'scope':'Aggregate-only passive device/service-family, related-ASN and monthly trend characterization. No hosts, IPs, banners, versions, vulnerabilities, screenshots, credentials, or exact locations retained.','status':'UNKNOWN','profiles':{},'related_asns_by_org':{},'trends':{},'credits_before':None,'credits_after':None,'credits_delta':None,'interpretation_limit':'Ports/products and monthly counts are infrastructure signals, not proof of physical device identity, military ownership, people, exact location, or operational purpose.'}
          families={'network_management_snmp':'port:161','network_management_mikrotik_winbox':'port:8291','network_management_mikrotik_api':'port:8728','video_streaming_rtsp':'port:554','industrial_modbus':'port:502','industrial_s7':'port:102','industrial_bacnet':'port:47808','industrial_ethernet_ip':'port:44818','industrial_dnp3':'port:20000','iot_mqtt':'port:1883','realtime_nat_traversal_stun':'port:3478'}
          def get(url, params):
              r=requests.get(url,params=params,timeout=60); r.raise_for_status(); return r.json()
          def api_info(): return get('https://api.shodan.io/api-info',{'key':key}).get('query_credits')
          def count(query, facets=None):
              p={'key':key,'query':query}
              if facets: p['facets']=facets
              return get('https://api.shodan.io/shodan/host/count',p)
          def profile(asn):
              q='asn:'+asn
              b=count(q,'port:100,product:50,os:50,org:20')
              rec={'total':b.get('total'),'facets':b.get('facets') or {},'service_family_counts':{}}
              for name,flt in families.items():
                  try: rec['service_family_counts'][name]=int(count(q+' '+flt).get('total') or 0)
                  except Exception as e: rec['service_family_counts'][name]={'status':'ERROR','error_class':type(e).__name__}
              return rec
          def trend(asn):
              r=requests.get('https://trends.shodan.io/api/v1/search',params={'key':key,'query':'asn:'+asn},timeout=90)
              if r.status_code!=200: return {'status':'UNAVAILABLE','http_status':r.status_code}
              j=r.json(); monthly=[]
              for m in j.get('matches',[]):
                  if isinstance(m.get('month'),str) and isinstance(m.get('count'),(int,float)): monthly.append({'month':m['month'],'count':int(m['count'])})
              monthly.sort(key=lambda x:x['month'])
              return {'status':'VERIFIED_AGGREGATE','monthly':monthly[-24:]}
          if not key: out['status']='NO_SECRET'
          else:
              try:
                  out['credits_before']=api_info()
                  q='org:"'+primary_org+'"'; j=count(q,'asn:50'); af=(j.get('facets') or {}).get('asn',[])
                  out['related_asns_by_org']['primary_operator']={'total_indexed_services':j.get('total'),'asn_facets':af}
                  asns=[]
                  for row in af:
                      a=str(row.get('value','')).upper()
                      if a and a not in asns: asns.append(a)
                  for a in asns:
                      out['profiles'][a]=profile(a)
                      out['trends'][a]=trend(a)
                  out['credits_after']=api_info()
                  if isinstance(out['credits_before'],int) and isinstance(out['credits_after'],int): out['credits_delta']=out['credits_before']-out['credits_after']
                  out['status']='VERIFIED_AGGREGATE'
              except requests.HTTPError as e: out['status']='HTTP_ERROR'; out['http_status']=getattr(e.response,'status_code',None)
              except Exception as e: out['status']='ERROR'; out['error_class']=type(e).__name__
          with open('out/deviceclass.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-shodan-deviceclass
          path: out/deviceclass.json
          if-no-files-found: error
          retention-days: 2
