name: AI39 Shodan aggregate device-class probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Aggregate-only device and service-family characterization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          import requests

          key=os.environ.get('SHODAN_API_KEY','').strip()
          base='asn:AS202279'
          primary_org="STATE UNITARY ENTERPRISE OF THE DONETSK PEOPLE'S REPUBLIC REPUBLICAN TELECOMMUNICATIONS OPERATOR"
          secondary_org='Timer, LLC'
          out={
            'generated_utc':datetime.now(timezone.utc).isoformat(),
            'scope':'Aggregate-only passive device/service-family characterization and related-ASN expansion. No hosts, IPs, banners, versions, vulnerabilities, screenshots, credentials, or exact locations retained.',
            'asn':'AS202279',
            'status':'UNKNOWN',
            'base_total':None,
            'facets':{},
            'service_family_counts':{},
            'related_asns_by_org':{},
            'credits_before':None,
            'credits_after':None,
            'credits_delta':None,
            'interpretation_limit':'Ports/products indicate exposed service families, not physical device identity, military ownership, people, exact location, or operational purpose.'
          }

          def get(path, params):
              r=requests.get('https://api.shodan.io'+path,params=params,timeout=60)
              r.raise_for_status(); return r.json()
          def api_info():
              return get('/api-info',{'key':key}).get('query_credits')
          def count(query, facets=None):
              p={'key':key,'query':query}
              if facets: p['facets']=facets
              return get('/shodan/host/count',p)

          if not key:
              out['status']='NO_SECRET'
          else:
              try:
                  out['credits_before']=api_info()
                  b=count(base,'port:100,product:50,os:50,org:20')
                  out['base_total']=b.get('total')
                  out['facets']=b.get('facets') or {}

                  # Broad technical families only. Counts are kept separately; never sum them into unique-host counts.
                  families={
                    'network_management_snmp':'port:161',
                    'network_management_mikrotik_winbox':'port:8291',
                    'network_management_mikrotik_api':'port:8728',
                    'video_streaming_rtsp':'port:554',
                    'industrial_modbus':'port:502',
                    'industrial_s7':'port:102',
                    'industrial_bacnet':'port:47808',
                    'industrial_ethernet_ip':'port:44818',
                    'industrial_dnp3':'port:20000',
                    'iot_mqtt':'port:1883',
                    'realtime_nat_traversal_stun':'port:3478'
                  }
                  for name,flt in families.items():
                      try:
                          out['service_family_counts'][name]=int(count(base+' '+flt).get('total') or 0)
                      except Exception as e:
                          out['service_family_counts'][name]={'status':'ERROR','error_class':type(e).__name__}

                  # Expand the telecom graph without guessing ASN IDs: ask Shodan which ASNs carry the already-observed organizations.
                  for label,org in [('primary_operator',primary_org),('secondary_operator',secondary_org)]:
                      try:
                          q='org:"'+org.replace('"','')+'"'
                          j=count(q,'asn:50')
                          out['related_asns_by_org'][label]={
                            'total_indexed_services':j.get('total'),
                            'asn_facets':(j.get('facets') or {}).get('asn',[])
                          }
                      except Exception as e:
                          out['related_asns_by_org'][label]={'status':'ERROR','error_class':type(e).__name__}

                  try:
                      dj=count(base,'device:50')
                      out['device_facet']=dj.get('facets',{}).get('device',[])
                  except Exception as e:
                      out['device_facet_status']='UNAVAILABLE'
                      out['device_facet_error_class']=type(e).__name__

                  out['credits_after']=api_info()
                  if isinstance(out['credits_before'],int) and isinstance(out['credits_after'],int):
                      out['credits_delta']=out['credits_before']-out['credits_after']
                  out['status']='VERIFIED_AGGREGATE'
              except requests.HTTPError as e:
                  out['status']='HTTP_ERROR'; out['http_status']=getattr(e.response,'status_code',None)
              except Exception as e:
                  out['status']='ERROR'; out['error_class']=type(e).__name__

          with open('out/deviceclass.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-shodan-deviceclass
          path: out/deviceclass.json
          if-no-files-found: error
          retention-days: 2
