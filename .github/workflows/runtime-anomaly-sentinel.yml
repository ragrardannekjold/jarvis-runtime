name: Runtime Anomaly Sentinel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-anomaly-sentinel.yml'
      - 'runtime/anomaly-sentinel/**'
  schedule:
    - cron: '3-53/10 * * * *'

permissions:
  contents: read

concurrency:
  group: runtime-anomaly-sentinel
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read-only contract, worker, and canary gate
        run: |
          node --test runtime/anomaly-sentinel/*.test.mjs
          node runtime/anomaly-sentinel/canary.mjs

  observe:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read-only source and liveness observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CANCEL_WORKFLOWS: Kyiv V3 public collector
        run: node runtime/anomaly-sentinel/worker.mjs
