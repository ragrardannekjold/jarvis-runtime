name: Runtime Anomaly Sentinel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-anomaly-sentinel.yml'
      - 'runtime/anomaly-sentinel/**'
  schedule:
    - cron: '23 * * * *'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: runtime-anomaly-sentinel
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Contract gate
        run: node --test runtime/anomaly-sentinel/sentinel.test.mjs
      - name: Scan source workflow state and reconcile incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CANCEL_WORKFLOWS: Kyiv V3 public collector
        run: node runtime/anomaly-sentinel/worker.mjs
