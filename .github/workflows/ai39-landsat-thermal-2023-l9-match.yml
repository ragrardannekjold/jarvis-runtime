name: AI39 Landsat thermal 2023 L9 temporal match

on:
  push:
    branches: [ai39-landsat-thermal-2023-l9-match-20260825]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install pinned geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.2.6 rasterio==1.4.3 pystac-client==0.8.6 planetary-computer==1.0.0
      - name: Run 2023 L9 temporal match probe
        run: python scripts/ai39_landsat_thermal_pixel_probe_2023_l9_match.py
      - name: Verify bounded output
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = LANDSAT_THERMAL_PIXEL_QA_PROBE
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-landsat-thermal-2023-l9-match-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14
