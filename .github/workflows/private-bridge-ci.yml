name: Private Bridge Contract CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "runtime/private-bridge/**"
      - "runtime/continuous-queue/**"
      - ".github/workflows/private-bridge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-bridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public runtime
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check private bridge
        run: node --check runtime/private-bridge/bridge.mjs

      - name: Run private bridge security contracts without secrets
        env:
          JARVIS_PRIVATE_BRIDGE_APP_ID: ""
          JARVIS_PRIVATE_BRIDGE_PRIVATE_KEY: ""
          JARVIS_PRIVATE_BRIDGE_INSTALLATION_ID: ""
        run: node --test runtime/private-bridge/bridge.test.mjs

      - name: Re-run continuous queue regression when queue integration changes
        run: node --test runtime/continuous-queue/worker.test.mjs
