name: AI39 archival urban same-platform variability envelope

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-urban-variability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variability-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'

      - name: Install pinned geospatial runtime
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.3 numpy==2.2.6 rasterio==1.4.3
          pystac-client==0.8.6 planetary-computer==1.0.0

      - name: Measure archived three-day same-platform variability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/provenance
          python - <<'PY'
          import json, math
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np
          import rasterio, requests
          from pystac_client import Client
          import planetary_computer
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from rasterio.warp import reproject, transform_bounds

          AOI=[37.65,48.25,38.25,48.90]
          CRS='EPSG:32637'; RES=30; BUILT=7
          PLATFORM='S2B'
          DAY_A='2024-08-20'; DAY_B='2024-08-23'
          STAC='https://earth-search.aws.element84.com/v1/search'
          COLL='sentinel-2-c1-l2a'
          CLEAR=np.array([4,5,6],np.uint8)
          FEATURES=['ndvi','nbr','bsi','ndbi']

          def wj(path,value):
              Path(path).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')

          left,bottom,right,top=transform_bounds('EPSG:4326',CRS,*AOI,densify_pts=41)
          left=math.floor(left/RES)*RES; bottom=math.floor(bottom/RES)*RES
          right=math.ceil(right/RES)*RES; top=math.ceil(top/RES)*RES
          W=int(round((right-left)/RES)); H=int(round((top-bottom)/RES))
          TR=from_bounds(left,bottom,right,top,W,H)

          def rp(href,dtype='float32',resampling=Resampling.bilinear,nodata=np.nan):
              out=np.full((H,W),nodata,dtype=dtype)
              with rasterio.Env(
                  AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR',
                  CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif,.TIF',
                  GDAL_HTTP_MAX_RETRY='3',GDAL_HTTP_RETRY_DELAY='2'):
                  with rasterio.open(href) as src:
                      reproject(
                          source=rasterio.band(src,1),destination=out,
                          src_transform=src.transform,src_crs=src.crs,src_nodata=src.nodata,
                          dst_transform=TR,dst_crs=CRS,dst_nodata=nodata,
                          resampling=resampling)
              return out

          pc=Client.open(
              'https://planetarycomputer.microsoft.com/api/stac/v1',
              modifier=planetary_computer.sign_inplace)

          def load_landcover(year):
              candidates=list(pc.search(
                  collections=['io-lulc-9-class'],bbox=AOI,
                  datetime=f'{year}-01-01/{year}-12-31').items())
              selected=[it for it in candidates if str(it.id).endswith(f'-{year}')]
              if not selected:
                  raise RuntimeError(f'no exact annual land-cover item for {year}')
              arr=np.zeros((H,W),np.uint8); ids=[]
              for item in selected:
                  asset=(item.assets.get('data') or item.assets.get('map') or
                         next((a for a in item.assets.values()
                               if a.href.lower().endswith(('.tif','.tiff'))),None))
                  if asset is None:
                      continue
                  tile=rp(asset.href,'uint8',Resampling.nearest,0)
                  m=tile>0; arr[m]=tile[m]; ids.append(str(item.id))
              coverage=float((arr>0).mean())
              if coverage<0.95 or any(not x.endswith(f'-{year}') for x in ids):
                  raise RuntimeError(f'land-cover provenance gate failed {year}')
              return arr,sorted(ids),coverage

          lc21,ids21,cov21=load_landcover(2021)
          lc22,ids22,cov22=load_landcover(2022)
          stable=(lc21==BUILT)&(lc22==BUILT)
          core=stable.copy(); padded=np.pad(stable,1,constant_values=False)
          for dy in range(3):
              for dx in range(3):
                  core &= padded[dy:dy+H,dx:dx+W]
          core_n=int(core.sum())
          if core_n<5000:
              raise RuntimeError(f'urban core too small {core_n}')

          def search_day(day):
              body={'collections':[COLL],'bbox':AOI,
                    'datetime':f'{day}T00:00:00Z/{day}T23:59:59Z','limit':100}
              response=requests.post(STAC,json=body,timeout=120)
              response.raise_for_status()
              features=response.json().get('features',[])
              selected=[item for item in features
                        if str(item.get('id') or '').split('_',1)[0]==PLATFORM]
              wj(f'out/provenance/{day}.json',{
                  'request':body,
                  'all_scene_ids':sorted(str(item.get('id')) for item in features),
                  'selected_platform':PLATFORM,
                  'selected_scene_ids':sorted(str(item.get('id')) for item in selected)})
              if not selected:
                  raise RuntimeError(f'no {PLATFORM} scenes on {day}')
              return selected

          def load_scene(day):
              items=search_day(day)
              required=['red','blue','nir08','swir16','swir22','scl']
              red=np.full((H,W),np.nan,np.float32); blue=red.copy(); nir=red.copy()
              swir16=red.copy(); swir22=red.copy(); scl=np.zeros((H,W),np.uint8)
              ids=[]
              for item in items:
                  assets=item.get('assets',{})
                  if not all((assets.get(k) or {}).get('href') for k in required):
                      continue
                  try:
                      rr=rp(assets['red']['href']); bb=rp(assets['blue']['href'])
                      nn=rp(assets['nir08']['href']); s16=rp(assets['swir16']['href'])
                      s22=rp(assets['swir22']['href'])
                      cc=rp(assets['scl']['href'],'uint8',Resampling.nearest,0)
                  except Exception:
                      continue
                  valid=(np.isfinite(rr)&np.isfinite(bb)&np.isfinite(nn)&
                         np.isfinite(s16)&np.isfinite(s22)&
                         (rr>0)&(bb>0)&(nn>0)&(s16>0)&(s22>0)&(cc>0))
                  red[valid]=rr[valid]; blue[valid]=bb[valid]; nir[valid]=nn[valid]
                  swir16[valid]=s16[valid]; swir22[valid]=s22[valid]; scl[valid]=cc[valid]
                  ids.append(str(item.get('id')))
              observed=(np.isfinite(red)&np.isfinite(blue)&np.isfinite(nir)&
                        np.isfinite(swir16)&np.isfinite(swir22)&(scl>0))
              clear=core&observed&np.isin(scl,CLEAR)
              def index(num,den):
                  out=np.full((H,W),np.nan,np.float32)
                  out[clear]=num[clear]/(den[clear]+1e-6)
                  return out
              return {
                  'day':day,'scene_ids':sorted(set(ids)),'clear':clear,
                  'clear_fraction':float(clear.sum()/core_n),
                  'features':{
                      'ndvi':index(nir-red,nir+red),
                      'nbr':index(nir-swir22,nir+swir22),
                      'bsi':index((swir16+red)-(nir+blue),(swir16+red)+(nir+blue)),
                      'ndbi':index(swir16-nir,swir16+nir)}}

          sceneA=load_scene(DAY_A); sceneB=load_scene(DAY_B)
          common=sceneA['clear']&sceneB['clear']
          common_px=int(common.sum()); common_fraction=float(common_px/core_n)
          if sceneA['clear_fraction']<0.50 or sceneB['clear_fraction']<0.50:
              raise RuntimeError(
                  f'day coverage below QA floor A={sceneA["clear_fraction"]:.6f} B={sceneB["clear_fraction"]:.6f}')
          if common_fraction<0.50:
              raise RuntimeError(f'common-clear coverage below 50%: {common_fraction:.6f}')

          quantiles=[50,75,90,95,99,99.5,99.9]
          global_stats={}; diff_arrays={}
          thresholds={}
          for name in FEATURES:
              diff=np.abs(sceneB['features'][name]-sceneA['features'][name])
              diff[~common]=np.nan
              values=diff[common]
              if values.size<10000:
                  raise RuntimeError(f'not enough common values for {name}')
              qs={str(q):round(float(np.nanpercentile(values,q)),8) for q in quantiles}
              median=float(np.nanmedian(values))
              mad=float(np.nanmedian(np.abs(values-median)))
              robust_scale=max(1.4826*mad,1e-4)
              global_stats[name]={
                  'median_abs_diff':round(median,8),
                  'mad_abs_diff':round(mad,8),
                  'robust_scale':round(robust_scale,8),
                  'quantiles':qs}
              thresholds[name]=float(np.nanpercentile(values,99.5))
              diff_arrays[name]=diff

          exceed_count=np.zeros((H,W),np.uint8)
          for name in FEATURES:
              exceed_count += (common&(diff_arrays[name]>=thresholds[name])).astype(np.uint8)
          joint_tail=common&(exceed_count>=2)

          row_edges=np.linspace(0,H,5,dtype=int)
          col_edges=np.linspace(0,W,5,dtype=int)
          sectors=[]
          for rr in range(4):
              for cc in range(4):
                  sector=f"{'ABCD'[cc]}{rr+1}"
                  ys=slice(row_edges[rr],row_edges[rr+1])
                  xs=slice(col_edges[cc],col_edges[cc+1])
                  core_px=int(core[ys,xs].sum())
                  common_mask=common[ys,xs]
                  common_sector_px=int(common_mask.sum())
                  row={
                      'sector':sector,
                      'urban_core_px':core_px,
                      'common_clear_px':common_sector_px,
                      'common_clear_fraction':round(common_sector_px/max(core_px,1),6)}
                  if common_sector_px<300:
                      row['state']='INSUFFICIENT_DATA'
                      row['joint_tail_px']=None
                      row['joint_tail_fraction_of_common']=None
                      row['feature_p99_abs_diff']={name:None for name in FEATURES}
                  else:
                      row['state']='SUFFICIENT'
                      row['joint_tail_px']=int(joint_tail[ys,xs].sum())
                      row['joint_tail_fraction_of_common']=round(
                          float(joint_tail[ys,xs].sum()/common_sector_px),8)
                      row['feature_p99_abs_diff']={
                          name:round(float(np.nanpercentile(diff_arrays[name][ys,xs][common_mask],99)),8)
                          for name in FEATURES}
                  sectors.append(row)

          result={
              'status':'MEASURED_ARCHIVAL_SAME_PLATFORM_VARIABILITY_ENVELOPE',
              'generated_utc':datetime.now(timezone.utc).isoformat(),
              'purpose':'Measure the empirical three-day same-platform optical variability envelope on the verified urban core before treating small spectral deviations as anomalous.',
              'scope':'Historical method QA only. The envelope includes acquisition variability plus any real short-interval surface changes; it is not a pure sensor-noise estimate and contains no causal/activity inference.',
              'pair':{
                  'platform':PLATFORM,
                  'day_a':DAY_A,'day_b':DAY_B,
                  'separation_days':3,
                  'day_a_clear_fraction':round(sceneA['clear_fraction'],8),
                  'day_b_clear_fraction':round(sceneB['clear_fraction'],8),
                  'common_clear_px':common_px,
                  'common_clear_fraction':round(common_fraction,8),
                  'day_a_scene_ids':sceneA['scene_ids'],
                  'day_b_scene_ids':sceneB['scene_ids']},
              'urban_mask':{
                  'exact_year_ids':{'2021':ids21,'2022':ids22},
                  'coverage':{'2021':cov21,'2022':cov22},
                  'eroded_core_px':core_n},
              'global_abs_difference_envelope':global_stats,
              'joint_tail_definition':'Pixel exceeds the global 99.5th percentile absolute-difference threshold in at least two of NDVI/NBR/BSI/NDBI.',
              'joint_tail_px':int(joint_tail.sum()),
              'joint_tail_fraction_of_common':round(float(joint_tail.sum()/common_px),8),
              'broad_sector_diagnostics':sectors,
              'truth_rules':[
                  'This pair is historical calibration, not evidence about current conditions.',
                  'The measured envelope combines sensor/acquisition variability and any real three-day ground changes; do not label it pure noise.',
                  'Small future optical deviations inside this envelope should not be upgraded merely because they are nonzero.',
                  'No geometry, object positions, actor attribution, route inference, or current-presence inference is exported.',
                  'A single historical pair is a canary calibration, not a final universal threshold.'],
              'next_gate':'Use this canary envelope to test whether the current optical detector threshold is materially above ordinary short-interval variability. If close to the envelope, expand calibration to more archived same-platform pairs before any promotion.'}
          wj('out/result.json',result)

          qa={'status':'PASS','checks':{
              'exact_year_landcover':(
                  all(x.endswith('-2021') for x in ids21) and
                  all(x.endswith('-2022') for x in ids22)),
              'same_platform_both_days':(
                  all(x.startswith('S2B_') for x in sceneA['scene_ids']) and
                  all(x.startswith('S2B_') for x in sceneB['scene_ids'])),
              'day_a_clear_ge_0_50':sceneA['clear_fraction']>=0.50,
              'day_b_clear_ge_0_50':sceneB['clear_fraction']>=0.50,
              'common_clear_ge_0_50':common_fraction>=0.50,
              'historical_only':True,
              'no_geometry_export':True,
              'no_generated_pixels':True}}
          if not all(qa['checks'].values()):
              qa['status']='FAIL'
          wj('out/qa.json',qa)
          if qa['status']!='PASS':
              raise RuntimeError(json.dumps(qa))

          print(json.dumps({
              'qa':qa,
              'pair':result['pair'],
              'envelope':global_stats,
              'joint_tail_px':result['joint_tail_px'],
              'joint_tail_fraction':result['joint_tail_fraction_of_common'],
              'sector_joint_tail':[
                  (row['sector'],row['state'],row['common_clear_fraction'],
                   row['joint_tail_px'],row['joint_tail_fraction_of_common'])
                  for row in sectors]
          },indent=2))
          PY

      - name: Verify bounded output and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(jq -r .status out/result.json)" = MEASURED_ARCHIVAL_SAME_PLATFORM_VARIABILITY_ENVELOPE
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          test "$(du -sb out | cut -f1)" -le 5242880
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)

      - name: Upload variability envelope
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-urban-variability-envelope-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Record digest
        if: success()
        run: echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
