name: Utility Search Vercel Credential Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/utility-search-vercel-credential-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check credential presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'credential_state=MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo 'VERCEL_TOKEN is not configured for this runtime.'
            exit 3
          fi
          echo 'credential_state=PRESENT' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate credential against Vercel API without printing secret or body
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.vercel.com/v2/user)"
          rm -f /tmp/vercel-user.json
          if [ "$code" = '200' ]; then
            echo 'credential_validation=VALID' >> "$GITHUB_STEP_SUMMARY"
            echo 'Vercel credential is valid.'
            exit 0
          fi
          echo "credential_validation=INVALID_OR_BLOCKED_HTTP_${code}" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel credential validation failed with HTTP ${code}."
          exit 4
