name: AI39 OPERA raw-power export probe

on:
  push:
    branches: [ai39-opera-sar-calibration-20260825]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai39-opera-raw-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install pinned raster runtime
        run: python -m pip install --disable-pip-version-check requests==2.32.3 numpy==2.2.6 rasterio==1.4.3
      - name: Probe historical OPERA raw-power mosaic
        run: python scripts/ai39_opera_raw_export_probe.py
      - name: Verify bounded output
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status out/qa.json)" = PASS
          test "$(find out -type f \( -name '*.tif' -o -name '*.png' -o -name '*.geojson' \) | wc -l)" -eq 0
          (cd out && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd out && sha256sum -c SHA256SUMS.txt)
      - name: Upload probe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai39-opera-raw-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14
