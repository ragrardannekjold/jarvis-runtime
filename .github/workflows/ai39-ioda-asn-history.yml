name: AI39 IODA ASN history corroborator

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Aggregate ASN active-probing and BGP visibility history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, math, statistics, requests, datetime, urllib.parse
          BASE='https://api.ioda.inetintel.cc.gatech.edu/v2'
          ASN_NUM='202279'
          OUT={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'Aggregate IODA ASN history only; no IPs, hosts, routes, prefix identities or exact locations retained.','asn':'AS'+ASN_NUM,'series':{}}
          HEAD={'User-Agent':'AI39-aggregate-passive-research/1.0'}

          def walk(o):
              if isinstance(o,dict):
                  if 'datasource' in o and 'values' in o: yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          def points(o,ds):
              out=[]
              for s in walk(o):
                  if str(s.get('datasource'))!=ds: continue
                  vals=s.get('values')
                  if not isinstance(vals,list): continue
                  for v in vals:
                      if isinstance(v,list) and len(v)>=2 and isinstance(v[-1],(int,float)) and math.isfinite(float(v[-1])):
                          out.append(float(v[-1]))
              return out
          def resolve_code():
              r=requests.get(f'{BASE}/entities/query',params={'entityType':'asn','search':ASN_NUM,'limit':20},timeout=45,headers=HEAD)
              rec={'http_status':r.status_code,'resolved':False,'code':None}
              if r.status_code!=200: return rec
              o=r.json(); rows=o.get('data') if isinstance(o,dict) else []
              if not isinstance(rows,list): rows=[]
              for x in rows:
                  if not isinstance(x,dict): continue
                  c=str(x.get('code','')).strip(); digits=c.upper().replace('AS','')
                  if digits==ASN_NUM:
                      rec.update({'resolved':True,'code':c}); return rec
              return rec
          ent=resolve_code(); OUT['entity_resolution']=ent
          candidates=[]
          if ent.get('code'): candidates.append(str(ent['code']))
          candidates += [ASN_NUM,'AS'+ASN_NUM]
          candidates=list(dict.fromkeys(candidates))

          months=[]
          for m in range(1,9):
              start=datetime.datetime(2026,m,1,tzinfo=datetime.timezone.utc)
              if m<8: end=datetime.datetime(2026,m+1,1,tzinfo=datetime.timezone.utc)-datetime.timedelta(seconds=1)
              else: end=datetime.datetime(2026,8,23,23,59,59,tzinfo=datetime.timezone.utc)
              months.append((start,end))

          for ds in ['ping-slash24','bgp']:
              rec={'status':'NO_SERIES','monthly':[],'resolved_path_code':None}
              for start,end in months:
                  mrec={'month':start.strftime('%Y-%m'),'status':'UNAVAILABLE','median':None,'points':0,'http_status':None}
                  success=False
                  for code in candidates:
                      params={'from':int(start.timestamp()),'until':int(end.timestamp()),'datasource':ds,'maxPoints':240}
                      r=requests.get(f'{BASE}/signals/raw/asn/{urllib.parse.quote(code)}',params=params,timeout=60,headers=HEAD)
                      mrec['http_status']=r.status_code
                      if r.status_code!=200: continue
                      vals=points(r.json(),ds)
                      if vals:
                          mrec.update({'status':'MEASURED','median':round(float(statistics.median(vals)),4),'points':len(vals),'p10':round(float(sorted(vals)[max(0,int(len(vals)*.10)-1)]),4),'p90':round(float(sorted(vals)[min(len(vals)-1,int(len(vals)*.90))]),4)})
                          rec['resolved_path_code']=code; success=True; break
                      else:
                          mrec['status']='NO_SERIES'; rec['resolved_path_code']=code; success=True; break
                  rec['monthly'].append(mrec)
              vals=[x for x in rec['monthly'] if x['status']=='MEASURED' and isinstance(x.get('median'),(int,float))]
              if vals:
                  rec['status']='MEASURED'; rec['measured_months']=len(vals)
                  if len(vals)>=2 and vals[0]['median']!=0:
                      rec['first_to_latest_pct']=round((vals[-1]['median']-vals[0]['median'])/abs(vals[0]['median'])*100,2)
              OUT['series'][ds]=rec

          OUT['interpretation_limit']='IODA reachability/BGP series indicate network visibility or probing response, not people, military use, ownership, operational control or physical location.'
          with open('out/ioda_asn_history.json','w') as f: json.dump(OUT,f,indent=2)
          print(json.dumps(OUT,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-ioda-asn-history
          path: out/ioda_asn_history.json
          if-no-files-found: error
          retention-days: 2
