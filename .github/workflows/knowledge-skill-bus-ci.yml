name: Knowledge and Skills Bus CI

on:
  pull_request:
    paths:
      - 'runtime/knowledge-skill-bus/**'
      - 'runtime/continuous-queue/worker.mjs'
      - '.github/workflows/knowledge-skill-bus-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run bus contract tests
        run: node --test runtime/knowledge-skill-bus/bus-core.test.mjs

      - name: Emit exact external canary readback
        run: node runtime/knowledge-skill-bus/canary.mjs
