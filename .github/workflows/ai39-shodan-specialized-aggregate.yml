name: AI39 Shodan specialized aggregate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Aggregate specialized-class screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          import requests

          key=os.environ.get('SHODAN_API_KEY','').strip()
          ASN='AS202279'
          out={
            'generated_utc': datetime.now(timezone.utc).isoformat(),
            'scope': 'Aggregate-only passive Shodan class screen for one public ASN lead; deliberately non-targetable',
            'asn': ASN,
            'status': 'UNKNOWN',
            'current_total': None,
            'categories': {},
            'base_facets_summary': {},
            'credits_before': None,
            'credits_after': None,
            'credits_delta': None,
            'interpretation_limit': 'Category hits are overlapping indexed-service signatures, not unique devices, people, physical presence, ownership, operational control, or exact locations.',
            'safety': 'No IPs, hostnames, banners, versions, vulnerabilities, screenshots, credentials or exact locations are requested or retained.'
          }

          signatures={
            'surveillance_media': [
              'port:554', 'device:webcam', 'product:"Hikvision"', 'product:"Dahua"'
            ],
            'network_management': [
              'port:161', 'port:8291', 'port:8728', 'port:8729', 'port:7547'
            ],
            'industrial_ot': [
              'port:502', 'port:102', 'port:47808', 'port:20000', 'port:44818'
            ],
            'telecom_edge': [
              'port:3478', 'port:5060', 'port:5061', 'port:1812', 'port:1813',
              'product:"MikroTik"', 'product:"Ubiquiti"'
            ],
            'remote_administration': [
              'port:3389', 'port:5900'
            ]
          }

          def api_info():
            r=requests.get('https://api.shodan.io/api-info',params={'key':key},timeout=30)
            r.raise_for_status(); return r.json().get('query_credits')

          def count(q, facets=None):
            params={'key':key,'query':q}
            if facets: params['facets']=facets
            r=requests.get('https://api.shodan.io/shodan/host/count',params=params,timeout=45)
            r.raise_for_status(); return r.json()

          if not key:
            out['status']='NO_SECRET'
          else:
            try:
              out['credits_before']=api_info()
              base=count(f'asn:{ASN}','device:20,product:30,os:20,port:50,org:20')
              out['current_total']=base.get('total')
              facets=base.get('facets') or {}
              out['base_facets_summary']={
                'recognized_device_classes': len(facets.get('device') or []),
                'recognized_product_classes': len(facets.get('product') or []),
                'recognized_os_classes': len(facets.get('os') or []),
                'recognized_port_classes': len(facets.get('port') or []),
                'recognized_org_classes': len(facets.get('org') or [])
              }
              for category, sigs in signatures.items():
                counts=[]
                errors=0
                for sig in sigs:
                  try:
                    j=count(f'asn:{ASN} {sig}')
                    n=j.get('total')
                    if isinstance(n,int): counts.append(n)
                  except Exception:
                    errors += 1
                positives=[n for n in counts if n>0]
                out['categories'][category]={
                  'signatures_tested': len(sigs),
                  'successful_counts': len(counts),
                  'positive_signatures': len(positives),
                  'max_signature_count': max(positives) if positives else 0,
                  'sum_signature_counts_overlap_possible': sum(positives),
                  'query_errors': errors,
                  'signal': 'PRESENT' if len(positives)>=2 or (positives and max(positives)>=2) else ('WEAK' if positives else 'NONE')
                }
              out['credits_after']=api_info()
              if isinstance(out['credits_before'],int) and isinstance(out['credits_after'],int):
                out['credits_delta']=out['credits_before']-out['credits_after']
              out['status']='VERIFIED_AGGREGATE'
            except requests.HTTPError as e:
              out['status']='HTTP_ERROR'; out['http_status']=getattr(e.response,'status_code',None)
            except Exception as e:
              out['status']='ERROR'; out['error_class']=type(e).__name__

          with open('out/specialized_aggregate.json','w') as f:
            json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-shodan-specialized-aggregate
          path: out/specialized_aggregate.json
          if-no-files-found: error
          retention-days: 2
