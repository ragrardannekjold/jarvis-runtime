name: Kyiv Early Warning Fast Watch

# Fast-path revision 12:
# - V1 predictive delivery remains retired;
# - sanitized low-bandwidth status/readback is a separate priority-1 path;
# - inactive official alert state is never represented as citywide safety;
# - stale or incomplete state fails closed to UNKNOWN;
# - ntfy HTTP 200 is SERVER_ACCEPTED_UNVERIFIED, never device receipt.
# Fast-path revision 13:
# - V1 is retired from user-facing delivery; runtime stays collection/state/backtest only;
# - the native five-minute default-branch schedule is the only trigger;
# - manual selected-ref dispatch, push execution, watchdog dispatch and recursive
#   self-dispatch are removed from this secret-bearing lane;
# - transition-safe entrypoint applies newest official ballistic standdown
#   semantics before should_send(), anchored to ballistic evidence time so a
#   later unrelated context cue cannot resurrect a pre-standdown ballistic cue;
# - unvalidated early ballistic evidence is preserved internally as EARLY_WATCH_BALLISTIC
#   instead of being silently collapsed to NO_MATERIAL_ALERT;
# - post-write reconciler also clears invalid post-standdown repeat suppression
#   when no newer ballistic cue survives, preserving sensitivity to a new event.
on:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: kyiv-fast-watch
  cancel-in-progress: false

jobs:
  fast-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Require private bridge token
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: |
          test -n "$COMMAND_CENTER_TOKEN" || {
            echo 'COMMAND_CENTER_TOKEN is missing' >&2
            exit 1
          }

      - name: Checkout private command center
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ragrardannekjold/jarvis-command-center
          ref: d97097c189e8d8dd52a97039d53fd40072dae220
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          path: command-center
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Syntax check fast watcher safety layer
        run: >-
          python -m py_compile
          command-center/scripts/runtime_kyiv_fast_watch.py
          command-center/scripts/runtime_kyiv_fast_watch_entrypoint.py
          command-center/scripts/runtime_kyiv_fast_watch_reconcile.py
          command-center/scripts/runtime_kyiv_fast_watch_readback.py
          command-center/scripts/test_runtime_kyiv_fast_watch_entrypoint.py
          command-center/scripts/test_runtime_kyiv_fast_watch_reconcile.py
          command-center/scripts/test_runtime_kyiv_fast_watch_readback.py

      - name: Regression test newest-transition safety layer
        id: fast_watch_tests
        run: python -m unittest discover -s command-center/scripts -p 'test_runtime_kyiv_fast_watch_*.py' -v

      - name: Run Kyiv fast watcher with pre-send transition guard
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          COMMAND_CENTER_REPO: ragrardannekjold/jarvis-command-center
        run: |
          python command-center/scripts/runtime_kyiv_fast_watch_entrypoint.py

      - name: Reconcile newest official state transition
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          COMMAND_CENTER_REPO: ragrardannekjold/jarvis-command-center
        run: python command-center/scripts/runtime_kyiv_fast_watch_reconcile.py

      - name: Publish sanitized low-bandwidth status readback
        if: ${{ !cancelled() && steps.fast_watch_tests.outcome == 'success' }}
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          COMMAND_CENTER_REPO: ragrardannekjold/jarvis-command-center
        run: python command-center/scripts/runtime_kyiv_fast_watch_readback.py
