name: Kyiv Early Warning Fast Watch

# Fast-path revision 3: GitHub schedule remains a bootstrap/watchdog, while
# workflow_dispatch self-chaining keeps the watcher alive when scheduled events
# are delayed or skipped. Concurrency prevents duplicate queues when cron works.
on:
  workflow_dispatch:
  schedule:
    # Keep the native 5-minute schedule as an independent bootstrap/watchdog.
    - cron: '2-59/5 * * * *'
  push:
    paths:
      - '.github/workflows/kyiv-fast-watch.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: kyiv-early-warning-fast-watch
  cancel-in-progress: true

jobs:
  fast-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Require private bridge token
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: |
          test -n "$COMMAND_CENTER_TOKEN" || {
            echo 'COMMAND_CENTER_TOKEN is missing' >&2
            exit 1
          }

      - name: Checkout private command center
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          ref: main
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          path: command-center
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check fast watcher
        run: python -m py_compile command-center/scripts/runtime_kyiv_fast_watch.py

      - name: Run Kyiv fast watcher
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          COMMAND_CENTER_REPO: ragrardannekjold/jarvis-command-center
        run: |
          extra=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            extra+=(--test-once)
          fi
          python command-center/scripts/runtime_kyiv_fast_watch.py "${extra[@]}"

      - name: Keep fast path alive if cron is delayed
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A native scheduled run may arrive during this wait. With
          # cancel-in-progress=true it replaces this run and becomes the next
          # heartbeat. If cron stays silent, workflow_dispatch creates the next
          # watcher pass without depending on GitHub schedule liveness.
          sleep 270
          code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kyiv-fast-watch.yml/dispatches" \
            -d '{"ref":"main"}')
          if [[ "$code" != "204" ]]; then
            echo "self-dispatch failed HTTP $code" >&2
            cat /tmp/dispatch-response >&2 || true
            exit 1
          fi
          echo 'self-dispatch accepted'
