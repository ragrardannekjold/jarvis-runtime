name: Kyiv Early Warning Fast Watch

# Fast-path revision 5:
# - workflow_dispatch is the independent ~5-minute watcher loop;
# - native GitHub schedule is only a watchdog/bootstrap and does not create a
#   second competing watcher chain;
# - push remains a one-shot transport test after workflow changes and may
#   bootstrap the self-dispatch chain after a repair;
# - dispatch calls retry once on transient GitHub 5xx responses, then fail.
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    paths:
      - '.github/workflows/kyiv-fast-watch.yml'

permissions:
  contents: read
  actions: write

# Separate event classes so a bootstrap or workflow update cannot cancel the
# active self-dispatch loop. Successor workflow_dispatch runs queue behind the
# current loop iteration and start as soon as it completes.
concurrency:
  group: kyiv-fast-watch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  schedule-watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Bootstrap self-dispatch loop only if stale
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/kyiv-fast-watch.yml/runs?event=workflow_dispatch&per_page=1"
          payload=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          latest=$(printf '%s' "$payload" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("workflow_runs", []); print(r[0].get("created_at", "") if r else "")')
          stale=$(LATEST="$latest" python -c 'import datetime,os; s=os.environ.get("LATEST",""); now=datetime.datetime.now(datetime.timezone.utc); age=10**9 if not s else (now-datetime.datetime.fromisoformat(s.replace("Z","+00:00"))).total_seconds(); print("1" if age > 420 else "0")')
          if [[ "$stale" != "1" ]]; then
            echo "self-dispatch loop is recent; watchdog does not duplicate it"
            exit 0
          fi
          dispatch_url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/kyiv-fast-watch.yml/dispatches"
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$dispatch_url" \
              -d '{"ref":"main"}')
            if [[ "$code" == "204" ]]; then
              echo "stale/missing self-dispatch loop bootstrapped"
              exit 0
            fi
            echo "watchdog bootstrap failed HTTP $code (attempt $attempt/2)" >&2
            cat /tmp/dispatch-response >&2 || true
            if [[ "$attempt" == "1" && "$code" =~ ^5 ]]; then
              sleep 10
              continue
            fi
            exit 1
          done

  fast-watch:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Require private bridge token
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
        run: |
          test -n "$COMMAND_CENTER_TOKEN" || {
            echo 'COMMAND_CENTER_TOKEN is missing' >&2
            exit 1
          }

      - name: Checkout private command center
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          ref: main
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          path: command-center
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check fast watcher
        run: python -m py_compile command-center/scripts/runtime_kyiv_fast_watch.py

      - name: Run Kyiv fast watcher
        shell: bash
        env:
          COMMAND_CENTER_TOKEN: ${{ secrets.COMMAND_CENTER_TOKEN }}
          COMMAND_CENTER_REPO: ragrardannekjold/jarvis-command-center
        run: |
          extra=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            extra+=(--test-once)
          fi
          python command-center/scripts/runtime_kyiv_fast_watch.py "${extra[@]}"

      - name: Bootstrap fast-watch chain after workflow repair
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/kyiv-fast-watch.yml/dispatches"
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$dispatch_url" \
              -d '{"ref":"main"}')
            if [[ "$code" == "204" ]]; then
              echo 'repair bootstrap dispatch accepted'
              exit 0
            fi
            echo "repair bootstrap failed HTTP $code (attempt $attempt/2)" >&2
            cat /tmp/dispatch-response >&2 || true
            if [[ "$attempt" == "1" && "$code" =~ ^5 ]]; then
              sleep 10
              continue
            fi
            exit 1
          done

      - name: Continue independent fast-watch loop
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 270
          dispatch_url="https://api.github.com/repos/${{ github.repository }}/actions/workflows/kyiv-fast-watch.yml/dispatches"
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/dispatch-response -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$dispatch_url" \
              -d '{"ref":"main"}')
            if [[ "$code" == "204" ]]; then
              echo 'self-dispatch accepted'
              exit 0
            fi
            echo "self-dispatch failed HTTP $code (attempt $attempt/2)" >&2
            cat /tmp/dispatch-response >&2 || true
            if [[ "$attempt" == "1" && "$code" =~ ^5 ]]; then
              sleep 10
              continue
            fi
            exit 1
          done
