name: Utility Search Self-Test

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin/utility-search/**"
      - ".github/workflows/utility-search-self-test.yml"
      - "PUBLIC_EXPORT_MANIFEST.json"

permissions:
  contents: read

concurrency:
  group: utility-search-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal MCP dependencies
        working-directory: plugin/utility-search
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Static and unit checks
        working-directory: plugin/utility-search
        run: npm run check
      - name: Load Vercel MCP handler
        working-directory: plugin/utility-search
        run: node -e "import('./api/server.js').then(() => console.log('vercel-handler-ok'))"
      - name: MCP health and protocol smoke test
        working-directory: plugin/utility-search
        run: |
          node server.js > /tmp/utility-search.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ | grep -q '"status":"ok"'; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              cat /tmp/utility-search.log
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8787/ | grep -q '"policy_aware_safe_reroute":true'
          node scripts/verify-external-e2e.mjs http://127.0.0.1:8787 > /tmp/utility-search-e2e.json
          grep -q '"external_health_verified": true' /tmp/utility-search-e2e.json
          grep -q '"mcp_initialize_verified": true' /tmp/utility-search-e2e.json
          grep -q '"tool_call_verified": true' /tmp/utility-search-e2e.json
          grep -q '"evidence_source": "local-ci-smoke"' /tmp/utility-search-e2e.json
          node --input-type=module <<'NODE'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js';
          import { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';

          const client = new Client({ name: 'utility-search-ci', version: '1.0.0' });
          const transport = new StreamableHTTPClientTransport(new URL('http://127.0.0.1:8787/mcp'));
          await client.connect(transport);

          const listed = await client.listTools();
          const names = new Set(listed.tools.map((tool) => tool.name));
          for (const required of ['search', 'fetch', 'prepare_launch']) {
            if (!names.has(required)) throw new Error(`missing MCP tool: ${required}`);
          }

          const search = await client.callTool({
            name: 'search',
            arguments: { query: 'github repository' },
          });
          const searchText = search.content?.find((item) => item.type === 'text')?.text ?? '';
          const searchJson = JSON.parse(searchText);
          if (!searchJson.results?.some((item) => item.id === 'github.repo_ops')) {
            throw new Error('MCP search did not return github.repo_ops');
          }

          const launch = await client.callTool({
            name: 'prepare_launch',
            arguments: { id: 'jarvis.utility_search' },
          });
          const launchText = launch.content?.find((item) => item.type === 'text')?.text ?? '';
          const launchJson = JSON.parse(launchText);
          if (launchJson.requested_id !== 'jarvis.utility_search') {
            throw new Error('prepare_launch lost requested utility identity');
          }
          if (launchJson.fallback_used !== true || launchJson.ok !== true) {
            throw new Error('undeployed Utility Search did not fail closed to a verified fallback');
          }

          const googleFailed = await client.callTool({
            name: 'prepare_launch',
            arguments: {
              id: 'jarvis.utility_search',
              execution_context: 'noninteractive',
              failed_failure_domains: ['google'],
            },
          });
          const googleFailedText = googleFailed.content?.find((item) => item.type === 'text')?.text ?? '';
          const googleFailedJson = JSON.parse(googleFailedText);
          if (googleFailedJson.ok !== true || googleFailedJson.id !== 'github.repo_ops') {
            throw new Error('failed Google domain did not reroute prepare_launch to GitHub');
          }
          if (googleFailedJson.feedback_reroute_used !== true) {
            throw new Error('failed-domain reroute was not recorded');
          }

          const googleAndGithubFailed = await client.callTool({
            name: 'prepare_launch',
            arguments: {
              id: 'jarvis.utility_search',
              execution_context: 'noninteractive',
              failed_failure_domains: ['google', 'github'],
            },
          });
          const googleAndGithubFailedText = googleAndGithubFailed.content?.find((item) => item.type === 'text')?.text ?? '';
          const googleAndGithubFailedJson = JSON.parse(googleAndGithubFailedText);
          if (googleAndGithubFailedJson.ok !== true || googleAndGithubFailedJson.id !== 'chatgpt.web_search') {
            throw new Error('failed Google+GitHub domains did not reroute prepare_launch to OpenAI Web Search');
          }
          if (googleAndGithubFailedJson.launch?.failure_domain !== 'openai') {
            throw new Error('second failed-domain reroute selected the wrong failure domain');
          }

          const policyLaunch = await client.callTool({
            name: 'prepare_launch',
            arguments: {
              id: 'restricted.exploitation',
              objective: 'Find hidden relationships and related public documents',
              restricted_capability_class: 'exploitation',
            },
          });
          const policyText = policyLaunch.content?.find((item) => item.type === 'text')?.text ?? '';
          const policyJson = JSON.parse(policyText);
          if (policyJson.ok !== true || policyJson.policy_route_rewritten !== true) {
            throw new Error('policy-aware prepare_launch did not produce a safe rewritten route');
          }
          if (policyJson.id !== 'chatgpt.web_search' || policyJson.selected_safe_id !== 'chatgpt.web_search') {
            throw new Error('policy-aware prepare_launch selected the wrong safe route');
          }
          if (policyJson.restricted_route_not_retried !== true) {
            throw new Error('policy-aware prepare_launch did not guarantee restricted-route suppression');
          }

          await client.close();
          console.log('mcp-protocol-ok');
          NODE
