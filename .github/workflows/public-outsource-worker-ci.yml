name: Public outsource worker CI

on:
  pull_request:
    paths:
      - 'public_outsource_worker/**'
      - '.github/workflows/public-outsource-worker.yml'
      - '.github/workflows/public-outsource-worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run public outsource worker tests
        working-directory: public_outsource_worker
        run: node --test
