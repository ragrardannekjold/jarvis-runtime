name: Async Public Job Worker

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: async-job-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-public-job:
    if: >-
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[ASYNC-JOB]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run allowlisted async job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node runtime/async-jobs/worker.mjs
