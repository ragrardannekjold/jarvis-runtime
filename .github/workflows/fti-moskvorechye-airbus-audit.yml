name: FTI Moskvorechye Airbus Pleiades Neo Audit

on:
  push:
    paths:
      - '.github/workflows/fti-moskvorechye-airbus-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airbus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Airbus public OneAtlas archive at AOI
        run: |
          cat > /tmp/airbus.mjs <<'NODE'
          const point = { lon: 37.6878, lat: 55.6405 };
          const aoi = [37.6719,55.6315,37.7037,55.6495];
          const base = 'https://portal.intelligence-airbusds.com/arcgis/rest/services/OneAtlas/OADConstellationArchive/MapServer';

          async function json(url, params={}) {
            const u = new URL(url);
            for (const [k,v] of Object.entries(params)) if (v !== undefined && v !== null) u.searchParams.set(k,String(v));
            const r = await fetch(u,{headers:{'user-agent':'FTI-archive-audit/1.0','accept':'application/json'}});
            const text=await r.text();
            if(!r.ok) throw new Error(`HTTP ${r.status}: ${text.slice(0,500)}`);
            try{return JSON.parse(text)}catch{throw new Error(`non_json: ${text.slice(0,500)}`)}
          }
          const compact = f => ({attributes:f.attributes||{},geometry:f.geometry||null});
          const out={generated_at:new Date().toISOString(),point,aoi,service:{}};
          try { out.service = await json(base,{f:'json'}); } catch(e){ out.service_error=String(e.message||e); }
          const layerIds=[0,1,2,3,4];
          out.layers={};
          for (const id of layerIds) {
            const layerUrl=`${base}/${id}`;
            const rec={};
            try {
              const info=await json(layerUrl,{f:'json'});
              rec.name=info.name; rec.type=info.type; rec.objectIdField=info.objectIdField; rec.maxRecordCount=info.maxRecordCount;
              rec.fields=(info.fields||[]).map(x=>({name:x.name,alias:x.alias,type:x.type}));
              rec.displayField=info.displayField;
            } catch(e){rec.info_error=String(e.message||e)}
            const common={f:'json',where:'1=1',outFields:'*',returnGeometry:'true',inSR:'4326',outSR:'4326',spatialRel:'esriSpatialRelIntersects'};
            try {
              const q=await json(`${layerUrl}/query`,{...common,geometry:`${point.lon},${point.lat}`,geometryType:'esriGeometryPoint',resultRecordCount:'1000'});
              rec.point={count:q.features?.length??0,exceededTransferLimit:q.exceededTransferLimit??false,error:q.error??null,features:(q.features||[]).map(compact)};
            } catch(e){rec.point={error:String(e.message||e)}}
            try {
              const q=await json(`${layerUrl}/query`,{...common,geometry:aoi.join(','),geometryType:'esriGeometryEnvelope',resultRecordCount:'1000'});
              rec.aoi={count:q.features?.length??0,exceededTransferLimit:q.exceededTransferLimit??false,error:q.error??null,features:(q.features||[]).map(compact)};
            } catch(e){rec.aoi={error:String(e.message||e)}}
            out.layers[id]=rec;
          }
          console.log('FTI_AIRBUS_RESULT_BEGIN');
          console.log(JSON.stringify(out));
          console.log('FTI_AIRBUS_RESULT_END');
          NODE
          node /tmp/airbus.mjs
