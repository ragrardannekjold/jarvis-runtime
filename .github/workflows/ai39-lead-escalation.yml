name: AI39 fresh SAR pair retry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sar_pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_NO_SIGN_REQUEST: "YES"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests rasterio numpy
      - name: Broad-sector change screen for 16 to 22 Aug pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/sar_pair
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import requests, numpy as np, rasterio
          from rasterio.windows import from_bounds
          from rasterio.warp import transform_bounds
          from rasterio.enums import Resampling
          from rasterio.env import Env

          API='https://earth-search.aws.element84.com/v1/search'
          BBOX=[37.65,48.45,38.25,48.90]
          IDS=[
            'S1C_IW_GRDH_1SDV_20260816T034638_20260816T034703_009015_011E59',
            'S1D_IW_GRDH_1SDV_20260822T034651_20260822T034716_004233_007C63'
          ]

          def get_item(item_id):
              r=requests.post(API,json={'collections':['sentinel-1-grd'],'ids':[item_id],'limit':1},timeout=90)
              r.raise_for_status()
              fs=r.json().get('features',[])
              if not fs: raise RuntimeError('item_not_found')
              return fs[0]

          items=[get_item(x) for x in IDS]
          def vv_href(f):
              a=f.get('assets') or {}
              for k in ('vv','VV'):
                  if k in a and a[k].get('href'): return a[k]['href']
              for k,v in a.items():
                  if 'vv' in k.lower() and isinstance(v,dict) and v.get('href'): return v['href']
              raise RuntimeError('vv_asset_missing')

          hrefs=[vv_href(x) for x in items]
          arrays=[]
          shape=(800,1000)
          with Env(AWS_NO_SIGN_REQUEST='YES'):
              for href in hrefs:
                  with rasterio.open(href) as ds:
                      b=transform_bounds('EPSG:4326',ds.crs,*BBOX,densify_pts=21)
                      win=from_bounds(*b,transform=ds.transform)
                      arr=ds.read(1,window=win,out_shape=shape,resampling=Resampling.bilinear,boundless=True,fill_value=np.nan).astype('float32')
                      if ds.nodata is not None: arr[arr==ds.nodata]=np.nan
                      arr[arr<=0]=np.nan
                      arrays.append(10*np.log10(arr))

          old,new=arrays
          diff=new-old
          rows=[]
          h,w=diff.shape
          for r in range(4):
              for c in range(4):
                  y0,y1=round(r*h/4),round((r+1)*h/4)
                  x0,x1=round(c*w/4),round((c+1)*w/4)
                  vals=diff[y0:y1,x0:x1]
                  vals=vals[np.isfinite(vals)]
                  code=f'{chr(65+r)}{c+1}'
                  if vals.size<100:
                      rows.append({'sector':code,'valid_px':int(vals.size),'status':'INSUFFICIENT_DATA'})
                      continue
                  rows.append({
                      'sector':code,
                      'valid_px':int(vals.size),
                      'median_db_change':round(float(np.median(vals)),3),
                      'median_abs_db_change':round(float(np.median(np.abs(vals))),3),
                      'pct_abs_ge_3db':round(float(np.mean(np.abs(vals)>=3)*100),3),
                      'pct_pos_ge_3db':round(float(np.mean(vals>=3)*100),3),
                      'pct_neg_le_m3db':round(float(np.mean(vals<=-3)*100),3),
                      'status':'SCREENED'
                  })
          ranked=sorted([x for x in rows if x.get('status')=='SCREENED'],key=lambda x:x['pct_abs_ge_3db'],reverse=True)
          out={
             'generated_utc':datetime.now(timezone.utc).isoformat(),
             'scope':'broad 4x4 sector screen only; same relative orbit 167 descending pair; no target-level localization',
             'older_acquisition_utc':(items[0].get('properties') or {}).get('datetime'),
             'newer_acquisition_utc':(items[1].get('properties') or {}).get('datetime'),
             'days_apart':6,
             'sector_metrics':rows,
             'top4_by_abs3db_fraction':ranked[:4],
             'interpretation_limit':'GRD broad-sector screen is a lead generator. Backscatter change can reflect moisture, vegetation, agriculture, geometry, damage or other surface change; human/equipment attribution requires independent corroboration.',
             'safety':'No exact coordinates, positions, routes, trench lines or sensor locations.'
          }
          with open('out/sar_pair/pair.json','w') as f: json.dump(out,f,indent=2)
          print(json.dumps({'older':out['older_acquisition_utc'],'newer':out['newer_acquisition_utc'],'top4':out['top4_by_abs3db_fraction']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-sar-16-22-pair
          path: out/sar_pair/pair.json
          if-no-files-found: error
          retention-days: 2
