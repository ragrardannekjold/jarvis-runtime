name: FTI Moskvorechye EO Archive Audit

on:
  push:
    paths:
      - '.github/workflows/fti-moskvorechye-eo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Wayback core
        run: |
          mkdir -p /tmp/fti-eo
          cd /tmp/fti-eo
          npm init -y >/dev/null 2>&1
          npm install --silent @esri/wayback-core@1.1.0

      - name: Audit VHR optical, open SAR and Sentinel metadata
        working-directory: /tmp/fti-eo
        run: |
          cat > audit.mjs <<'NODE'
          import { getWaybackItems, getMetadata } from '@esri/wayback-core';

          const point = { longitude: 37.6878, latitude: 55.6405 };
          const aoi = [37.6719, 55.6315, 37.7037, 55.6495]; // ~2 km x 2 km around case AOI
          const out = { generated_at: new Date().toISOString(), point, aoi };

          const iso = ms => ms ? new Date(ms).toISOString() : null;
          const geomBbox = geom => {
            if (!geom) return null;
            const pts = [];
            const walk = x => Array.isArray(x) && typeof x[0] === 'number' ? pts.push(x) : Array.isArray(x) && x.forEach(walk);
            walk(geom.coordinates);
            if (!pts.length) return null;
            return [Math.min(...pts.map(p=>p[0])), Math.min(...pts.map(p=>p[1])), Math.max(...pts.map(p=>p[0])), Math.max(...pts.map(p=>p[1]))];
          };
          const bboxOverlap = (a,b) => a && b && !(a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3]);
          const pointInRing = (pt, ring) => {
            let inside=false; const [x,y]=pt;
            for(let i=0,j=ring.length-1;i<ring.length;j=i++){
              const [xi,yi]=ring[i], [xj,yj]=ring[j];
              const hit=((yi>y)!==(yj>y)) && x < (xj-xi)*(y-yi)/((yj-yi)||1e-15)+xi;
              if(hit) inside=!inside;
            }
            return inside;
          };
          const pointInPolygon = (pt, poly) => pointInRing(pt, poly[0]) && !poly.slice(1).some(r=>pointInRing(pt,r));
          const pointInGeom = (pt, g) => g?.type==='Polygon' ? pointInPolygon(pt,g.coordinates) : g?.type==='MultiPolygon' ? g.coordinates.some(p=>pointInPolygon(pt,p)) : false;
          const inBox = ([x,y],b)=>x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3];
          const orient=(a,b,c)=>Math.sign((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));
          const onSeg=(a,b,p)=>Math.min(a[0],b[0])<=p[0]&&p[0]<=Math.max(a[0],b[0])&&Math.min(a[1],b[1])<=p[1]&&p[1]<=Math.max(a[1],b[1]);
          const segInt=(a,b,c,d)=>{const o1=orient(a,b,c),o2=orient(a,b,d),o3=orient(c,d,a),o4=orient(c,d,b);if(o1!==o2&&o3!==o4)return true;if(o1===0&&onSeg(a,b,c))return true;if(o2===0&&onSeg(a,b,d))return true;if(o3===0&&onSeg(c,d,a))return true;if(o4===0&&onSeg(c,d,b))return true;return false;};
          const polyIntersectsBox=(poly,b)=>{
            const corners=[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]];
            if(corners.some(c=>pointInPolygon(c,poly))) return true;
            const ring=poly[0]; if(ring.some(p=>inBox(p,b))) return true;
            const edges=[[corners[0],corners[1]],[corners[1],corners[2]],[corners[2],corners[3]],[corners[3],corners[0]]];
            for(let i=1;i<ring.length;i++) for(const e of edges) if(segInt(ring[i-1],ring[i],e[0],e[1])) return true;
            return false;
          };
          const geomIntersectsBox=(g,b)=>g?.type==='Polygon'?polyIntersectsBox(g.coordinates,b):g?.type==='MultiPolygon'?g.coordinates.some(p=>polyIntersectsBox(p,b)):false;

          // 1) Esri World Imagery Wayback: actual capture metadata at exact point.
          try {
            const items = (await getWaybackItems()).filter(i => i.releaseDateLabel >= '2019-01-01');
            const rows=[];
            for (const item of items) {
              try {
                const m = await getMetadata(point, 18, item.releaseNum);
                rows.push({
                  release_date:item.releaseDateLabel,
                  release_num:item.releaseNum,
                  arcgis_item_id:item.itemID,
                  metadata_item_id:item.metadataLayerItemID,
                  acquisition_date:iso(m?.date),
                  provider:m?.provider ?? null,
                  sensor:m?.source ?? null,
                  resolution_m:m?.resolution ?? null,
                  accuracy_m:m?.accuracy ?? null,
                });
              } catch (e) {
                rows.push({release_date:item.releaseDateLabel,release_num:item.releaseNum,error:String(e?.message||e).slice(0,180)});
              }
            }
            const good=rows.filter(r=>r.acquisition_date);
            const uniq=new Map();
            for(const r of [...good].reverse()){
              const k=[r.acquisition_date,r.provider,r.sensor,r.resolution_m].join('|');
              const old=uniq.get(k);
              if(!old) uniq.set(k,{...r,first_release:r.release_date,last_release:r.release_date});
              else old.last_release=r.release_date;
            }
            out.wayback={release_count:items.length,successful_metadata:good.length,unique_acquisitions:[...uniq.values()].sort((a,b)=>a.acquisition_date.localeCompare(b.acquisition_date)),latest_release:good[0]??null};
          } catch(e){ out.wayback={error:String(e?.stack||e)}; }

          // Current Vantor/Maxar Vivid publication blocks around exact point.
          async function queryArcgis(url){
            const u=new URL(url+'/query');
            u.search=new URLSearchParams({f:'json',where:'1=1',outFields:'*',returnGeometry:'true',geometry:`${point.longitude},${point.latitude}`,geometryType:'esriGeometryPoint',inSR:'4326',outSR:'4326',spatialRel:'esriSpatialRelIntersects'}).toString();
            const r=await fetch(u); if(!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json();
          }
          out.vivid={};
          for (const [k,url] of Object.entries({
            advanced:'https://services.arcgis.com/jIL9msH9OI208GCb/ArcGIS/rest/services/Vivid_Advanced_Blocks_Publication_View/FeatureServer/0',
            standard:'https://services.arcgis.com/jIL9msH9OI208GCb/ArcGIS/rest/services/Vivid_Standard_Blocks_Publication_View/FeatureServer/0'
          })) {
            try { const j=await queryArcgis(url); out.vivid[k]={count:j.features?.length??0,features:(j.features||[]).slice(0,20).map(f=>({attributes:f.attributes,geometry_bbox:geomBbox(f.geometry)})),error:j.error??null}; }
            catch(e){ out.vivid[k]={error:String(e?.message||e)}; }
          }

          // 2) Open commercial SAR: exact polygon footprint scan over current normalized catalogue.
          try {
            const r=await fetch('https://raw.githubusercontent.com/pmuguda/open-sar-triad/main/data/scenes.geojson');
            if(!r.ok) throw new Error(`HTTP ${r.status}`);
            const fc=await r.json();
            const providers={};
            for(const f of fc.features||[]){
              const p=f.properties?.provider||'unknown';
              providers[p] ||= {total:0,point_hits:[],aoi_hits:[]}; providers[p].total++;
              const bb=geomBbox(f.geometry);
              if(pointInGeom([point.longitude,point.latitude],f.geometry)) providers[p].point_hits.push({properties:f.properties,geometry_bbox:bb});
              if(bboxOverlap(bb,aoi) && geomIntersectsBox(f.geometry,aoi)) providers[p].aoi_hits.push({properties:f.properties,geometry_bbox:bb});
            }
            out.open_sar={generated_at:fc.generated_at??null,source:fc.source??null,providers};
          } catch(e){ out.open_sar={error:String(e?.stack||e)}; }

          // 3) Sentinel-2 L2A and Sentinel-1 GRD supporting candidates from Earth Search.
          async function earthSearch(collection, start, end, limit=100){
            const r=await fetch('https://earth-search.aws.element84.com/v1/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({collections:[collection],bbox:aoi,datetime:`${start}/${end}`,limit})});
            if(!r.ok) throw new Error(`${collection} ${r.status}: ${await r.text()}`); return (await r.json()).features||[];
          }
          const windows={
            pre_earthworks:['2020-05-01T00:00:00Z','2020-06-25T23:59:59Z'],
            earthworks_2020:['2020-07-01T00:00:00Z','2020-11-30T23:59:59Z'],
            post_work:['2021-05-01T00:00:00Z','2021-10-31T23:59:59Z'],
            slope_model_period:['2022-04-01T00:00:00Z','2023-09-30T23:59:59Z'],
            current:['2025-04-01T00:00:00Z','2026-08-27T23:59:59Z']
          };
          out.sentinel={};
          for(const [phase,[start,end]] of Object.entries(windows)){
            out.sentinel[phase]={};
            try{
              const f=await earthSearch('sentinel-2-l2a',start,end,100);
              const rows=f.map(x=>({id:x.id,datetime:x.properties?.datetime,cloud:x.properties?.['eo:cloud_cover'],platform:x.properties?.platform,geometry_bbox:geomBbox(x.geometry),self:x.links?.find(l=>l.rel==='self')?.href??null}));
              rows.sort((a,b)=>(a.cloud??999)-(b.cloud??999)||String(b.datetime).localeCompare(String(a.datetime)));
              out.sentinel[phase].s2={count:f.length,best_low_cloud:rows.slice(0,8),latest:[...rows].sort((a,b)=>String(b.datetime).localeCompare(String(a.datetime))).slice(0,5)};
            }catch(e){out.sentinel[phase].s2={error:String(e?.message||e)}}
            try{
              const f=await earthSearch('sentinel-1-grd',start,end,100);
              const rows=f.map(x=>({id:x.id,datetime:x.properties?.datetime,mode:x.properties?.['sar:instrument_mode'],orbit:x.properties?.['sat:orbit_state'],polarizations:x.properties?.['sar:polarizations'],range_res_m:x.properties?.['sar:resolution_range'],azimuth_res_m:x.properties?.['sar:resolution_azimuth'],geometry_bbox:geomBbox(x.geometry),self:x.links?.find(l=>l.rel==='self')?.href??null}));
              out.sentinel[phase].s1_grd={count:f.length,latest:rows.sort((a,b)=>String(b.datetime).localeCompare(String(a.datetime))).slice(0,8)};
            }catch(e){out.sentinel[phase].s1_grd={error:String(e?.message||e)}}
          }

          // Sentinel-1 SLC metadata via ASF Search API for each phase (no download/auth needed for metadata search).
          out.sentinel1_slc={};
          for(const [phase,[start,end]] of Object.entries(windows)){
            try{
              const u=new URL('https://api.daac.asf.alaska.edu/services/search/param');
              u.search=new URLSearchParams({dataset:'SENTINEL-1',processingLevel:'SLC',intersectsWith:`point(${point.longitude} ${point.latitude})`,start,end,output:'geojson',maxResults:'50'}).toString();
              const r=await fetch(u); if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
              const j=await r.json();
              const feats=Array.isArray(j)?j.flatMap(x=>x.features||[]):(j.features||[]);
              out.sentinel1_slc[phase]={count:feats.length,latest:feats.map(x=>({id:x.properties?.fileID??x.properties?.sceneName??x.id,datetime:x.properties?.startTime??x.properties?.startTimeUTC??null,beamMode:x.properties?.beamModeType,polarization:x.properties?.polarization,flightDirection:x.properties?.flightDirection,geometry_bbox:geomBbox(x.geometry)})).sort((a,b)=>String(b.datetime).localeCompare(String(a.datetime))).slice(0,8)};
            }catch(e){out.sentinel1_slc[phase]={error:String(e?.message||e)}}
          }

          console.log('FTI_RESULT_BEGIN');
          console.log(JSON.stringify(out));
          console.log('FTI_RESULT_END');
          NODE
          node audit.mjs
