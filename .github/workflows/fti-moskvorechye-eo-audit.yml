name: FTI Moskvorechye EO Archive Audit

on:
  push:
    paths:
      - '.github/workflows/fti-moskvorechye-eo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pixel-verification clients
        run: |
          mkdir -p /tmp/fti-pixels
          cd /tmp/fti-pixels
          npm init -y >/dev/null 2>&1
          npm install --silent @esri/wayback-core@1.1.0 sharp

      - name: Verify VHR pixels plus location-specific capture metadata
        working-directory: /tmp/fti-pixels
        run: |
          cat > pixel_gate.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import sharp from 'sharp';
          import { getWaybackItems, getMetadata } from '@esri/wayback-core';

          const point={longitude:37.6878,latitude:55.6405};
          const aoi=[37.6719,55.6315,37.7037,55.6495];
          const samplePoints=[
            point,
            {longitude:aoi[0],latitude:aoi[1]}, {longitude:aoi[2],latitude:aoi[1]},
            {longitude:aoi[2],latitude:aoi[3]}, {longitude:aoi[0],latitude:aoi[3]},
            {longitude:(aoi[0]+aoi[2])/2,latitude:aoi[1]}, {longitude:(aoi[0]+aoi[2])/2,latitude:aoi[3]},
            {longitude:aoi[0],latitude:(aoi[1]+aoi[3])/2}, {longitude:aoi[2],latitude:(aoi[1]+aoi[3])/2}
          ];
          const iso=ms=>ms?new Date(ms).toISOString():null;
          const tileXY=(lon,lat,z)=>{
            const n=2**z;
            const x=Math.floor((lon+180)/360*n);
            const r=lat*Math.PI/180;
            const y=Math.floor((1-Math.asinh(Math.tan(r))/Math.PI)/2*n);
            return {x,y,z};
          };
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const items=await getWaybackItems();
          const targetAcq=['2021-07-07','2024-09-17','2025-03-20'];
          const found=[];
          for(const item of items){
            let m;
            try{m=await getMetadata(point,18,item.releaseNum);}catch{continue;}
            const date=iso(m?.date)?.slice(0,10);
            if(!targetAcq.includes(date) || !(Number(m?.resolution)<=0.5)) continue;
            if(found.some(x=>x.acquisition_date===date)) continue;
            const samples=[];
            for(const p of samplePoints){
              try{
                const sm=await getMetadata(p,18,item.releaseNum);
                samples.push({lon:p.longitude,lat:p.latitude,acquisition_date:iso(sm?.date),provider:sm?.provider??null,sensor:sm?.source??null,resolution_m:sm?.resolution??null});
              }catch(e){samples.push({lon:p.longitude,lat:p.latitude,error:String(e?.message||e)});}
            }
            const t=tileXY(point.longitude,point.latitude,18);
            const url=item.itemURL.replace('{level}',String(t.z)).replace('{row}',String(t.y)).replace('{col}',String(t.x));
            const r=await fetch(url);
            if(!r.ok) throw new Error(`Wayback tile ${date} HTTP ${r.status}`);
            const buf=Buffer.from(await r.arrayBuffer());
            const im=sharp(buf);
            const md=await im.metadata();
            const stats=await im.stats();
            const stdev=stats.channels.map(c=>c.stdev);
            const nonblank=buf.length>5000 && md.width>=128 && md.height>=128 && stdev.some(v=>Number(v)>2);
            const fname=`wayback_${date}_${m?.source??'sensor'}_z18.jpg`.replace(/[^A-Za-z0-9_.-]/g,'_');
            fs.writeFileSync(fname,buf);
            found.push({
              acquisition_date:date,
              release_date:item.releaseDateLabel,
              release_num:item.releaseNum,
              arcgis_item_id:item.itemID,
              metadata_item_id:item.metadataLayerItemID,
              provider:m?.provider??null,sensor:m?.source??null,resolution_m:m?.resolution??null,accuracy_m:m?.accuracy??null,
              center_tile:{url,z:t.z,x:t.x,y:t.y,http_status:r.status,content_type:r.headers.get('content-type'),bytes:buf.length,width:md.width,height:md.height,sha256:hash(buf),channel_stdev:stdev,decoded_nonblank:nonblank,file:fname},
              coverage_samples:samples,
              full_aoi_same_capture:samples.every(s=>s.acquisition_date?.slice(0,10)===date && s.sensor===m?.source && Number(s.resolution_m)===Number(m?.resolution)),
              pixel_status:nonblank?'VERIFIED_PIXELS':'PIXELS_FAILED_VALIDATION'
            });
          }
          found.sort((a,b)=>a.acquisition_date.localeCompare(b.acquisition_date));
          const out={generated_at:new Date().toISOString(),aoi:{point,bbox:aoi},source:'Esri World Imagery Wayback derivative tiles + location-specific Wayback metadata',classification:'VHR_DERIVATIVE_NOT_VENDOR_ORIGINAL',records:found,hard_gate_pass:found.length===3 && found.every(x=>x.pixel_status==='VERIFIED_PIXELS')};
          fs.writeFileSync('vhr_pixel_gate.json',JSON.stringify(out,null,2));
          console.log('FTI_PIXEL_RESULT_BEGIN');
          console.log(JSON.stringify(out));
          console.log('FTI_PIXEL_RESULT_END');
          if(!out.hard_gate_pass) process.exitCode=2;
          NODE
          node pixel_gate.mjs

      - name: Upload verified VHR pixel package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moskvorechye-vhr-pixel-gate
          path: |
            /tmp/fti-pixels/vhr_pixel_gate.json
            /tmp/fti-pixels/wayback_*.jpg
          if-no-files-found: warn
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Wayback core
        run: |
          mkdir -p /tmp/fti-eo
          cd /tmp/fti-eo
          npm init -y >/dev/null 2>&1
          npm install --silent @esri/wayback-core@1.1.0

      - name: Recheck location-specific VHR metadata and open commercial SAR footprints
        working-directory: /tmp/fti-eo
        run: |
          cat > audit.mjs <<'NODE'
          import { getWaybackItems, getMetadata } from '@esri/wayback-core';
          const point={longitude:37.6878,latitude:55.6405};
          const aoi=[37.6719,55.6315,37.7037,55.6495];
          const iso=ms=>ms?new Date(ms).toISOString():null;
          const pointInRing=(pt,ring)=>{let inside=false;const[x,y]=pt;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const[xi,yi]=ring[i],[xj,yj]=ring[j];const hit=((yi>y)!==(yj>y))&&x<(xj-xi)*(y-yi)/((yj-yi)||1e-15)+xi;if(hit)inside=!inside;}return inside;};
          const pointInGeom=(pt,g)=>g?.type==='Polygon'?pointInRing(pt,g.coordinates[0]):g?.type==='MultiPolygon'?g.coordinates.some(p=>pointInRing(pt,p[0])):false;
          const bbox=(g)=>{const p=[];const w=x=>Array.isArray(x)&&typeof x[0]==='number'?p.push(x):Array.isArray(x)&&x.forEach(w);w(g?.coordinates);return p.length?[Math.min(...p.map(x=>x[0])),Math.min(...p.map(x=>x[1])),Math.max(...p.map(x=>x[0])),Math.max(...p.map(x=>x[1]))]:null;};
          const bbHit=(b,a)=>b&&!(b[2]<a[0]||b[0]>a[2]||b[3]<a[1]||b[1]>a[3]);
          const out={generated_at:new Date().toISOString(),point,aoi,wayback:[],open_sar:{}};
          for(const item of await getWaybackItems()){
            if(item.releaseDateLabel<'2019-01-01') continue;
            try{const m=await getMetadata(point,18,item.releaseNum);if(m?.date)out.wayback.push({release_date:item.releaseDateLabel,release_num:item.releaseNum,acquisition_date:iso(m.date),provider:m.provider??null,sensor:m.source??null,resolution_m:m.resolution??null,accuracy_m:m.accuracy??null});}catch{}
          }
          const r=await fetch('https://raw.githubusercontent.com/pmuguda/open-sar-triad/main/data/scenes.geojson');
          if(!r.ok) throw new Error(`open-sar ${r.status}`);
          const fc=await r.json();
          for(const f of fc.features||[]){const p=f.properties?.provider||'unknown';out.open_sar[p]??={total:0,point_hits:0,aoi_bbox_candidates:0};out.open_sar[p].total++;if(pointInGeom([point.longitude,point.latitude],f.geometry))out.open_sar[p].point_hits++;if(bbHit(bbox(f.geometry),aoi))out.open_sar[p].aoi_bbox_candidates++;}
          out.open_sar_catalog_generated_at=fc.generated_at??null;
          console.log('FTI_AUDIT_RESULT_BEGIN');console.log(JSON.stringify(out));console.log('FTI_AUDIT_RESULT_END');
          NODE
          node audit.mjs
