name: FTI Moskvorechye EO Archive Audit

on:
  push:
    paths:
      - '.github/workflows/fti-moskvorechye-eo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install bounded VHR verifier
        run: |
          mkdir -p /tmp/fti-pixels && cd /tmp/fti-pixels
          npm init -y >/dev/null 2>&1
          npm install --silent @esri/wayback-core@1.1.0 sharp
      - name: Verify pixels and capture metadata
        working-directory: /tmp/fti-pixels
        run: |
          cat > pixel_gate.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import sharp from 'sharp';
          import { getWaybackItems, getMetadata } from '@esri/wayback-core';

          const point={longitude:37.6878,latitude:55.6405};
          const aoi=[37.6719,55.6315,37.7037,55.6495];
          const targets=[
            {release:17825,expected:'2021-07-07'},
            {release:34007,expected:'2024-09-17'},
            {release:26334,expected:'2025-03-20'}
          ];
          const samplePoints=[point,
            {longitude:aoi[0],latitude:aoi[1]},{longitude:aoi[2],latitude:aoi[1]},
            {longitude:aoi[2],latitude:aoi[3]},{longitude:aoi[0],latitude:aoi[3]}];
          const iso=ms=>ms?new Date(ms).toISOString():null;
          const xy=(lon,lat,z)=>{const n=2**z,r=lat*Math.PI/180;return{x:Math.floor((lon+180)/360*n),y:Math.floor((1-Math.asinh(Math.tan(r))/Math.PI)/2*n),z};};
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const items=await getWaybackItems();
          const byRelease=new Map(items.map(i=>[i.releaseNum,i]));
          const records=[];

          for(const target of targets){
            const item=byRelease.get(target.release);
            if(!item) throw new Error(`Missing Wayback release ${target.release}`);
            const m=await getMetadata(point,18,item.releaseNum);
            const acq=iso(m?.date)?.slice(0,10);
            if(acq!==target.expected) throw new Error(`Capture mismatch release ${target.release}: ${acq}`);
            if(!(Number(m?.resolution)<=0.5)) throw new Error(`Resolution gate failed ${target.release}: ${m?.resolution}`);

            const samples=[];
            for(const p of samplePoints){
              try{const sm=await getMetadata(p,18,item.releaseNum);samples.push({lon:p.longitude,lat:p.latitude,acquisition_date:iso(sm?.date),provider:sm?.provider??null,sensor:sm?.source??null,resolution_m:sm?.resolution??null});}
              catch(e){samples.push({lon:p.longitude,lat:p.latitude,error:String(e?.message||e)});}
            }

            const t=xy(point.longitude,point.latitude,18);
            const pieces=[];
            for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
              const url=item.itemURL.replace('{level}',String(t.z)).replace('{row}',String(t.y+dy)).replace('{col}',String(t.x+dx));
              const r=await fetch(url); if(!r.ok) throw new Error(`tile ${target.expected} ${dx},${dy} HTTP ${r.status}`);
              const b=Buffer.from(await r.arrayBuffer());
              const md=await sharp(b).metadata();
              pieces.push({input:b,left:(dx+1)*256,top:(dy+1)*256,url,bytes:b.length,width:md.width,height:md.height});
            }
            const composite=await sharp({create:{width:768,height:768,channels:3,background:{r:0,g:0,b:0}}}).composite(pieces.map(p=>({input:p.input,left:p.left,top:p.top}))).jpeg({quality:92}).toBuffer();
            const stats=await sharp(composite).stats();
            const md=await sharp(composite).metadata();
            const stdev=stats.channels.map(c=>c.stdev);
            const nonblank=composite.length>20000 && stdev.some(v=>Number(v)>2);
            const fname=`moskvorechye_${target.expected}_${String(m?.source??'sensor').replace(/[^A-Za-z0-9_.-]/g,'_')}_vhr.jpg`;
            fs.writeFileSync(fname,composite);
            records.push({
              acquisition_date:target.expected,release_date:item.releaseDateLabel,release_num:item.releaseNum,
              arcgis_item_id:item.itemID,metadata_item_id:item.metadataLayerItemID,
              provider:m?.provider??null,sensor:m?.source??null,resolution_m:m?.resolution??null,accuracy_m:m?.accuracy??null,
              pixel_product:{file:fname,width:md.width,height:md.height,bytes:composite.length,sha256:sha(composite),channel_stdev:stdev,decoded_nonblank:nonblank,webmercator_zoom:18,tile_grid:'3x3 around anchor'},
              coverage_samples:samples,
              full_aoi_same_capture:samples.every(s=>s.acquisition_date?.slice(0,10)===target.expected && s.sensor===m?.source && Number(s.resolution_m)===Number(m?.resolution)),
              pixel_status:nonblank?'VERIFIED_PIXELS':'PIXELS_FAILED_VALIDATION',
              provenance:'Esri World Imagery Wayback derivative pixels; location-specific metadata tied to same release'
            });
          }
          const out={generated_at:new Date().toISOString(),aoi:{point,bbox:aoi},classification:'VHR_DERIVATIVE_NOT_VENDOR_ORIGINAL',records,hard_gate_pass:records.length===3&&records.every(r=>r.pixel_status==='VERIFIED_PIXELS')};
          fs.writeFileSync('vhr_pixel_gate.json',JSON.stringify(out,null,2));
          console.log('FTI_PIXEL_RESULT_BEGIN');console.log(JSON.stringify(out));console.log('FTI_PIXEL_RESULT_END');
          if(!out.hard_gate_pass) process.exitCode=2;
          NODE
          node pixel_gate.mjs
      - name: Upload VHR pixel package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moskvorechye-vhr-pixel-gate
          path: |
            /tmp/fti-pixels/vhr_pixel_gate.json
            /tmp/fti-pixels/moskvorechye_*_vhr.jpg
          if-no-files-found: warn
          retention-days: 7

  open-sar-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Spatially test current open commercial SAR catalogs
        run: |
          node <<'NODE'
          const pt=[37.6878,55.6405],aoi=[37.6719,55.6315,37.7037,55.6495];
          const ringHit=(p,r)=>{let i=false;for(let a=0,b=r.length-1;a<r.length;b=a++){const[x,y]=p,[xi,yi]=r[a],[xj,yj]=r[b];if(((yi>y)!==(yj>y))&&x<(xj-xi)*(y-yi)/((yj-yi)||1e-15)+xi)i=!i;}return i;};
          const geomPt=g=>g?.type==='Polygon'?ringHit(pt,g.coordinates[0]):g?.type==='MultiPolygon'?g.coordinates.some(p=>ringHit(pt,p[0])):false;
          const coords=g=>{const o=[];const w=x=>Array.isArray(x)&&typeof x[0]==='number'?o.push(x):Array.isArray(x)&&x.forEach(w);w(g?.coordinates);return o;};
          const bb=g=>{const p=coords(g);return p.length?[Math.min(...p.map(x=>x[0])),Math.min(...p.map(x=>x[1])),Math.max(...p.map(x=>x[0])),Math.max(...p.map(x=>x[1]))]:null;};
          const hit=(b,a)=>b&&!(b[2]<a[0]||b[0]>a[2]||b[3]<a[1]||b[1]>a[3]);
          const r=await fetch('https://raw.githubusercontent.com/pmuguda/open-sar-triad/main/data/scenes.geojson');if(!r.ok)throw new Error(String(r.status));const fc=await r.json();
          const p={};for(const f of fc.features||[]){const k=f.properties?.provider||'unknown';p[k]??={total:0,point_hits:0,aoi_bbox_candidates:0};p[k].total++;if(geomPt(f.geometry))p[k].point_hits++;if(hit(bb(f.geometry),aoi))p[k].aoi_bbox_candidates++;}
          console.log('FTI_OPEN_SAR_RESULT_BEGIN');console.log(JSON.stringify({catalog_generated_at:fc.generated_at??null,source:fc.source??null,providers:p}));console.log('FTI_OPEN_SAR_RESULT_END');
          NODE
