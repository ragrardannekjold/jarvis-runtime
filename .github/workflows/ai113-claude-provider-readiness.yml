name: AI-113 Claude Readiness Contract (No Provider Call)

run-name: AI-113 readiness schema audit — no Claude API call

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/provider-readiness/**'
      - '.github/workflows/ai113-claude-provider-readiness.yml'

permissions:
  contents: read

concurrency:
  group: ai113-claude-provider-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDE_API_KEY_REF: ${{ vars.CLAUDE_API_KEY_REF }}
    steps:
      - name: Checkout public runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify secret-isolated readiness schema
        run: node --test runtime/provider-readiness/claude-readiness.test.mjs

      - name: Emit sanitized blocker/readiness schema
        run: node runtime/provider-readiness/claude-readiness-worker.mjs
