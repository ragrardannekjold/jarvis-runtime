name: Superteam Agent Recon (ephemeral)

on:
  push:
    branches: [main]
    paths:
      - 'runtime/superteam-recon-trigger.txt'

permissions:
  contents: read

concurrency:
  group: superteam-agent-recon
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout private command center on isolated result branch
        uses: actions/checkout@v4
        with:
          repository: ragrardannekjold/jarvis-command-center
          token: ${{ secrets.COMMAND_CENTER_TOKEN }}
          ref: main
          path: command-center
          fetch-depth: 1
          persist-credentials: true

      - name: Register ephemeral agent and fetch agent-eligible listings
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p command-center/runtime/revenue
          python - <<'PY'
          import json, os, re, urllib.request, urllib.parse

          BASE = 'https://superteam.fun'
          run_id = os.environ.get('RUN_ID', 'unknown')
          agent_name = f'aiq-revenue-recon-{run_id}'

          def req(url, *, method='GET', payload=None, token=None):
              headers = {'Accept': 'application/json', 'User-Agent': 'jarvis-revenue-recon/1.0'}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          reg = req(f'{BASE}/api/agents', method='POST', payload={'name': agent_name})
          api_key = reg.get('apiKey')
          if not api_key:
              raise SystemExit('registration did not return a usable apiKey')

          live = req(f'{BASE}/api/agents/listings/live?take=100&deadline=2026-12-31', token=api_key)

          secret_keys = re.compile(r'(api.?key|claim.?code|authorization|token|secret|privy)', re.I)
          def sanitize(obj):
              if isinstance(obj, dict):
                  return {str(k): sanitize(v) for k, v in obj.items() if not secret_keys.search(str(k))}
              if isinstance(obj, list):
                  return [sanitize(v) for v in obj]
              return obj

          slugs = []
          def collect_slugs(obj):
              if isinstance(obj, dict):
                  slug = obj.get('slug')
                  if isinstance(slug, str) and slug and slug not in slugs:
                      slugs.append(slug)
                  for value in obj.values():
                      collect_slugs(value)
              elif isinstance(obj, list):
                  for value in obj:
                      collect_slugs(value)
          collect_slugs(live)

          details = []
          for slug in slugs[:80]:
              try:
                  detail = req(
                      f'{BASE}/api/agents/listings/details/{urllib.parse.quote(slug, safe="")}',
                      token=api_key,
                  )
                  details.append({'slug': slug, 'detail': sanitize(detail)})
              except Exception as exc:
                  details.append({'slug': slug, 'detail_error': type(exc).__name__})

          output = {
              'source': 'https://superteam.fun/skill.md',
              'discovery_mode': 'official_authenticated_agent_api',
              'captured_at_run': run_id,
              'agent': {
                  'agentId': reg.get('agentId'),
                  'username': reg.get('username'),
                  'ephemeral': True,
                  'credentials_persisted': False,
                  'claim_code_persisted': False
              },
              'live_feed': sanitize(live),
              'details': details,
              'slugs_found': len(slugs),
              'details_attempted': len(details)
          }
          path = 'command-center/runtime/revenue/superteam-agent-recon-latest.json'
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump(output, handle, ensure_ascii=False, indent=2)
          print(json.dumps({
              'status': 'ok',
              'agentId': reg.get('agentId'),
              'username': reg.get('username'),
              'slugs_found': len(slugs),
              'details_attempted': len(details),
              'credentials_persisted': False
          }))
          PY

      - name: Persist sanitized result to isolated private branch
        working-directory: command-center
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jarvis-runtime'
          git config user.email 'jarvis-runtime@users.noreply.github.com'
          git checkout -B runtime-superteam-recon
          git add runtime/revenue/superteam-agent-recon-latest.json
          git commit -m 'capture sanitized Superteam agent-eligible listings' || true
          git push --force origin HEAD:runtime-superteam-recon
