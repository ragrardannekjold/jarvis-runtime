name: AI39 SAR urban-mask persistence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sar_urban:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests numpy rasterio pystac-client planetary-computer
      - name: Compare same-orbit SAR change inside historic built-area masks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, math, datetime
          from collections import defaultdict
          import requests, numpy as np, rasterio
          from rasterio.warp import reproject
          from rasterio.enums import Resampling
          from rasterio.transform import from_bounds
          from pystac_client import Client
          import planetary_computer

          AOI=[37.65,48.45,38.25,48.90]
          W,H=900,700
          dst_tr=from_bounds(*AOI,W,H)
          # Broad city-scale zones only. Coordinates are not emitted in output.
          ZONES={
            'URB-CHASIV': [37.76,48.535,37.91,48.655],
            'URB-BAKHMUT':[37.90,48.525,38.09,48.675],
            'URB-SOLEDAR':[38.02,48.615,38.19,48.775],
          }

          def zone_mask(bbox):
              xmin,ymin,xmax,ymax=AOI
              zx0,zy0,zx1,zy1=bbox
              xs=np.linspace(xmin,xmax,W,endpoint=False)+(xmax-xmin)/(2*W)
              ys=np.linspace(ymax,ymin,H,endpoint=False)-(ymax-ymin)/(2*H)
              xx,yy=np.meshgrid(xs,ys)
              return (xx>=zx0)&(xx<=zx1)&(yy>=zy0)&(yy<=zy1)
          ZM={k:zone_mask(v) for k,v in ZONES.items()}

          # Historic landcover prior: built area vs crops as matched local control.
          pc=Client.open('https://planetarycomputer.microsoft.com/api/stac/v1', modifier=planetary_computer.sign_inplace)
          litems=list(pc.search(collections=['io-lulc-9-class'],bbox=AOI,datetime='2023-01-01/2023-12-31').items())
          lc=np.zeros((H,W),np.uint8); lc_ids=[]
          for it in litems:
              asset=it.assets.get('data') or it.assets.get('map') or next((a for a in it.assets.values() if a.href.lower().endswith(('.tif','.tiff'))),None)
              if not asset: continue
              tmp=np.zeros((H,W),np.uint8)
              try:
                  with rasterio.open(asset.href) as ds:
                      reproject(source=rasterio.band(ds,1),destination=tmp,src_transform=ds.transform,src_crs=ds.crs,
                                src_nodata=ds.nodata,dst_transform=dst_tr,dst_crs='EPSG:4326',dst_nodata=0,resampling=Resampling.nearest)
                  m=tmp>0; lc[m]=tmp[m]; lc_ids.append(it.id)
              except Exception: pass
          if (lc>0).mean()<0.5: raise SystemExit('Insufficient landcover coverage')

          STAC='https://earth-search.aws.element84.com/v1/search'
          r=requests.post(STAC,json={'collections':['sentinel-1-grd'],'bbox':AOI,
              'datetime':'2026-07-25T00:00:00Z/2026-08-26T00:00:00Z','limit':400,
              'sortby':[{'field':'properties.datetime','direction':'asc'}]},timeout=90)
          r.raise_for_status(); items=r.json().get('features',[])
          by=defaultdict(list)
          meta_by=defaultdict(set)
          for it in items:
              p=it.get('properties',{}); dt=(p.get('datetime') or '')[:10]; orb=p.get('sat:relative_orbit'); state=p.get('sat:orbit_state')
              if orb is None or not dt: continue
              if not ((it.get('assets',{}).get('vv') or {}).get('href')): continue
              key=(dt,int(orb),state)
              by[key].append(it)
              meta_by[key].add(p.get('platform') or 'unknown')

          # Build latest available ~12-day same-orbit pairs per orbit/state.
          groups=defaultdict(list)
          for (dt,orb,state) in by:
              groups[(orb,state)].append(dt)
          pairs=[]
          for (orb,state),dates in groups.items():
              dates=sorted(set(dates))
              for j in range(1,len(dates)):
                  b=datetime.date.fromisoformat(dates[j])
                  candidates=[]
                  for i in range(j):
                      a=datetime.date.fromisoformat(dates[i]); dd=(b-a).days
                      if 10 <= dd <= 14: candidates.append((abs(dd-12),dates[i]))
                  if candidates:
                      a=min(candidates)[1]
                      pairs.append((a,dates[j],orb,state))
          # Prefer recent post dates, cap work.
          pairs=sorted(set(pairs), key=lambda x:x[1], reverse=True)[:10]

          def mosaic(date,orb,state,band):
              dst=np.zeros((H,W),np.float32); valid=np.zeros((H,W),bool); ids=[]; plats=set()
              for it in by.get((date,orb,state),[]):
                  href=(it.get('assets',{}).get(band) or {}).get('href')
                  if not href: continue
                  tmp=np.zeros((H,W),np.float32)
                  try:
                      with rasterio.Env(AWS_NO_SIGN_REQUEST='YES',GDAL_DISABLE_READDIR_ON_OPEN='EMPTY_DIR'):
                          with rasterio.open(href) as ds:
                              reproject(source=rasterio.band(ds,1),destination=tmp,src_transform=ds.transform,src_crs=ds.crs,
                                  src_nodata=ds.nodata,dst_transform=dst_tr,dst_crs='EPSG:4326',dst_nodata=0,resampling=Resampling.average)
                  except Exception: continue
                  m=np.isfinite(tmp)&(tmp>0); fill=m&~valid; dst[fill]=tmp[fill]; valid[fill]=True
                  ids.append(it.get('id')); plats.add((it.get('properties') or {}).get('platform') or 'unknown')
              return dst,valid,sorted(set(ids)),sorted(plats)

          def stats(dvv,dvh,mask):
              if mask.sum()<80: return None
              x1=dvv[mask]; x2=dvh[mask]
              return {
                'n':int(mask.sum()),
                'median_abs_vv_db':round(float(np.median(np.abs(x1))),3),
                'median_abs_vh_db':round(float(np.median(np.abs(x2))),3),
                'median_signed_vv_db':round(float(np.median(x1)),3),
                'median_signed_vh_db':round(float(np.median(x2)),3),
                'pct_any_abs_change_ge_3db':round(float(((np.abs(x1)>=3)|(np.abs(x2)>=3)).mean()*100),3),
              }

          pair_rows=[]
          zone_evidence=defaultdict(list)
          for a,b,orb,state in pairs:
              avv,avm,aids,apl=mosaic(a,orb,state,'vv'); bvv,bvm,bids,bpl=mosaic(b,orb,state,'vv')
              avh,ahm,_,_=mosaic(a,orb,state,'vh'); bvh,bhm,_,_=mosaic(b,orb,state,'vh')
              valid=avm&bvm&ahm&bhm
              if valid.mean()<0.05: continue
              eps=1e-6
              dvv=10*np.log10(np.maximum(bvv,eps))-10*np.log10(np.maximum(avv,eps))
              dvh=10*np.log10(np.maximum(bvh,eps))-10*np.log10(np.maximum(avh,eps))
              zr={}
              for z,zm in ZM.items():
                  bm=valid&zm&(lc==7); cm=valid&zm&(lc==5)
                  bs=stats(dvv,dvh,bm); cs=stats(dvv,dvh,cm)
                  rec={'built':bs,'crop_control':cs}
                  if bs and cs:
                      rec['pct3_excess_pp']=round(bs['pct_any_abs_change_ge_3db']-cs['pct_any_abs_change_ge_3db'],3)
                      rec['median_abs_excess_db']=round(0.5*(bs['median_abs_vv_db']+bs['median_abs_vh_db'])-0.5*(cs['median_abs_vv_db']+cs['median_abs_vh_db']),3)
                      positive=(rec['pct3_excess_pp']>=1.0 and rec['median_abs_excess_db']>=0.2 and bs['pct_any_abs_change_ge_3db']>=2.0)
                      rec['built_specific_change_test']=bool(positive)
                      zone_evidence[z].append(bool(positive))
                  zr[z]=rec
              pair_rows.append({'pair':[a,b],'relative_orbit':orb,'orbit_state':state,'pre_platforms':apl,'post_platforms':bpl,
                                'pre_product_ids':aids,'post_product_ids':bids,'valid_overlap_pct':round(float(valid.mean()*100),2),'zones':zr})

          summary={}
          for z in ZONES:
              ev=zone_evidence.get(z,[]); positives=sum(ev)
              summary[z]={
                'usable_discriminating_pairs':len(ev),
                'positive_built_specific_pairs':positives,
                'decision':'REPEATED_BUILT_CHANGE_LEAD' if positives>=2 else ('SINGLE_PAIR_LEAD' if positives==1 else 'NO_REPEATED_BUILT_SPECIFIC_SAR_SIGNAL'),
                'limit':'Absence of repeated broad built-mask SAR change does not exclude local/sub-resolution repair or human presence.'
              }

          out={
            'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'scope':'Broad city-scale SAR change inside historical built-area masks; no current positions or routes.',
            'landcover_prior':'Impact Observatory 2023 class 7 built area; class 5 crops used as local seasonal/moisture control.',
            'landcover_item_ids':sorted(set(lc_ids)),
            'semantic_zones':list(ZONES.keys()),
            'summary':summary,
            'pairs':pair_rows,
            'truth_rules':['SAR_CHANGE != PEOPLE','HISTORIC_BUILT_MASK != CURRENT_OCCUPANCY','NO_SIGNAL != NO_PEOPLE','SINGLE_PAIR != PERSISTENCE'],
            'safety':'Only broad city-scale semantic zones are emitted; internal bboxes are not emitted in artifact.'
          }
          json.dump(out,open('out/ai39_sar_urbanmask_20260825.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          if not pair_rows: raise SystemExit('No usable same-orbit pairs')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai39-sar-urbanmask-20260825
          path: out/ai39_sar_urbanmask_20260825.json
          if-no-files-found: error
          retention-days: 2
